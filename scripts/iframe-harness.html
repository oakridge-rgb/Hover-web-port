<!doctype html><html><head><meta charset="utf-8"><title>harness</title></head>
<body style="margin:0;background:#0a0908;color:#eee;font-family:monospace">
<div id="log" style="padding:8px;font-size:12px"></div>
<iframe id="eng" style="width:100%;height:70vh;border:1px solid #333"></iframe>
<script>
var log = function(m){ document.getElementById('log').textContent += m + '\n'; };
var t0 = performance.now();
log('booting engine with #open=example.com ...');
var f = document.getElementById('eng');
f.src = 'gn-math.html#open=' + encodeURIComponent('https://example.com');
var seen = '';
var iv = setInterval(function(){
  try{
    var h = f.contentWindow.location.hash;
    var open = !!f.contentDocument.querySelector('#openurl');
    var pill = !!f.contentDocument.querySelector('[data-gn-portable-toolbar]');
    var kids = f.contentDocument.body ? f.contentDocument.body.children.length : -1;
    if (h !== seen){ seen = h; log('t=' + Math.round(performance.now()-t0) + 'ms hash=' + h + ' bodyKids=' + kids + ' home=' + open + ' pill=' + pill); }
    if (kids > 2 && performance.now()-t0 > 20000){ log('final kids=' + kids + ' title=' + f.contentDocument.title); clearInterval(iv); }
  }catch(e){ log('err ' + e.message); clearInterval(iv); }
}, 500);
setTimeout(function(){ clearInterval(iv); log('done watching'); }, 30000);
</script></body></html>
