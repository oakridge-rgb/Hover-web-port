'use strict';
/* ============================================================
   FNF: VS. STATIC — a FATE original mod
   Single file. No assets. Music synthesized live (WebAudio),
   graphics drawn on canvas. Chart & music share one clock.
   ============================================================ */

// ---------- tiny utils ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hash=n=>{n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=n*0x27d4eb2d;n=n^(n>>>15);return (n>>>0)/4294967296;};
const fmtTime=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

// ---------- constants ----------
const W=1280,H=720;
const LANE_COL=['#c24b99','#00e5ff','#3dfa3d','#f9393f'];
const LANE_NAME=['LEFT','DOWN','UP','RIGHT'];
const LANE_ARROW=[-Math.PI/2,Math.PI,0,Math.PI/2]; // left,down,up,right rotation
const KEYMAP={ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3,a:0,A:0,s:1,S:1,w:2,W:2,d:3,D:3};
const JUDGE={sick:.045,good:.095,bad:.140,miss:.165};
const ACCW={sick:1,good:.78,bad:.35};

// ---------- audio engine ----------
let AC=null,master,leadBus,bassBus,drumBus,noiseBuf,delayN;
function initAudio(){
  if(AC){if(AC.state==='suspended'){try{AC.resume()}catch(e){}}return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=.55;
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-16;comp.knee.value=18;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.16;
  master.connect(comp);comp.connect(AC.destination);
  // noise buffer
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  // lead delay bus
  delayN=AC.createDelay(.6);delayN.delayTime.value=.26;
  const fb=AC.createGain();fb.gain.value=.30;
  const wet=AC.createGain();wet.gain.value=.16;
  delayN.connect(fb);fb.connect(delayN);delayN.connect(wet);wet.connect(master);
  leadBus=AC.createGain();leadBus.gain.value=.9;leadBus.connect(master);leadBus.connect(delayN);
  bassBus=AC.createGain();bassBus.gain.value=.9;bassBus.connect(master);
  drumBus=AC.createGain();drumBus.gain.value=.95;drumBus.connect(master);
  if(AC.state==='suspended')AC.resume();
}
const midiF=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,peak,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+a+d);}
function playKick(t){
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(165,t);o.frequency.exponentialRampToValueAtTime(42,t+.11);
  env(g,t,.002,.95,.13);o.connect(g);g.connect(drumBus);o.start(t);o.stop(t+.16);
  const n=AC.createBufferSource();n.buffer=noiseBuf;const ng=AC.createGain(),hp=AC.createBiquadFilter();
  hp.type='highpass';hp.frequency.value=3500;env(ng,t,.001,.25,.02);
  n.connect(hp);hp.connect(ng);ng.connect(drumBus);n.start(t);n.stop(t+.03);
}
function playSnare(t){
  const n=AC.createBufferSource();n.buffer=noiseBuf;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1900;bp.Q.value=.8;
  const g=AC.createGain();env(g,t,.001,.5,.14);
  n.connect(bp);bp.connect(g);g.connect(drumBus);n.start(t);n.stop(t+.2);
  const o=AC.createOscillator(),og=AC.createGain();o.type='triangle';o.frequency.value=190;
  env(og,t,.001,.35,.06);o.connect(og);og.connect(drumBus);o.start(t);o.stop(t+.08);
}
function playHat(t,open){
  const n=AC.createBufferSource();n.buffer=noiseBuf;
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=7600;
  const g=AC.createGain();env(g,t,.001,open?.22:.17,open?.11:.035);
  n.connect(hp);hp.connect(g);g.connect(drumBus);n.start(t);n.stop(t+(open?.15:.06));
}
function playCrash(t){
  const n=AC.createBufferSource();n.buffer=noiseBuf;
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=5200;
  const g=AC.createGain();env(g,t,.002,.3,.7);
  n.connect(hp);hp.connect(g);g.connect(drumBus);n.start(t);n.stop(t+.8);
}
function playBass(t,m,d){
  const f=midiF(m);
  const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=f;
  o2.type='square';o2.frequency.value=f/2;
  lp.type='lowpass';lp.frequency.setValueAtTime(900,t);lp.frequency.exponentialRampToValueAtTime(320,t+d);lp.Q.value=2;
  env(g,t,.004,.42,Math.max(.08,d*.95));
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(bassBus);
  o.start(t);o.stop(t+d+.05);o2.start(t);o2.stop(t+d+.05);
}
function playLead(t,m,d,loud){
  const f=midiF(m),det=7;
  const g=AC.createGain(),lp=AC.createBiquadFilter();
  lp.type='lowpass';lp.frequency.setValueAtTime(2600,t);lp.frequency.exponentialRampToValueAtTime(1100,t+Math.max(.09,d));
  env(g,t,.004,loud?.30:.24,Math.max(.09,d*.92));
  for(const c of [-det,det]){
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=c;
    o.connect(lp);o.start(t);o.stop(t+d+.06);
  }
  lp.connect(g);g.connect(leadBus);
  if(loud){ // chord tone on top
    const o=AC.createOscillator(),g2=AC.createGain();o.type='sawtooth';o.frequency.value=midiF(m+7);
    env(g2,t,.004,.12,Math.max(.09,d*.9));o.connect(g2);g2.connect(leadBus);o.start(t);o.stop(t+d+.06);
  }
}
function playTick(t,hi){
  const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=hi?1200:800;
  env(g,t,.001,.18,.05);o.connect(g);g.connect(drumBus);o.start(t);o.stop(t+.07);
}
function playRiser(t,d){
  const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(950,t+d);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;
  g.gain.setValueAtTime(.0008,t);g.gain.linearRampToValueAtTime(.2,t+d*.85);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
function sfxMiss(){
  if(!AC)return;
  const t=AC.currentTime;
  const n=AC.createBufferSource();n.buffer=noiseBuf;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=850;
  const g=AC.createGain();env(g,t,.001,.25,.11);
  n.connect(lp);lp.connect(g);g.connect(master);n.start(t);n.stop(t+.14);
}
function sfxBlip(hi){
  initAudio();if(!AC)return;playTick(AC.currentTime+.001,hi);
}
function sfxCrashNow(){initAudio();if(!AC)return;playCrash(AC.currentTime+.001);}

// ---------- song authoring helpers ----------
// grid: step 1 = 16th note. bar = 16 steps.
function laneFromMel(state,m,idx){
  if(m>state.m){state.l=clamp(state.l+(m-state.m>2?2:1),0,3);}
  else if(m<state.m){state.l=clamp(state.l-(state.m-m>2?2:1),0,3);}
  else{
    const h=(m*31+idx*7)%4;
    if(h===state.l)state.l=(state.l+1)%4; // mostly move; occasional jack handled by authoring
    else state.l=h;
  }
  state.m=m;return state.l;
}
function newLaneState(startM){return {l:1,m:startM};}

// song object: {id,name,bpm,speed,drain,diff,label,arr:[{n,pat}...]}
// pat(barIdx, t0, ctxObj) where ctxObj={step,barLen,notes,audio,pushNote,pushAudio,...}
function makeBuilder(){
  const b={notes:[],audio:[],len:0};
  b.note=(t,l,hold)=>b.notes.push({t:t,l:l,h:hold||0});
  b.opp =(t,l)=>b.notes.push({t:t,l:l,h:0,who:'opp'});
  b.lead=(t,m,d,loud)=>b.audio.push({t:t,k:'lead',m:m,d:d,loud:loud});
  b.bass=(t,m,d)=>b.audio.push({t:t,k:'bass',m:m,d:d});
  b.drum=(t,k,open)=>b.audio.push({t:t,k:k,open:open});
  b.evt =(t,k)=>b.audio.push({t:t,k:k}); // crash/riser/tick
  return b;
}
function drumsBar(b,t0,step,dv,bars){ // dv: drum variant 'a','b','s','half'
  const st=i=>t0+i*step;
  if(dv==='half'){ b.drum(st(0),'kick');b.drum(st(8),'kick'); if(bars%2===1)b.drum(st(12),'snare'); for(let i=0;i<16;i+=4)b.drum(st(i),'hat'); return;}
  if(dv==='s'){ // shutdown trap
    b.drum(st(0),'kick');b.drum(st(6),'kick');b.drum(st(10),'kick');
    b.drum(st(4),'snare');b.drum(st(12),'snare');
    for(let i=0;i<16;i++)if(i%2===0||hash(i*3+bars)> .5)b.drum(st(i),'hat');
    b.drum(st(15),'hat',true);return;
  }
  if(dv==='b'){
    b.drum(st(0),'kick');b.drum(st(3),'kick');b.drum(st(8),'kick');b.drum(st(11),'kick');
    b.drum(st(4),'snare');b.drum(st(12),'snare');
    for(let i=0;i<16;i+=2)b.drum(st(i),'hat');
    b.drum(st(14),'hat',true);return;
  }
  b.drum(st(0),'kick');b.drum(st(8),'kick');b.drum(st(4),'snare');b.drum(st(12),'snare');
  for(let i=0;i<16;i+=2)b.drum(st(i),'hat');
  if(bars%2===1)b.drum(st(14),'hat',true);
}

// melody line -> audio + notes(who)
function melLine(b,t0,step,arr,who,st){
  for(let i=0;i<arr.length;i++){
    const e=arr[i],s=e[0],m=e[1],len=e[2]||1;
    const dur=len*step*.92;
    b.lead(t0+s*step,m,dur,false);
    if(who==='opp')b.opp(t0+s*step,laneFromMel(b._st2||(b._st2=newLaneState(50)),m,i));
    else b.note(t0+s*step,laneFromMel(b._st1||(b._st1=newLaneState(69)),m,i),len>1?(len*step-.09):0);
  }
}
function bassLine(b,t0,step,arr){
  for(let i=0;i<arr.length;i++){
    const e=arr[i],s=e[0],m=e[1],len=e[2]||1;
    b.bass(t0+s*step,m,len*step*.9);
    b.opp(t0+s*step,laneFromMel(b._st3||(b._st3=newLaneState(45)),m,i));
  }
}
// explicit chart note(s): entry [step,lane] or [step,[lanes],holdSteps]
function chartLine(b,t0,step,arr,withAudio,scaleArr){
  let ai=0;
  for(let i=0;i<arr.length;i++){
    const e=arr[i],s=e[0],lanes=Array.isArray(e[1])?e[1]:[e[1]],hold=e[2]||0;
    for(const l of lanes)b.note(t0+s*step,l,hold?hold*step-.09:0);
    if(withAudio){
      const m=scaleArr?scaleArr[ai%scaleArr.length]:(62+ai%8);
      b.lead(t0+s*step,m,step*.85,lanes.length>1);
      ai+=lanes.length;
    }
  }
}

// ================= SONG 1: INTERFERENCE (128, A minor) =================

    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'a',c.bar);bassLine(b,t0,s,BASS_A);if(c.bar%4===0)b.evt(t0,'crash');}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'a',c.bar);melLine(b,t0,s,(c.bar%4)<2?MEL_A:MEL_A2,'pl');}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'b',c.bar);melLine(b,t0,s,MEL_A2,'pl');bassLine(b,t0,s,BASS_A);if(c.bar%4===0)b.evt(t0,'crash');}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'a',c.bar);melLine(b,t0,s,(c.bar%4)<2?MEL_A2:MEL_A,'pl');}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'b',c.bar);bassLine(b,t0,s,BASS_A);if(c.bar%4===0)b.evt(t0,'crash');}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'b',c.bar);melLine(b,t0,s,MEL_A2,'pl');bassLine(b,t0,s,BASS_A);chartLine(b,t0,s,[[0,[0,3]],[8,[1,2]]],false);}},

// ================= SONG 3: SHUTDOWN (170, D minor) =================

const BASS_S=[[0,38,2],[3,38],[6,41],[8,45,2],[11,44],[12,41],[14,38]];

const DROP_B=[[0,1],[1,1],[2,1],[3,1],[4,2],[5,3],[6,2],[7,0],[8,[1,2]],[9,3],[10,2],[11,0],[12,.5],[12.5,1],[13,2],[13.5,3],[14,2],[14.5,1],[15,3]];
const DROP_C=[[0,[0,3]],[2,[1,2]],[4,[0,2]],[6,[1,3]],[8,[0,3]],[9,1],[10,2],[11,3],[12,[1,2]],[13,0],[14,3],[15,2]];
const DROP_RUN=[[0,0],[1,1],[2,2],[3,3],[4,0],[5,1],[6,2],[7,3],[8,0],[8.5,1],[9,2],[9.5,3],[10,0],[10.5,1],[11,2],[11.5,3],[12,[0,3]],[13,[1,2]],[14,[0,3]],[15,[1,2]]];
const SONG3={

    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'s',c.bar);melLine(b,t0,s,MEL_S,'pl');chartLine(b,t0,s,c.bar%2?[[8,[1,2]]]:[[0,[0,3]],[8,[1,2]]],false);}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'s',c.bar);chartLine(b,t0,s,DROP_A,true,SCALE_S);bassLine(b,t0,s,BASS_S);if(c.bar%4===0)b.evt(t0,'crash');}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'s',c.bar);chartLine(b,t0,s,c.bar%2?DROP_C:DROP_RUN,true,SCALE_S);bassLine(b,t0,s,BASS_S);}},
    {n:2,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'half',c.bar);if(c.bar===0)b.evt(t0,'crash');}},
  ]};

const SONGS=[SONG1,SONG2,SONG3];

// ---------- chart builder ----------
function buildSong(song){
  const b=makeBuilder();
  const spb=60/song.bpm,step=spb/4,barLen=spb*4;
  let bar=0;
  for(const sec of song.arr){
    for(let i=0;i<sec.n;i++){
      sec.pat(b,bar*barLen,step,{bar:bar,secBar:i});
      bar++;
    }
  }
  b.len=bar*barLen;
  b.notes.sort((x,y)=>x.t-y.t);
  b.audio.sort((x,y)=>x.t-y.t);
  return {notes:b.notes,audio:b.audio,len:b.len,step:step,barLen:barLen,song:song};
}

// ---------- layout ----------
const LEAD=2.2;
const OPP_X=[170,270,370,470],PL_X=[810,910,1010,1110],REC_Y=112,NOTE_SPD=430;
const TOUCH=(('ontouchstart' in window)||(navigator.maxTouchPoints>0));

// ---------- game state ----------
const G={
  scene:'menu',time:0,menuSel:0,selIdx:0,
  botplay:false,practice:false,
  cur:null,songRef:null,startRef:0,ai:0,
  plNotes:[],oppNotes:[],oppIdx:0,missIdx:0,botIdx:0,
  score:0,combo:0,maxCombo:0,health:50,misses:0,sicks:0,goods:0,bads:0,accSum:0,accCount:0,
  hold:[null,null,null,null],held:[false,false,false,false],
  rec:[0,0,0,0],orec:[0,0,0,0],
  judge:null,judgeT:9,comboPop:0,
  beat:0,lastBeat:-1,pulse:0,camSide:0,camX:0,
  poseP:0,poseT:9,poseO:0,poseOT:9,missFace:0,
  shake:0,flash:0,paused:false,pauseSel:0,tickIdx:0,
  results:null,dead:false,glitch:0,touchIds:{}
};
function songPos(){return (AC?AC.currentTime:performance.now()/1000)-G.startRef-LEAD;}
function accPct(){if(G.accCount===0)return 100;return 100*G.accSum/G.accCount;}

// ---------- flow ----------
function startSong(i){
  initAudio();
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  const s=SONGS[i];
  G.cur=buildSong(s);G.songRef=s;
  G.plNotes=G.cur.notes.filter(n=>n.who!=='opp');
  G.oppNotes=G.cur.notes.filter(n=>n.who==='opp');
  G.score=0;G.combo=0;G.maxCombo=0;G.health=50;G.misses=0;G.sicks=0;G.goods=0;G.bads=0;
  G.accSum=0;G.accCount=0;G.comboPop=0;G.judge=null;G.judgeT=9;
  G.hold=[null,null,null,null];G.held=[false,false,false,false];
  G.rec=[0,0,0,0];G.orec=[0,0,0,0];
  G.oppIdx=0;G.missIdx=0;G.botIdx=0;G.ai=0;G.tickIdx=0;
  G.paused=false;G.dead=false;G.shake=0;G.flash=1;G.glitch=0;G.camSide=0;G.camX=0;
  G.scene='play';
  G.startRef=AC?AC.currentTime:performance.now()/1000;
}
function quitToSelect(){
  G.scene='select';G.paused=false;G.playing=false;
  if(AC&&AC.state==='suspended')AC.resume();
}
function die(){
  G.dead=true;G.paused=false;
  if(AC){try{AC.suspend()}catch(e){}}
  G.scene='gameover';
}
function finish(){
  const acc=accPct();
  const grade=acc>=99?'S+':acc>=95?'S':acc>=90?'A':acc>=80?'B':acc>=70?'C':'D';
  const r={score:G.score,acc:acc,grade:grade,misses:G.misses,maxCombo:G.maxCombo,
    sicks:G.sicks,goods:G.goods,bads:G.bads,name:G.songRef.name,col:G.songRef.col,
    bot:G.botplay};
  if(!G.botplay){
    const b=store.get('best_'+G.songRef.id);
    if(!b||r.score>b.score)store.set('best_'+G.songRef.id,{score:r.score,acc:acc,grade:grade});
  }
  G.results=r;G.scene='results';G.playing=false;
}

// ---------- judging ----------
function judgeOf(d){return d<=JUDGE.sick?'sick':d<=JUDGE.good?'good':'bad';}
function tryHit(l){
  const sp=songPos();let best=null,bd=1;
  for(let i=0;i<G.plNotes.length;i++){
    const n=G.plNotes[i];
    if(n.t>sp+JUDGE.miss+0.05)break;
    if(n.hit||n.missed||n.l!==l)continue;
    const d=Math.abs(n.t-sp);
    if(d<bd){bd=d;best=n;}
  }
  if(best&&bd<=JUDGE.miss){
    const j=judgeOf(bd);
    best.hit=true;
    G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);G.comboPop=1;
    if(j==='sick'){G.sicks++;G.score+=350;G.health+=2.35;G.accSum+=1;}
    else if(j==='good'){G.goods++;G.score+=200;G.health+=1.0;G.accSum+=.78;}
    else{G.bads++;G.score+=50;G.health+=0.2;G.accSum+=.35;}
    G.accCount++;
    G.health=clamp(G.health,0,100);
    G.judge=j;G.judgeT=G.time;G.rec[l]=1;G.camSide=1;
    G.poseP=l+1;G.poseT=G.time;
    if(best.h>0)G.hold[l]=best;
  }
}
function onMiss(){
  G.combo=0;G.misses++;G.accCount++;
  G.health-=G.songRef.drain>0?8.5:7.5;
  G.judge='miss';G.judgeT=G.time;G.shake=7;G.missFace=1;
  sfxMiss();
}
function pressLane(l){
  if(G.scene!=='play'||G.paused||G.botplay||G.dead)return;
  G.held[l]=true;G.rec[l]=Math.max(G.rec[l],.55);
  tryHit(l);
}
function releaseLane(l){
  G.held[l]=false;
  const hn=G.hold[l];
  if(hn){
    const sp=songPos();
    if(sp<hn.h-0.12){hn.dropped=true;G.hold[l]=null;}
  }
}

// ---------- update ----------
const TICKS=[-1.8,-1.2,-0.6,0];
function updatePlay(dt){
  const sp=songPos();
  const beat=sp/(60/G.songRef.bpm);
  G.beat=beat;
  const b=Math.floor(beat);
  if(b>G.lastBeat&&sp>0){G.lastBeat=b;G.pulse=1;}
  G.pulse=Math.max(0,G.pulse-dt*2.8);
  // countoff ticks
  while(G.tickIdx<TICKS.length&&sp>=TICKS[G.tickIdx]){
    if(AC)playTick(AC.currentTime+0.001,G.tickIdx===3);
    G.tickIdx++;
  }
  // schedule audio
  if(AC){
    while(G.ai<G.cur.audio.length){
      const ev=G.cur.audio[G.ai];
      if(ev.t>sp+0.18)break;
      const when=G.startRef+LEAD+ev.t;
      if(when>=AC.currentTime-0.03){
        if(ev.k==='kick')playKick(when);
        else if(ev.k==='snare')playSnare(when);
        else if(ev.k==='hat')playHat(when,ev.open);
        else if(ev.k==='crash')playCrash(when);
        else if(ev.k==='bass')playBass(when,ev.m,ev.d);
        else if(ev.k==='lead')playLead(when,ev.m,ev.d,ev.loud);
        else if(ev.k==='tick')playTick(when,true);
        else if(ev.k==='riser')playRiser(when,ev.d||1.4);
      }
      G.ai++;
    }
  }
  // opponent auto-hit
  while(G.oppIdx<G.oppNotes.length&&G.oppNotes[G.oppIdx].t<=sp){
    const n=G.oppNotes[G.oppIdx++];
    n.hit=true;G.orec[n.l]=1;
    if(G.songRef.drain>0&&!G.dead)G.health-=G.songRef.drain;
    G.camSide=-1;G.poseO=n.l+1;G.poseOT=G.time;
  }
  // botplay
  if(G.botplay){
    while(G.botIdx<G.plNotes.length&&G.plNotes[G.botIdx].t<=sp){
      const n=G.plNotes[G.botIdx++];
      n.hit=true;G.rec[n.l]=1;G.camSide=1;
      G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);G.comboPop=1;
      G.poseP=n.l+1;G.poseT=G.time;
      if(n.h>0)G.hold[n.l]=n;
    }
  }
  if(G.botplay)G.health=50;
  // player misses
  while(G.missIdx<G.plNotes.length&&G.plNotes[G.missIdx].t<sp-JUDGE.miss){
    const n=G.plNotes[G.missIdx++];
    if(!n.hit&&!n.missed){n.missed=true;onMiss();}
  }
  // sustains
  for(let l=0;l<4;l++){
    const hn=G.hold[l];
    if(!hn)continue;
    if(G.botplay){
      if(sp>=hn.h){G.hold[l]=null;hn.done=true;}
    }else if(!G.held[l]){
      if(sp<hn.h-0.12){hn.dropped=true;G.hold[l]=null;}
      else{G.hold[l]=null;hn.done=true;G.score+=25;}
    }else if(sp>=hn.h){
      G.hold[l]=null;hn.done=true;G.score+=25;G.health=Math.min(100,G.health+.5);
    }else{
      hn.tick=(hn.tick||0)+dt;
      while(hn.tick>0.1){hn.tick-=0.1;G.score+=5;G.health=Math.min(100,G.health+0.3);}
    }
  }
  if(G.practice)G.health=Math.max(G.health,1);
  G.health=clamp(G.health,0,100);
  if(G.health<=0&&!G.practice&&!G.botplay&&!G.dead){die();return;}
  // end
  if(sp>G.cur.len+1.6&&!G.dead){finish();return;}
  // decays
  for(let l=0;l<4;l++){G.rec[l]=Math.max(0,G.rec[l]-dt*5);G.orec[l]=Math.max(0,G.orec[l]-dt*5);}
  G.shake=Math.max(0,G.shake-dt*30);
  G.flash=Math.max(0,G.flash-dt*1.8);
  G.comboPop=Math.max(0,G.comboPop-dt*3.5);
  G.missFace=Math.max(0,G.missFace-dt*2);
  G.camX=lerp(G.camX,G.camSide*55,dt*6);
  G.camSide*= (1-dt*0.8);
  // glitch level (song 3 second half)
  G.glitch=G.songRef.id==='shutdown'&&sp>0&&sp>G.cur.len*0.22?(0.35+0.4*G.pulse+0.25*hash(Math.floor(G.time*13))):0;
}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function arrowPath(s){
  // up arrow, head+stem, size s
  ctx.beginPath();
  ctx.moveTo(0,-s);
  ctx.lineTo(s*0.92,0);
  ctx.lineTo(s*0.38,0);
  ctx.lineTo(s*0.38,s*0.95);
  ctx.lineTo(-s*0.38,s*0.95);
  ctx.lineTo(-s*0.38,0);
  ctx.lineTo(-s*0.92,0);
  ctx.closePath();
}
function drawArrow(x,y,l,size,mode,glowAmt){
  ctx.save();ctx.translate(x,y);ctx.rotate(LANE_ARROW[l]);
  if(mode==='note'||mode==='noteGlow'){
    ctx.shadowColor=LANE_COL[l];ctx.shadowBlur=glowAmt?14:0;
    arrowPath(size);
    ctx.fillStyle=LANE_COL[l];ctx.fill();
    ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.stroke();
    arrowPath(size*0.45);ctx.fillStyle='rgba(255,255,255,.28)';ctx.fill();
  }else{ // receptor
    arrowPath(size);
    if(mode==='press'){ctx.fillStyle='rgba(255,255,255,.22)';ctx.fill();}
    ctx.lineWidth=mode==='press'?5:4;
    ctx.strokeStyle=mode==='press'?'#ffffff':'rgba(160,170,200,.65)';
    ctx.stroke();
  }
  ctx.restore();
}
function drawSustain(x,y0,y1,l){
  const w=26;
  const g=ctx.createLinearGradient(x,y0,x,y1);
  g.addColorStop(0,LANE_COL[l]);g.addColorStop(1,LANE_COL[l]+'88');

}

// ---------- background ----------
function drawBG(pulse,glitch){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b0e1c');g.addColorStop(1,'#05060a');

  ctx.beginPath();ctx.moveTo(0,560);ctx.lineTo(W,560);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

// ---------- play scene render ----------
function drawPlay(){
  const sp=songPos();
  ctx.save();
  if(G.shake>0)ctx.translate((hash(Math.floor(G.time*60))-.5)*G.shake,(hash(Math.floor(G.time*60)+9)-.5)*G.shake);
  const zoom=1+0.028*G.pulse;
  ctx.translate(W/2+G.camX,H/2);ctx.scale(zoom,zoom);ctx.translate(-(W/2+G.camX),-H/2);
  drawBG(G.pulse,G.glitch);
  const beatBop=sp>0?Math.max(0,1-((G.beat%1)+1)%1*2):0;
  drawSpeaker(640,470,1.05,G.pulse);
  const pPose=(G.time-G.poseT<0.38)?G.poseP:0;
  const oPose=(G.time-G.poseOT<0.38)?G.poseO:0;
  drawStaticGuy(300,300,1.0,oPose,beatBop,G.glitch);
  drawKid(980,300,1.0,pPose,beatBop,G.missFace);
  // opponent strums + notes
  for(let l=0;l<4;l++){
    const m=G.orec[l];
    drawArrow(OPP_X[l],REC_Y,l,40,m>0.6?'press':'receptor');
  }
  for(let l=0;l<4;l++){
    const m=G.rec[l];
    const holding=!!G.hold[l];
    drawArrow(PL_X[l],REC_Y,l,40,(m>0.6||holding)?'press':'receptor');
    if(m>0.4)drawArrow(PL_X[l],REC_Y,l,40*(0.9+0.5*m),'noteGlow',1);
  }
  // notes
  const k=NOTE_SPD*G.songRef.speed/2.3;
  for(const n of G.cur.notes){
    const y=REC_Y+(n.t-sp)*k;
    if(y<-140)continue;
    if(y>H+140)break;
    const x=n.who==='opp'?OPP_X[n.l]:PL_X[n.l];
    if(n.who==='opp'){
      if(n.hit)continue;
      drawArrow(x,y,n.l,44,'note',0);
      continue;
    }
    if(n.h>0){
      const y1=REC_Y+(n.t+n.h-sp)*k;
      if(!n.hit&&!n.missed)drawSustain(x,y,y1,n.l);
      else if(G.hold[n.l]===n)drawSustain(x,REC_Y,y1,n.l);
    }
    if(n.hit)continue;
    drawArrow(x,y,n.l,44,'note',0);
  }
  ctx.restore();
  drawHUD(sp);
  // countoff
  if(sp<0.6){
    const n=sp<-1.5?'3':sp<-0.9?'2':sp<-0.3?'1':'GO!!';
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.globalAlpha=0.85;
    ctx.font='900 110px "Arial Black",Arial,sans-serif';
    ctx.fillStyle=n==='GO!!'?'#3dffa0':'#fff';
    ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=10;
    ctx.strokeText(n,W/2,H/2-40);ctx.fillText(n,W/2,H/2-40);
    ctx.restore();
  }
  // shutdown break flash
  if(G.songRef.id==='shutdown'){
    const bs=28*G.cur.barLen,be=30*G.cur.barLen;
    if(sp>bs&&sp<be){
      ctx.save();ctx.textAlign='center';
      ctx.globalAlpha=0.5+0.5*Math.sin(G.time*30);
      ctx.font='900 92px "Arial Black",Arial,sans-serif';
      ctx.fillStyle='#ff3d5e';ctx.strokeStyle='#000';ctx.lineWidth=8;
      ctx.strokeText('XXXX INCOMING',W/2,H/2-60);ctx.fillText('XXXX INCOMING',W/2,H/2-60);
      ctx.restore();
    }
  }
  // glitch slices (device-space blit)
  if(G.glitch>0.45&&hash(Math.floor(G.time*24))>0.72){
    const sy=hash(Math.floor(G.time*31))*H,sh=10+hash(Math.floor(G.time*17))*60;
    const off=(hash(Math.floor(G.time*11))-.5)*70;
    ctx.save();ctx.setTransform(1,0,0,1,0,0);
    ctx.drawImage(cv,0,viewOY+sy*viewScale,cv.width,sh*viewScale,off*viewScale,viewOY+sy*viewScale,cv.width,sh*viewScale);
    ctx.restore();
  }
  // touch pads
  if(TOUCH){
    ctx.save();ctx.globalAlpha=.16;
    for(let l=0;l<4;l++){
      const on=G.held[l];
      ctx.fillStyle=on?LANE_COL[l]:'rgba(255,255,255,.25)';
      rr(PL_X[l]-52,596,104,112,16);ctx.fill();
      ctx.globalAlpha=on?.75:.34;
      drawArrow(PL_X[l],652,l,34,on?'note':'receptor');
      ctx.globalAlpha=.16;
    }
    ctx.restore();
  }
  // pause button
  ctx.save();ctx.globalAlpha=.55;
  ctx.fillStyle='#0d0f1a';ctx.beginPath();ctx.arc(1216,44,26,0,7);ctx.fill();
  ctx.strokeStyle='#7f8cff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(1216,44,26,0,7);ctx.stroke();
  ctx.fillStyle='#aef6ff';ctx.fillRect(1207,33,7,22);ctx.fillRect(1219,33,7,22);
  ctx.restore();
  // CRT scanlines
  ctx.save();ctx.globalAlpha=.05;ctx.fillStyle='#000';
  for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);
  ctx.restore();
  // flash
  if(G.flash>0){ctx.fillStyle='rgba(255,255,255,'+(G.flash*0.5)+')';ctx.fillRect(0,0,W,H);}
}

// ---------- input ----------
function confirmAction(){
  if(G.scene==='menu'){G.scene='select';sfxBlip(true);}
  else if(G.scene==='select'){sfxBlip(true);startSong(G.selIdx);}
  else if(G.scene==='results'){G.scene='select';sfxBlip(false);}
  else if(G.scene==='gameover'){sfxBlip(true);resumeAndRetry();}
}
function resumeAndRetry(){
  if(AC){try{AC.resume()}catch(e){}}
  const idx=SONGS.indexOf(G.songRef);
  startSong(idx);
}
function backAction(){
  if(G.scene==='select'){G.scene='menu';sfxBlip(false);}
  else if(G.scene==='play'&&!G.dead){togglePause();}
  else if(G.scene==='gameover'){if(AC){try{AC.resume()}catch(e){}}quitToSelect();}
}
function togglePause(){
  if(G.scene!=='play'||G.dead)return;
  G.paused=!G.paused;G.pauseSel=0;
  if(AC){if(G.paused){try{AC.suspend()}catch(e){}}else{try{AC.resume()}catch(e){}}}
  sfxBlip(false);
}
addEventListener('keydown',e=>{
  const k=e.key;
  if(k in KEYMAP||['Enter','Backspace','Escape','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','b','B','p','P'].includes(k))e.preventDefault();
  if(e.repeat)return;
  initAudio();
  if(k in KEYMAP){
    const l=KEYMAP[k];
    if(G.scene==='play')pressLane(l);
    return;
  }
  if(G.paused){
    if(k==='ArrowUp'){G.pauseSel=(G.pauseSel+4)%5;sfxBlip(false);}
    else if(k==='ArrowDown'){G.pauseSel=(G.pauseSel+1)%5;sfxBlip(false);}
    else if(k==='Enter'){
      if(G.pauseSel===0)togglePause();
      else if(G.pauseSel===1){if(AC){try{AC.resume()}catch(e){}}startSong(SONGS.indexOf(G.songRef));}
      else if(G.pauseSel===2){G.botplay=!G.botplay;sfxBlip(true);}
      else if(G.pauseSel===3){G.practice=!G.practice;sfxBlip(true);}
      else quitToSelect();
    }
    else if(k==='Backspace'||k==='Escape')togglePause();
    return;
  }
  if(k==='Enter')confirmAction();
  else if(k==='Backspace'||k==='Escape')backAction();
  else if(k==='b'||k==='B'){if(G.scene==='select'){G.botplay=!G.botplay;sfxBlip(true);}}
  else if(k==='p'||k==='P'){if(G.scene==='select'){G.practice=!G.practice;sfxBlip(true);}}
  else if(G.scene==='select'){
    if(k==='ArrowLeft'){G.selIdx=(G.selIdx+SONGS.length-1)%SONGS.length;sfxBlip(false);}
    else if(k==='ArrowRight'){G.selIdx=(G.selIdx+1)%SONGS.length;sfxBlip(false);}
  }
});
addEventListener('keyup',e=>{
  if(e.key in KEYMAP)releaseLane(KEYMAP[e.key]);
});
addEventListener('contextmenu',e=>e.preventDefault());
function toView(e){
  const dpr=cv.width/innerWidth;
  const x=((e.clientX*dpr)-viewOX)/viewScale;
  const y=((e.clientY*dpr)-viewOY)/viewScale;
  return [x,y];
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  const [x,y]=toView(e);
  if(G.scene==='menu'){G.scene='select';sfxBlip(true);return;}
  if(G.scene==='select'){
    for(let i=0;i<SONGS.length;i++){
      const cx=220+i*280;
      if(x>cx&&x<cx+240&&y>250&&y<440){G.selIdx=i;sfxBlip(true);startSong(i);return;}
    }
    if(x>240&&x<480&&y>490&&y<546){G.botplay=!G.botplay;sfxBlip(true);return;}
    if(x>800&&x<1040&&y>490&&y<546){G.practice=!G.practice;sfxBlip(true);return;}
    return;
  }
  if(G.scene==='play'){
    if(!G.paused&&Math.hypot(x-1216,y-44)<34){togglePause();return;}
    if(G.paused){
      const items=5,idx=clamp(Math.floor((y-215)/62),0,4);
      G.pauseSel=idx;
      if(idx===0)togglePause();
      else if(idx===1){if(AC){try{AC.resume()}catch(e){}}startSong(SONGS.indexOf(G.songRef));}
      else if(idx===2){G.botplay=!G.botplay;sfxBlip(true);}
      else if(idx===3){G.practice=!G.practice;sfxBlip(true);}
      else quitToSelect();
      return;
    }
    // lane pads
    let best=0,bd=1e9;
    for(let l=0;l<4;l++){const d=Math.abs(x-PL_X[l]);if(d<bd){bd=d;best=l;}}
    if(bd<130&&y>540){G.touchIds[e.pointerId]=best;pressLane(best);}
    return;
  }
  if(G.scene==='gameover'){resumeAndRetry();return;}
  if(G.scene==='results'){G.scene='select';sfxBlip(false);return;}
});
cv.addEventListener('pointerup',e=>{
  const l=G.touchIds[e.pointerId];
  if(l!==undefined){releaseLane(l);delete G.touchIds[e.pointerId];}
});
cv.addEventListener('pointercancel',e=>{
  const l=G.touchIds[e.pointerId];
  if(l!==undefined){releaseLane(l);delete G.touchIds[e.pointerId];}
});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ---------- main loop ----------
let lastT=0;
function frameBody(tms){
  const t=tms/1000;
  let dt=Math.min(0.05,t-lastT||0.016);
  lastT=t;G.time+=dt;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#05060a';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(viewScale,0,0,viewScale,viewOX,viewOY);
  if(G.scene==='play'&&!G.paused&&!G.dead)updatePlay(dt);
  if(G.scene==='menu')drawMenu();
  else if(G.scene==='select')drawSelect();
  else if(G.scene==='play')drawPlay();
  else if(G.scene==='gameover')drawGameover();
  else if(G.scene==='results')drawResults();
  if(G.paused)drawPause();
}
function frame(tms){
  try{frameBody(tms);}
  catch(e){try{(window.__e=window.__e||[]).push('frame: '+e.message);}catch(_){}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- debug hook (E2E) ----------
window.FNF={
  get scene(){return G.scene},
  start:i=>startSong(i),
  info:()=>({scene:G.scene,song:G.songRef?G.songRef.name:null,notes:G.plNotes.length,opp:G.oppNotes.length,len:G.cur?G.cur.len:0}),
  density(){ // max notes per second over 1s windows
    if(!G.plNotes.length)return 0;
    let mx=0,mxAt=0;
    for(let i=0;i<G.plNotes.length;i++){
      let j=i;while(j<G.plNotes.length&&G.plNotes[j].t<G.plNotes[i].t+1)j++;
      const c=j-i;
      if(c>mx){mx=c;mxAt=G.plNotes[i].t;}
    }
    return {maxNps:mx,atSec:Math.round(mxAt)};
  },
  press:l=>pressLane(l),
  state:()=>({score:G.score,combo:G.combo,health:G.health,misses:G.misses,scene:G.scene})
};
</script>
