'use strict';
/* ============================================================
   FNF: VS. STATIC — a FATE original mod
   Single file. No assets. Music synthesized live (WebAudio),
   graphics drawn on canvas. Chart & music share one clock.
   ============================================================ */

// ---------- tiny utils ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hash=n=>{n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=n*0x27d4eb2d;n=n^(n>>>15);return (n>>>0)/4294967296;};
const fmtTime=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

// ---------- constants ----------
const W=1280,H=720;
const LANE_COL=['#c24b99','#00e5ff','#3dfa3d','#f9393f'];
const LANE_NAME=['LEFT','DOWN','UP','RIGHT'];
const LANE_ARROW=[-Math.PI/2,Math.PI,0,Math.PI/2]; // left,down,up,right rotation
const KEYMAP={ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3,a:0,A:0,s:1,S:1,w:2,W:2,d:3,D:3};
const JUDGE={sick:.045,good:.095,bad:.140,miss:.165};
const ACCW={sick:1,good:.78,bad:.35};

// ---------- audio engine ----------
let AC=null,master,leadBus,bassBus,drumBus,noiseBuf,delayN;
function initAudio(){
  if(AC){if(AC.state==='suspended'){try{AC.resume()}catch(e){}}return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=.55;
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-16;comp.knee.value=18;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.16;
  master.connect(comp);comp.connect(AC.destination);
  // noise buffer
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  // lead delay bus
  delayN=AC.createDelay(.6);delayN.delayTime.value=.26;
  const fb=AC.createGain();fb.gain.value=.30;
  const wet=AC.createGain();wet.gain.value=.16;
  delayN.connect(fb);fb.connect(delayN);delayN.connect(wet);wet.connect(master);
  leadBus=AC.createGain();leadBus.gain.value=.9;leadBus.connect(master);leadBus.connect(delayN);
  bassBus=AC.createGain();bassBus.gain.value=.9;bassBus.connect(master);
  drumBus=AC.createGain();drumBus.gain.value=.95;drumBus.connect(master);
  if(AC.state==='suspended')AC.resume();
}
const midiF=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,peak,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+a+d);}
function playKick(t){
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(165,t);o.frequency.exponentialRampToValueAtTime(42,t+.11);
  env(g,t,.002,.95,.13);o.connect(g);g.connect(drumBus);o.start(t);o.stop(t+.16);
  const n=AC.createBufferSource();n.buffer=noiseBuf;const ng=AC.createGain(),hp=AC.createBiquadFilter();
  hp.type='highpass';hp.frequency.value=3500;env(ng,t,.001,.25,.02);
  n.connect(hp);hp.connect(ng);ng.connect(drumBus);n.start(t);n.stop(t+.03);
}
function playSnare(t){
  const n=AC.createBufferSource();n.buffer=noiseBuf;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1900;bp.Q.value=.8;
  const g=AC.createGain();env(g,t,.001,.5,.14);
  n.connect(bp);bp.connect(g);g.connect(drumBus);n.start(t);n.stop(t+.2);
  const o=AC.createOscillator(),og=AC.createGain();o.type='triangle';o.frequency.value=190;
  env(og,t,.001,.35,.06);o.connect(og);og.connect(drumBus);o.start(t);o.stop(t+.08);
}
function playHat(t,open){
  const n=AC.createBufferSource();n.buffer=noiseBuf;
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=7600;
  const g=AC.createGain();env(g,t,.001,open?.22:.17,open?.11:.035);
  n.connect(hp);hp.connect(g);g.connect(drumBus);n.start(t);n.stop(t+(open?.15:.06));
}
function playCrash(t){
  const n=AC.createBufferSource();n.buffer=noiseBuf;
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=5200;
  const g=AC.createGain();env(g,t,.002,.3,.7);
  n.connect(hp);hp.connect(g);g.connect(drumBus);n.start(t);n.stop(t+.8);
}
function playBass(t,m,d){
  const f=midiF(m);
  const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=f;
  o2.type='square';o2.frequency.value=f/2;
  lp.type='lowpass';lp.frequency.setValueAtTime(900,t);lp.frequency.exponentialRampToValueAtTime(320,t+d);lp.Q.value=2;
  env(g,t,.004,.42,Math.max(.08,d*.95));
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(bassBus);
  o.start(t);o.stop(t+d+.05);o2.start(t);o2.stop(t+d+.05);
}
function playLead(t,m,d,loud){
  const f=midiF(m),det=7;
  const g=AC.createGain(),lp=AC.createBiquadFilter();
  lp.type='lowpass';lp.frequency.setValueAtTime(2600,t);lp.frequency.exponentialRampToValueAtTime(1100,t+Math.max(.09,d));
  env(g,t,.004,loud?.30:.24,Math.max(.09,d*.92));
  for(const c of [-det,det]){
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=c;
    o.connect(lp);o.start(t);o.stop(t+d+.06);
  }
  lp.connect(g);g.connect(leadBus);
  if(loud){ // chord tone on top
    const o=AC.createOscillator(),g2=AC.createGain();o.type='sawtooth';o.frequency.value=midiF(m+7);
    env(g2,t,.004,.12,Math.max(.09,d*.9));o.connect(g2);g2.connect(leadBus);o.start(t);o.stop(t+d+.06);
  }
}
function playTick(t,hi){
  const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=hi?1200:800;
  env(g,t,.001,.18,.05);o.connect(g);g.connect(drumBus);o.start(t);o.stop(t+.07);
}
function playRiser(t,d){
  const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(950,t+d);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;
  g.gain.setValueAtTime(.0008,t);g.gain.linearRampToValueAtTime(.2,t+d*.85);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
function sfxMiss(){
  if(!AC)return;
  const t=AC.currentTime;
  const n=AC.createBufferSource();n.buffer=noiseBuf;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=850;
  const g=AC.createGain();env(g,t,.001,.25,.11);
  n.connect(lp);lp.connect(g);g.connect(master);n.start(t);n.stop(t+.14);
}
function sfxBlip(hi){
  initAudio();if(!AC)return;playTick(AC.currentTime+.001,hi);
}
function sfxCrashNow(){initAudio();if(!AC)return;playCrash(AC.currentTime+.001);}

// ---------- song authoring helpers ----------
// grid: step 1 = 16th note. bar = 16 steps.
function laneFromMel(state,m,idx){
  if(m>state.m){state.l=clamp(state.l+(m-state.m>2?2:1),0,3);}
  else if(m<state.m){state.l=clamp(state.l-(state.m-m>2?2:1),0,3);}
  else{
    const h=(m*31+idx*7)%4;
    if(h===state.l)state.l=(state.l+1)%4; // mostly move; occasional jack handled by authoring
    else state.l=h;
  }
  state.m=m;return state.l;
}
function newLaneState(startM){return {l:1,m:startM};}

// song object: {id,name,bpm,speed,drain,diff,label,arr:[{n,pat}...]}
// pat(barIdx, t0, ctxObj) where ctxObj={step,barLen,notes,audio,pushNote,pushAudio,...}
function makeBuilder(){
  const b={notes:[],audio:[],len:0};
  b.note=(t,l,hold)=>b.notes.push({t:t,l:l,h:hold||0});
  b.opp =(t,l)=>b.notes.push({t:t,l:l,h:0,who:'opp'});
  b.lead=(t,m,d,loud)=>b.audio.push({t:t,k:'lead',m:m,d:d,loud:loud});
  b.bass=(t,m,d)=>b.audio.push({t:t,k:'bass',m:m,d:d});
  b.drum=(t,k,open)=>b.audio.push({t:t,k:k,open:open});
  b.evt =(t,k)=>b.audio.push({t:t,k:k}); // crash/riser/tick
  return b;
}
function drumsBar(b,t0,step,dv,bars){ // dv: drum variant 'a','b','s','half'
  const st=i=>t0+i*step;
  if(dv==='half'){ b.drum(st(0),'kick');b.drum(st(8),'kick'); if(bars%2===1)b.drum(st(12),'snare'); for(let i=0;i<16;i+=4)b.drum(st(i),'hat'); return;}
  if(dv==='s'){ // shutdown trap
    b.drum(st(0),'kick');b.drum(st(6),'kick');b.drum(st(10),'kick');
    b.drum(st(4),'snare');b.drum(st(12),'snare');
    for(let i=0;i<16;i++)if(i%2===0||hash(i*3+bars)> .5)b.drum(st(i),'hat');
    b.drum(st(15),'hat',true);return;
  }
  if(dv==='b'){
    b.drum(st(0),'kick');b.drum(st(3),'kick');b.drum(st(8),'kick');b.drum(st(11),'kick');
    b.drum(st(4),'snare');b.drum(st(12),'snare');
    for(let i=0;i<16;i+=2)b.drum(st(i),'hat');
    b.drum(st(14),'hat',true);return;
  }
  b.drum(st(0),'kick');b.drum(st(8),'kick');b.drum(st(4),'snare');b.drum(st(12),'snare');
  for(let i=0;i<16;i+=2)b.drum(st(i),'hat');
  if(bars%2===1)b.drum(st(14),'hat',true);
}

// melody line -> audio + notes(who)
function melLine(b,t0,step,arr,who,st){
  for(let i=0;i<arr.length;i++){
    const e=arr[i],s=e[0],m=e[1],len=e[2]||1;
    const dur=len*step*.92;
    b.lead(t0+s*step,m,dur,false);
    if(who==='opp')b.opp(t0+s*step,laneFromMel(b._st2||(b._st2=newLaneState(50)),m,i));
    else b.note(t0+s*step,laneFromMel(b._st1||(b._st1=newLaneState(69)),m,i),len>1?(len*step-.09):0);
  }
}
function bassLine(b,t0,step,arr){
  for(let i=0;i<arr.length;i++){
    const e=arr[i],s=e[0],m=e[1],len=e[2]||1;
    b.bass(t0+s*step,m,len*step*.9);
    b.opp(t0+s*step,laneFromMel(b._st3||(b._st3=newLaneState(45)),m,i));
  }
}
// explicit chart note(s): entry [step,lane] or [step,[lanes],holdSteps]
function chartLine(b,t0,step,arr,withAudio,scaleArr){
  let ai=0;
  for(let i=0;i<arr.length;i++){
    const e=arr[i],s=e[0],lanes=Array.isArray(e[1])?e[1]:[e[1]],hold=e[2]||0;
    for(const l of lanes)b.note(t0+s*step,l,hold?hold*step-.09:0);
    if(withAudio){
      const m=scaleArr?scaleArr[ai%scaleArr.length]:(62+ai%8);
      b.lead(t0+s*step,m,step*.85,lanes.length>1);
      ai+=lanes.length;
    }
  }
}

// ================= SONG 1: INTERFERENCE (128, A minor) =================

    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'a',c.bar);bassLine(b,t0,s,BASS_A);if(c.bar%4===0)b.evt(t0,'crash');}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'a',c.bar);melLine(b,t0,s,(c.bar%4)<2?MEL_A:MEL_A2,'pl');}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'b',c.bar);melLine(b,t0,s,MEL_A2,'pl');bassLine(b,t0,s,BASS_A);if(c.bar%4===0)b.evt(t0,'crash');}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'a',c.bar);melLine(b,t0,s,(c.bar%4)<2?MEL_A2:MEL_A,'pl');}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'b',c.bar);bassLine(b,t0,s,BASS_A);if(c.bar%4===0)b.evt(t0,'crash');}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'b',c.bar);melLine(b,t0,s,MEL_A2,'pl');bassLine(b,t0,s,BASS_A);chartLine(b,t0,s,[[0,[0,3]],[8,[1,2]]],false);}},

// ================= SONG 3: SHUTDOWN (170, D minor) =================

const BASS_S=[[0,38,2],[3,38],[6,41],[8,45,2],[11,44],[12,41],[14,38]];

const DROP_B=[[0,1],[1,1],[2,1],[3,1],[4,2],[5,3],[6,2],[7,0],[8,[1,2]],[9,3],[10,2],[11,0],[12,.5],[12.5,1],[13,2],[13.5,3],[14,2],[14.5,1],[15,3]];
const DROP_C=[[0,[0,3]],[2,[1,2]],[4,[0,2]],[6,[1,3]],[8,[0,3]],[9,1],[10,2],[11,3],[12,[1,2]],[13,0],[14,3],[15,2]];
const DROP_RUN=[[0,0],[1,1],[2,2],[3,3],[4,0],[5,1],[6,2],[7,3],[8,0],[8.5,1],[9,2],[9.5,3],[10,0],[10.5,1],[11,2],[11.5,3],[12,[0,3]],[13,[1,2]],[14,[0,3]],[15,[1,2]]];
const SONG3={

    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'s',c.bar);melLine(b,t0,s,MEL_S,'pl');chartLine(b,t0,s,c.bar%2?[[8,[1,2]]]:[[0,[0,3]],[8,[1,2]]],false);}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'s',c.bar);chartLine(b,t0,s,DROP_A,true,SCALE_S);bassLine(b,t0,s,BASS_S);if(c.bar%4===0)b.evt(t0,'crash');}},
    {n:8,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'s',c.bar);chartLine(b,t0,s,c.bar%2?DROP_C:DROP_RUN,true,SCALE_S);bassLine(b,t0,s,BASS_S);}},
    {n:2,pat:(b,t0,s,c)=>{drumsBar(b,t0,s,'half',c.bar);if(c.bar===0)b.evt(t0,'crash');}},
  ]};

const SONGS=[SONG1,SONG2,SONG3];

// ---------- chart builder ----------
function buildSong(song){
  const b=makeBuilder();
  const spb=60/song.bpm,step=spb/4,barLen=spb*4;
  let bar=0;
  for(const sec of song.arr){
    for(let i=0;i<sec.n;i++){
      sec.pat(b,bar*barLen,step,{bar:bar,secBar:i});
      bar++;
    }
  }
  b.len=bar*barLen;
  b.notes.sort((x,y)=>x.t-y.t);
  b.audio.sort((x,y)=>x.t-y.t);
  return {notes:b.notes,audio:b.audio,len:b.len,step:step,barLen:barLen,song:song};
}
