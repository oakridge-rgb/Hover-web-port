<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FlipaClip Studio — Frame-by-Frame Animation</title>
<style>
/* FlipaClip Studio — UI styles */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#131318; --panel:#1d1d26; --panel2:#262633; --line:#32323f; --line2:#3f3f4f;
  --text:#eceaf3; --dim:#9c9cb0; --accent:#38a1ff; --accent-d:#1f7fd6;
  --danger:#ff5d5d; --ok:#3ecf8e;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--accent)}
[hidden]{display:none!important}
svg{display:block;flex:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3a3a49;border-radius:6px;border:2px solid #1d1d26}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:8px;height:48px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.tb-left{display:flex;align-items:center;gap:10px;min-width:230px}
#logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.2px;white-space:nowrap}
#logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#38a1ff,#8a63ff);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
#logo .sub{color:var(--dim);font-weight:500}
#projName{width:170px;background:transparent;border:1px solid transparent;font-weight:600;color:var(--text)}
#projName:hover{border-color:var(--line2)}
#projName:focus{background:var(--panel2)}
.tb-center{flex:1;display:flex;justify-content:center;align-items:center;gap:4px}
.tb-right{display:flex;justify-content:flex-end;align-items:center;gap:4px;min-width:230px}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;color:var(--dim);white-space:nowrap}
.tbtn:hover{background:var(--panel2);color:var(--text)}
.tbtn.on{color:var(--accent);background:rgba(56,161,255,.13)}
.tbtn:disabled{opacity:.35;cursor:default;background:none;color:var(--dim)}
.tbtn.primary{background:var(--accent);color:#fff;font-weight:600}
.tbtn.primary:hover{background:var(--accent-d);color:#fff}
.vsep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}

/* ---------- main ---------- */
#main{flex:1;display:flex;min-height:0}

#toolbar{width:58px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;overflow-y:auto;flex:none}
.tool{width:42px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--dim);position:relative;flex:none}
.tool:hover{background:var(--panel2);color:var(--text)}
.tool.on{background:rgba(56,161,255,.15);color:var(--accent)}
.tool.on::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
.tsep{width:30px;height:1px;background:var(--line);margin:5px 0;flex:none}
#colorSwatch{width:38px;height:38px;border-radius:10px;padding:0;border:2px solid var(--line2);background:none;cursor:pointer;overflow:hidden;flex:none}
#colorSwatch::-webkit-color-swatch-wrapper{padding:0}
#colorSwatch::-webkit-color-swatch{border:0;border-radius:7px}
#colorSwatch::-moz-color-swatch{border:0;border-radius:7px}
#palette{display:grid;grid-template-columns:repeat(3,19px);gap:4px;margin-top:2px}
.pal{width:19px;height:19px;border-radius:6px;border:1px solid rgba(255,255,255,.18);cursor:pointer;padding:0}
.pal:hover{transform:scale(1.15)}
.topt{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:3px;color:var(--dim);font-size:10px;flex:none}
.topt input[type=range]{width:44px}
#fillOpt label{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:10px}

#stagewrap{flex:1;position:relative;overflow:auto;display:grid;place-items:center;background:#0d0d12;touch-action:none}
#stagewrap.panning{cursor:grab}
#stagebox{position:relative;box-shadow:0 6px 44px rgba(0,0,0,.6);flex:none}
#disp{display:block;background:#fff}
#disp.pixelated{image-rendering:pixelated}
#ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#zoombar{position:absolute;right:12px;bottom:10px;display:flex;gap:2px;align-items:center;background:rgba(29,29,38,.92);border:1px solid var(--line);border-radius:9px;padding:4px;z-index:5}
#zoombar button{min-width:26px;height:26px;border-radius:6px;color:var(--dim);display:grid;place-items:center;padding:0 4px}
#zoombar button:hover{background:var(--panel2);color:var(--text)}
#zoomPct{min-width:46px;text-align:center;color:var(--dim);font-size:12px}

#layerspanel{width:192px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.lp-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-weight:600;border-bottom:1px solid var(--line);color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.7px}
#layerAdd{width:24px;height:24px;border-radius:6px;background:var(--panel2);display:grid;place-items:center;color:var(--text)}
#layerAdd:hover{background:var(--accent);color:#fff}
#layerList{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:2px}
.lrow{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.lrow:hover{background:var(--panel2)}
.lrow.on{border-color:var(--accent);background:rgba(56,161,255,.1)}
.lrow .eye{width:22px;height:22px;display:grid;place-items:center;color:var(--dim);border-radius:5px;flex:none}
.lrow .eye:hover{color:var(--text);background:var(--line)}
.lrow .lname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lrow input.rename{flex:1;min-width:0;padding:1px 5px}
.lrow canvas{width:34px;height:20px;border-radius:4px;background:#fff;border:1px solid var(--line);flex:none}
.lrow.hid .lname,.lrow.hid canvas{opacity:.4}
.lp-foot{padding:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.oprow{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px}
.oprow input{flex:1;min-width:0}
.oprow span{width:36px;text-align:right}
.lp-btns{display:flex;gap:4px}
.lp-btns button{flex:1;height:28px;border-radius:7px;background:var(--panel2);display:grid;place-items:center;color:var(--dim)}
.lp-btns button:hover{color:var(--text);background:var(--line2)}
.lp-btns button:disabled{opacity:.3;cursor:default}

/* ---------- timeline ---------- */
#timeline{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;flex:none}
#transport{display:flex;align-items:center;gap:4px;padding:5px 10px;border-bottom:1px solid var(--line)}
#transport .tbtn{height:30px;padding:0 8px}
.fpsbox{display:flex;align-items:center;gap:5px;background:var(--panel2);border-radius:8px;padding:3px 7px;margin-left:8px}
.fpsbox button{width:20px;height:20px;border-radius:5px;color:var(--dim);display:grid;place-items:center;padding:0}
.fpsbox button:hover{background:var(--line2);color:var(--text)}
#fpsVal{min-width:18px;text-align:center;font-weight:700}
.fpsbox .u{color:var(--dim);font-size:11px}
#frameCounter{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
#framestrip{display:flex;gap:8px;padding:10px;overflow-x:auto;overflow-y:hidden;min-height:92px;align-items:center}
.fcard{position:relative;flex:0 0 auto;width:104px;border-radius:9px;background:var(--panel2);border:2px solid transparent;padding:4px;cursor:pointer}
.fcard:hover{border-color:var(--line2)}
.fcard.on{border-color:var(--accent)}
.fcard canvas{width:94px;height:53px;display:block;border-radius:5px;background:#fff}
.flabel{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.fcard.on .flabel{background:var(--accent)}
.fact{position:absolute;right:8px;top:8px;display:none;gap:3px}
.fcard:hover .fact{display:flex}
.fact button{width:20px;height:20px;border-radius:5px;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff;padding:0}
.fact button:hover{background:var(--accent)}
.fcard.dropmark{border-color:var(--ok);border-style:dashed}
#stripAdd{flex:0 0 auto;width:36px;height:64px;border-radius:9px;border:2px dashed var(--line2);color:var(--dim);display:grid;place-items:center}
#stripAdd:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50}
.dialog{width:min(480px,92vw);max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:18px;box-shadow:0 20px 80px rgba(0,0,0,.6)}
.dialog h2{font-size:16px;margin-bottom:14px}
.frow{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.frow label{width:92px;color:var(--dim);flex:none}
.frow input,.frow select{flex:1;min-width:0}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;align-items:center}
.dlg-actions .spacer{flex:1}
.btn{height:34px;padding:0 16px;border-radius:9px;background:var(--panel2);font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.hint{color:var(--dim);font-size:11.5px;line-height:1.5}
.excards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.excard{border:2px solid var(--line2);border-radius:10px;padding:12px 8px;cursor:pointer;text-align:center;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px}
.excard:hover{border-color:var(--dim)}
.excard.on{border-color:var(--accent);color:var(--text);background:rgba(56,161,255,.08)}
.excard b{color:var(--text);margin:5px 0 1px;font-size:13px}
.excard small{font-size:10.5px}
.progress{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin:12px 0 4px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.kbdlist{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px;color:var(--dim)}
.kbdlist b{color:var(--text);font-weight:600;background:var(--panel2);border-radius:5px;padding:1px 6px;font-size:11px;display:inline-block;margin-right:6px}

/* ---------- toasts ---------- */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center;pointer-events:none}
.toast{background:#2b2b38;border:1px solid var(--line2);padding:9px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:tin .18s ease;max-width:70vw}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

</style>
</head>
<body>
<div id="app" hidden>
  <header id="topbar">
    <div class="tb-left">
      <div id="logo"><span class="mark">F</span>FlipaClip<span class="sub">&nbsp;Studio</span></div>
      <input id="projName" spellcheck="false" autocomplete="off" title="Project name">
    </div>
    <div class="tb-center">
      <button class="tbtn" id="btnUndo" data-icon="undo" title="Undo (Ctrl+Z)"></button>
      <button class="tbtn" id="btnRedo" data-icon="redo" title="Redo (Ctrl+Y)"></button>
      <span class="vsep"></span>
      <button class="tbtn" id="btnOnion" data-icon="onion" data-label="Onion" title="Onion skin (O)"></button>
      <button class="tbtn" id="btnGrid" data-icon="grid" data-label="Grid" title="Grid"></button>
      <span class="vsep"></span>
      <button class="tbtn" id="btnAudio" data-icon="music" data-label="Audio" title="Add audio track (preview only)"></button>
    </div>
    <div class="tb-right">
      <button class="tbtn" id="btnNew" data-label="New" title="New project"></button>
      <button class="tbtn" id="btnOpen" data-icon="folder" data-label="Open" title="Open project file"></button>
      <button class="tbtn" id="btnSaveProj" data-icon="save" data-label="Save" title="Save project file (.json)"></button>
      <button class="tbtn" id="btnSettings" data-icon="settings" title="Settings"></button>
      <button class="tbtn primary" id="btnExport" data-icon="download" data-label="Export"></button>
    </div>
  </header>

  <div id="main">
    <aside id="toolbar">
      <button class="tool" data-tool="brush"   data-icon="brush"   title="Brush (B)"></button>
      <button class="tool" data-tool="eraser"  data-icon="eraser"  title="Eraser (E)"></button>
      <button class="tool" data-tool="fill"    data-icon="fill"    title="Fill bucket (G)"></button>
      <button class="tool" data-tool="lasso"   data-icon="lasso"   title="Lasso select &amp; move (L)"></button>
      <div class="tsep"></div>
      <button class="tool" data-tool="line"    data-icon="line"    title="Line (V)"></button>
      <button class="tool" data-tool="rect"    data-icon="rect"    title="Rectangle (R)"></button>
      <button class="tool" data-tool="ellipse" data-icon="ellipse" title="Ellipse (C)"></button>
      <button class="tool" data-tool="picker"  data-icon="picker"  title="Color picker (I)"></button>
      <div class="tsep"></div>
      <input type="color" id="colorSwatch" value="#111111" title="Brush color">
      <div id="palette"></div>
      <div class="tsep"></div>
      <div class="topt"><input type="range" id="sizeRange" min="1" max="80" value="6"><div id="sizeVal">6 px</div></div>
      <div class="topt" id="opacityOpt"><input type="range" id="opacityRange" min="5" max="100" value="100"><div id="opacityVal">100%</div></div>
      <div class="topt" id="tolOpt" hidden><input type="range" id="tolRange" min="0" max="120" value="28"><div id="tolVal">tol 28</div></div>
      <div class="topt" id="fillOpt" hidden><label><input type="checkbox" id="fillShape" style="accent-color:var(--accent)"> Fill</label></div>
    </aside>

    <div id="stagewrap">
      <div id="stagebox">
        <canvas id="disp" width="1280" height="720"></canvas>
        <canvas id="ovl" width="1280" height="720"></canvas>
      </div>
      <div id="zoombar">
        <button id="zoomOut" title="Zoom out">&minus;</button>
        <span id="zoomPct">100%</span>
        <button id="zoomIn" title="Zoom in">+</button>
        <button id="zoomFit" title="Fit to screen">Fit</button>
      </div>
    </div>

    <aside id="layerspanel">
      <div class="lp-head"><span>Layers</span><button id="layerAdd" data-icon="plus" title="Add layer"></button></div>
      <div id="layerList"></div>
      <div class="lp-foot">
        <div class="oprow"><span style="width:auto">Opacity</span><input type="range" id="layerOpacity" min="0" max="100" value="100"><span id="layerOpacityVal">100%</span></div>
        <div class="lp-btns">
          <button id="layerUp" data-icon="up" title="Move layer up"></button>
          <button id="layerDown" data-icon="down" title="Move layer down"></button>
          <button id="layerClear" data-icon="clear" title="Clear this layer"></button>
          <button id="layerDel" data-icon="trash" title="Delete layer"></button>
        </div>
      </div>
    </aside>
  </div>

  <footer id="timeline">
    <div id="transport">
      <button class="tbtn" id="btnStart" data-icon="start" title="First frame (Home)"></button>
      <button class="tbtn" id="btnPrev" data-icon="prev" title="Previous frame (,)"></button>
      <button class="tbtn" id="btnPlay" data-icon="play" title="Play / Pause (Space)"></button>
      <button class="tbtn" id="btnNext" data-icon="next" title="Next frame (.)"></button>
      <button class="tbtn" id="btnEnd" data-icon="end" title="Last frame (End)"></button>
      <button class="tbtn on" id="btnLoop" data-icon="loop" data-label="Loop" title="Loop playback"></button>
      <div class="fpsbox" title="Frames per second">
        <button id="fpsMinus">&minus;</button><span id="fpsVal">12</span><span class="u">fps</span><button id="fpsPlus">+</button>
      </div>
      <div id="frameCounter">1 / 1</div>
    </div>
    <div id="framestrip"></div>
  </footer>
</div>

<div id="modalRoot">
  <div class="overlay" id="mNew" hidden>
    <div class="dialog">
      <h2>New project</h2>
      <div class="frow"><label>Name</label><input id="npName" value="My Animation" maxlength="48" spellcheck="false"></div>
      <div class="frow"><label>Canvas size</label>
        <select id="npSize">
          <option value="1280x720" selected>HD 1280 &times; 720 (16:9)</option>
          <option value="1920x1080">Full HD 1920 &times; 1080</option>
          <option value="1080x1080">Square 1080 &times; 1080</option>
          <option value="720x1280">Portrait 720 &times; 1280 (9:16)</option>
          <option value="800x600">Classic 800 &times; 600</option>
        </select>
      </div>
      <div class="frow"><label>Frame rate</label>
        <select id="npFps"><option>8</option><option selected>12</option><option>15</option><option>24</option><option>30</option></select>
      </div>
      <div class="frow"><label>Background</label><input type="color" id="npBg" value="#ffffff"></div>
      <div class="dlg-actions">
        <button class="btn" id="npRestore" hidden>Restore last session</button>
        <span class="spacer"></span>
        <button class="btn" id="npCancel" hidden>Cancel</button>
        <button class="btn primary" id="npCreate">Create</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="mSettings" hidden>
    <div class="dialog">
      <h2>Settings</h2>
      <div class="frow"><label>Name</label><input id="stName" maxlength="48" spellcheck="false"></div>
      <div class="frow"><label>Frame rate</label>
        <select id="stFps"><option>8</option><option>12</option><option>15</option><option>24</option><option>30</option></select>
      </div>
      <div class="frow"><label>Background</label><input type="color" id="stBg"></div>
      <p class="hint">Canvas size is fixed after the project is created. The audio track is preview-only (it is not stored in saved projects).</p>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button class="btn primary" id="stDone">Done</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="mExport" hidden>
    <div class="dialog" style="width:min(560px,94vw)">
      <h2>Export animation</h2>
      <div class="excards">
        <div class="excard on" data-fmt="gif" id="exGif"><span data-icon="gif"></span><b>GIF</b><small>Animated image</small></div>
        <div class="excard" data-fmt="mp4" id="exMp4"><span data-icon="film"></span><b>MP4 / WebM</b><small>Video file</small></div>
        <div class="excard" data-fmt="png" id="exPng"><span data-icon="image"></span><b>PNG frames</b><small>ZIP sequence</small></div>
      </div>
      <div class="frow"><label>Scale</label>
        <select id="exScale">
          <option value="1">100%</option>
          <option value="0.5" selected>50%</option>
          <option value="0.25">25%</option>
        </select>
      </div>
      <div class="frow" id="exFpsRow"><label>Frame rate</label><select id="exFps"></select></div>
      <div class="hint" id="exInfo"></div>
      <div class="progress" id="exProgWrap" hidden><i id="exProg"></i></div>
      <div class="dlg-actions">
        <span class="hint" id="exStatus" style="flex:1;text-align:left"></span>
        <button class="btn" id="exCancel">Cancel</button>
        <button class="btn primary" id="exGo">Export</button>
      </div>
    </div>
  </div>
</div>

<div id="toasts"></div>
<input type="file" id="fileOpen" accept=".json,application/json" hidden>
<input type="file" id="fileAudio" accept="audio/*" hidden>

<script>
/* fc-gif.js — GIF89a encoder: median-cut quantizer + LZW writer. Pure JS, no DOM. */
const FCGIF = (function () {

  function clampByte(v) { v = v | 0; return v < 0 ? 0 : v > 255 ? 255 : v; }

  function boxRange(b) {
    var mn0 = 255, mn1 = 255, mn2 = 255, mx0 = 0, mx1 = 0, mx2 = 0;
    for (var i = 0; i < b.length; i++) {
      var p = b[i];
      if (p[0] < mn0) mn0 = p[0]; if (p[0] > mx0) mx0 = p[0];
      if (p[1] < mn1) mn1 = p[1]; if (p[1] > mx1) mx1 = p[1];
      if (p[2] < mn2) mn2 = p[2]; if (p[2] > mx2) mx2 = p[2];
    }
    var r0 = mx0 - mn0, r1 = mx1 - mn1, r2 = mx2 - mn2;
    var ch = 0, rr = r0;
    if (r1 > rr) { rr = r1; ch = 1; }
    if (r2 > rr) { rr = r2; ch = 2; }
    return { ch: ch, score: r0 + r1 + r2 };
  }

  function boxAvg(b) {
    var r = 0, g = 0, bl = 0, n = b.length;
    for (var i = 0; i < n; i++) { r += b[i][0]; g += b[i][1]; bl += b[i][2]; }
    return [Math.round(r / n), Math.round(g / n), Math.round(bl / n)];
  }

    octx.lineWidth = 2.5;
    octx.strokeStyle = 'rgba(0,0,0,.45)';
    octx.beginPath();
    octx.arc(S.cursor.x, S.cursor.y, Math.max(0.5, S.size / 2), 0, Math.PI * 2);
    octx.stroke();
    octx.lineWidth = 1;
    octx.strokeStyle = 'rgba(255,255,255,.95)';
    octx.stroke();
    octx.restore();
  }
}

function pathPoly(cx, pts) {
  cx.beginPath();
  cx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) cx.lineTo(pts[i].x, pts[i].y);
  cx.closePath();
}

/* ---------- frame strip (timeline) ---------- */
function rebuildStrip() {
  const strip = $('#framestrip');
  const sl = strip.scrollLeft;
  strip.innerHTML = '';
  stripCards = P.frames.map((f, i) => {
    const el = document.createElement('div');
    el.className = 'fcard' + (i === S.cf ? ' on' : '');
    el.draggable = true;
    const cv = mkCanvas(192, 108);
    el.appendChild(cv);
    const lb = document.createElement('div');
    lb.className = 'flabel';
    lb.textContent = String(i + 1);
    el.appendChild(lb);
    const act = document.createElement('div');
    act.className = 'fact';
    const bDup = document.createElement('button');
    bDup.innerHTML = icon('copy');
    bDup.title = 'Duplicate frame';
    bDup.onclick = ev => { ev.stopPropagation(); addFrame(true, i); };
    const bDel = document.createElement('button');
    bDel.innerHTML = icon('trash');
    bDel.title = 'Delete frame';
    bDel.onclick = ev => { ev.stopPropagation(); delFrame(i); };
    act.appendChild(bDup); act.appendChild(bDel);
    el.appendChild(act);
    el.onclick = () => { if (!S.playing) setCurFrame(i); };
    el.addEventListener('dragstart', e => {
      dragFrom = i;
      try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) { }
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dropmark'); });
    el.addEventListener('dragleave', () => el.classList.remove('dropmark'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('dropmark');
      if (dragFrom < 0 || dragFrom === i) return;
      let to = i; if (dragFrom < i) to = i - 1;
      moveFrame(dragFrom, to);
      dragFrom = -1;
    });
    strip.appendChild(el);
    return { el, canvas: cv, tctx: pctx(cv) };
  });
  strip.appendChild(stripAddBtn);
  strip.scrollLeft = sl;
  drawAllThumbs();
}

const stripAddBtn = document.createElement('button');
stripAddBtn.id = 'stripAdd';
stripAddBtn.title = 'Add frame at end';
stripAddBtn.innerHTML = icon('plus');
stripAddBtn.onclick = () => addFrame(false, P.frames.length - 1);

let dragFrom = -1;

function updateStripSelection() {
  stripCards.forEach((c, i) => c.el.classList.toggle('on', i === S.cf));
}
function drawThumb(fi) {
  const card = stripCards[fi];
  if (!card) return;
  const t = card.tctx;
  t.clearRect(0, 0, 192, 108);
  t.fillStyle = P.bg;
  t.fillRect(0, 0, 192, 108);
  const f = P.frames[fi];
  if (!f) return;
  const k = Math.min(192 / P.w, 108 / P.h);
  const dx = (192 - P.w * k) / 2, dy = (108 - P.h * k) / 2;
  for (let li = 0; li < P.layers.length; li++) {
    const L = P.layers[li];
    if (!L.visible) continue;
    t.globalAlpha = L.opacity;
    t.drawImage(f.c[li], dx, dy, P.w * k, P.h * k);
  }
  t.globalAlpha = 1;
}
function drawAllThumbs() { for (let i = 0; i < P.frames.length; i++) drawThumb(i); }

function scrollStripTo(i) {
  const card = stripCards[i];
  if (!card) return;
  const strip = $('#framestrip');
  const el = card.el;
  if (el.offsetLeft < strip.scrollLeft + 10) strip.scrollLeft = el.offsetLeft - 10;
  else if (el.offsetLeft + el.offsetWidth > strip.scrollLeft + strip.clientWidth - 10)
    strip.scrollLeft = el.offsetLeft + el.offsetWidth - strip.clientWidth + 10;
}

/* ---------- layer list ---------- */
function rebuildLayerList() {
  const list = $('#layerList');
  list.innerHTML = '';
  for (let li = P.layers.length - 1; li >= 0; li--) {
    const L = P.layers[li];
    const row = document.createElement('div');
    row.className = 'lrow' + (li === S.cl ? ' on' : '') + (L.visible ? '' : ' hid');
    const eye = document.createElement('button');
    eye.className = 'eye';
    eye.innerHTML = icon(L.visible ? 'eye' : 'eyeoff');
    eye.title = 'Toggle visibility';
    eye.onclick = e => {
      e.stopPropagation();
      L.visible = !L.visible;
      rebuildLayerList(); render(); drawAllThumbs(); scheduleAutosave();
    };
    const cv = mkCanvas(68, 40);
    const tc = pctx(cv);
    const f = P.frames[S.cf];
    if (f && f.c[li]) tc.drawImage(f.c[li], 0, 0, 68, 40);
    const nm = document.createElement('span');
    nm.className = 'lname';
    nm.textContent = L.name;
    nm.title = 'Double-click to rename';
    nm.ondblclick = e => {
      e.stopPropagation();
      const inp = document.createElement('input');
      inp.className = 'rename';
      inp.value = L.name;
      nm.replaceWith(inp);
      inp.focus(); inp.select();
      const done = () => {
        L.name = inp.value.trim() || L.name;
        rebuildLayerList(); scheduleAutosave();
      };
      inp.onblur = done;
      inp.onkeydown = ev => { if (ev.key === 'Enter') inp.blur(); if (ev.key === 'Escape') { inp.value = L.name; inp.blur(); } };
    };
    row.appendChild(eye); row.appendChild(nm); row.appendChild(cv);
    row.onclick = () => {
      S.cl = li;
      rebuildLayerList(); render(); drawOverlay(); syncLayerFoot();
    };
    list.appendChild(row);
  }
  syncLayerFoot();
}

function syncLayerFoot() {
  const L = P.layers[S.cl];
  const op = $('#layerOpacity');
  op.value = Math.round(L.opacity * 100);
  $('#layerOpacityVal').textContent = Math.round(L.opacity * 100) + '%';
  $('#layerUp').disabled = S.cl >= P.layers.length - 1;
  $('#layerDown').disabled = S.cl <= 0;
  $('#layerDel').disabled = P.layers.length <= 1;
}

/* ---------- history (closure commands) ---------- */
function pushCmd(cmd) {
  S.history.undo.push(cmd);
  if (S.history.undo.length > 60) S.history.undo.shift();
  S.history.redo.length = 0;
  updateUndoUI();
  scheduleAutosave();
}
function snapshotLayer(fi, li) {
  return rctx(P.frames[fi].c[li]).getImageData(0, 0, P.w, P.h);
}
function applyPix(fid, lid, img) {
  const fi = P.frames.findIndex(f => f.id === fid);
  const li = P.layers.findIndex(l => l.id === lid);
  if (fi < 0 || li < 0) return;
  const cv = P.frames[fi].c[li];
  if (cv) rctx(cv).putImageData(img, 0, 0);
}
function pushPixelsCmd(fi, li, before, after) {
  const fid = P.frames[fi].id, lid = P.layers[li].id;
  pushCmd({
    undo: () => applyPix(fid, lid, before),
    redo: () => applyPix(fid, lid, after),
  });
}
function updateUndoUI() {
  $('#btnUndo').disabled = S.history.undo.length === 0;
  $('#btnRedo').disabled = S.history.redo.length === 0;
}
function undo() {
  const c = S.history.undo.pop();
  if (!c) return;
  c.undo();
  S.history.redo.push(c);
  refreshAfterHistory();
}
function redo() {
  const c = S.history.redo.pop();
  if (!c) return;
  c.redo();
  S.history.undo.push(c);
  refreshAfterHistory();
}
function refreshAfterHistory() {
  if (!P) return;
  if (lasso && lasso.mode === 'move') cancelLasso();
  S.cf = clamp(S.cf, 0, P.frames.length - 1);
  S.cl = clamp(S.cl, 0, P.layers.length - 1);
  rebuildStrip(); rebuildLayerList();
  $('#projName').value = P.name;
  $('#fpsVal').textContent = P.fps;
  render(); updateCounter(); updateUndoUI();
  scheduleAutosave();
}

/* ---------- frame ops ---------- */
function addFrame(copy, at) {
  stopPlay();
  if (typeof at !== 'number') at = S.cf;
  const nf = copy ? cloneFrame(P.frames[at]) : newFrameObj();
  const idx = at + 1;
  P.frames.splice(idx, 0, nf);
  S.cf = idx;
  pushCmd({
    undo() { P.frames.splice(idx, 1); if (S.cf >= P.frames.length) S.cf = P.frames.length - 1; },
    redo() { P.frames.splice(idx, 0, nf); },
  });
  rebuildStrip(); render(); updateCounter();
  scrollStripTo(S.cf);
}
function delFrame(i) {
  stopPlay();
  if (P.frames.length <= 1) { toast('A project needs at least one frame'); return; }
  i = clamp(i, 0, P.frames.length - 1);
  const removed = P.frames.splice(i, 1)[0];
  S.cf = clamp(i, 0, P.frames.length - 1);
  pushCmd({
    undo() { P.frames.splice(i, 0, removed); },
    redo() { P.frames.splice(i, 1); },
  });
  rebuildStrip(); render(); updateCounter();
}
function moveFrame(from, to) {
  stopPlay();
  if (from === to) return;
  const f = P.frames.splice(from, 1)[0];
  P.frames.splice(to, 0, f);
  if (S.cf === from) S.cf = to;
  pushCmd({
    undo() { P.frames.splice(to, 1); P.frames.splice(from, 0, f); },
    redo() { P.frames.splice(from, 1); P.frames.splice(to, 0, f); },
  });
  rebuildStrip(); render(); updateCounter();
}
function setCurFrame(i) {
  i = clamp(i, 0, P.frames.length - 1);
  if (i === S.cf) return;
  S.cf = i;
  updateStripSelection(); render(); updateCounter();
  scrollStripTo(i);
}
function updateCounter() {
  $('#frameCounter').textContent = (S.cf + 1) + ' / ' + P.frames.length;
}

/* ---------- layer ops ---------- */
function addLayer() {
  stopPlay();
  const pos = P.layers.length; // new top layer
  const meta = { id: uid(), name: 'Layer ' + (P.layers.length + 1), visible: true, opacity: 1 };
  const cvs = P.frames.map(() => mkCanvas(P.w, P.h));
  P.frames.forEach((f, i) => f.c.splice(pos, 0, cvs[i]));
  P.layers.splice(pos, 0, meta);
  S.cl = pos;
  pushCmd({
    undo() {
      P.frames.forEach(f => f.c.splice(pos, 1));
      P.layers.splice(pos, 1);
      if (S.cl >= P.layers.length) S.cl = P.layers.length - 1;
    },
    redo() {
      P.frames.forEach((f, i) => f.c.splice(pos, 0, cvs[i]));
      P.layers.splice(pos, 0, meta);
    },
  });
  rebuildLayerList(); render(); drawAllThumbs();
}
function delLayer() {
  stopPlay();
  if (P.layers.length <= 1) { toast('A project needs at least one layer'); return; }
  const pos = S.cl;
  const meta = P.layers[pos];
  const cols = P.frames.map(f => f.c[pos]);
  P.frames.forEach(f => f.c.splice(pos, 1));
  P.layers.splice(pos, 1);
  S.cl = clamp(pos, 0, P.layers.length - 1);
  pushCmd({
    undo() {
      P.frames.forEach((f, i) => f.c.splice(pos, 0, cols[i]));
      P.layers.splice(pos, 0, meta);
    },
    redo() {
      P.frames.forEach(f => f.c.splice(pos, 1));
      P.layers.splice(pos, 1);
    },
  });
  rebuildLayerList(); render(); drawAllThumbs();
}
function moveLayer(from, to) {
  stopPlay();
  if (to < 0 || to >= P.layers.length || from === to) return;
  const meta = P.layers[from];
  P.layers.splice(from, 1); P.layers.splice(to, 0, meta);
  P.frames.forEach(f => {
    const cv = f.c.splice(from, 1)[0];
    f.c.splice(to, 0, cv);
  });
  S.cl = to;
  pushCmd({
    undo() {
      const m = P.layers.splice(to, 1)[0]; P.layers.splice(from, 0, m);
      P.frames.forEach(f => { const cv = f.c.splice(to, 1)[0]; f.c.splice(from, 0, cv); });
    },
    redo() {
      const m = P.layers.splice(from, 1)[0]; P.layers.splice(to, 0, m);
      P.frames.forEach(f => { const cv = f.c.splice(from, 1)[0]; f.c.splice(to, 0, cv); });
    },
  });
  rebuildLayerList(); render(); drawAllThumbs();
}
function clearLayer() {
  const cv = P.frames[S.cf].c[S.cl];
  const before = snapshotLayer(S.cf, S.cl);
  rctx(cv).clearRect(0, 0, P.w, P.h);
  pushPixelsCmd(S.cf, S.cl, before, snapshotLayer(S.cf, S.cl));
  render(); drawThumb(S.cf);
}

/* ---------- tools ---------- */
const TOOL_NAMES = ['brush', 'eraser', 'fill', 'lasso', 'line', 'rect', 'ellipse', 'picker'];
function setTool(t) {
  if (!TOOL_NAMES.includes(t)) return;
  if (lasso && lasso.mode === 'move') commitLasso();
  S.tool = t;
  updateToolUI();
  drawOverlay();
}
function updateToolUI() {
  $$('#toolbar .tool').forEach(b => b.classList.toggle('on', b.dataset.tool === S.tool));
  const shape = S.tool === 'rect' || S.tool === 'ellipse';
  $('#opacityOpt').hidden = S.tool === 'fill' || S.tool === 'picker' || S.tool === 'lasso';
  $('#tolOpt').hidden = S.tool !== 'fill';
  $('#fillOpt').hidden = !shape;
  disp.style.cursor = (S.tool === 'brush' || S.tool === 'eraser') ? 'none'
    : S.tool === 'picker' ? 'copy' : 'crosshair';
}
function setSize(v) {
  S.size = clamp(Math.round(v), 1, 80);
  $('#sizeRange').value = S.size;
  $('#sizeVal').textContent = S.size + ' px';
  drawOverlay();
}
function setColor(hex) {
  S.color = hex;
  $('#colorSwatch').value = hex;
  S.recents = [hex, ...S.recents.filter(c => c !== hex)].slice(0, 12);
  buildPalette();
}
function buildPalette() {
  const box = $('#palette');
  box.innerHTML = '';
  S.recents.forEach(c => {
    const b = document.createElement('button');
    b.className = 'pal';
    b.style.background = c;
    b.title = c;
    b.onclick = () => setColor(c);
    box.appendChild(b);
  });
}

/* ---------- pointer input ---------- */
function toCanvas(e) {
  const r = disp.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * P.w / r.width,
    y: (e.clientY - r.top) * P.h / r.height,
  };
}

disp.addEventListener('pointerdown', e => {
  if (!P || S.playing || anyModalOpen()) return;
  if (S.spaceHeld || e.button === 1) return; // pan handled by stagewrap
  if (e.button !== 0) return;
  disp.setPointerCapture(e.pointerId);
  const p = toCanvas(e);
  toolDown(p, e);
});
disp.addEventListener('pointermove', e => {
  if (!P) return;
  S.cursor = toCanvas(e);
  if (!S.drawing || S.playing) { drawOverlay(); return; }
  const p = S.cursor;
  if (S.tool === 'brush' || S.tool === 'eraser') {
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs.length ? evs : [e]) extendStroke(toCanvas(ev));
  } else if (S.tool === 'line' || S.tool === 'rect' || S.tool === 'ellipse') {
    shapeTo(p, e.shiftKey);
  } else if (S.tool === 'lasso') {
    lassoMove(p);
  }
  drawOverlay();
});
const pointerEnd = e => {
  if (!S.drawing) return;
  if (S.tool === 'brush' || S.tool === 'eraser' || S.tool === 'line' || S.tool === 'rect' || S.tool === 'ellipse') endStroke();
  else if (S.tool === 'lasso') lassoUp();
  S.drawing = false;
};
disp.addEventListener('pointerup', pointerEnd);
disp.addEventListener('pointercancel', pointerEnd);
disp.addEventListener('pointerleave', () => { S.cursor = null; drawOverlay(); });

function toolDown(p, e) {
  if (S.tool === 'picker') { pickColor(p); return; }
  if (S.tool === 'fill') { doFill(p); return; }
  if (S.tool === 'lasso') { lassoDown(p); S.drawing = true; return; }
  beginStroke(p);
  S.drawing = true;
}

function beginStroke(p) {
  sctx.clearRect(0, 0, P.w, P.h);
  sctx.save();
  sctx.lineWidth = S.size;
  sctx.lineCap = 'round';
  sctx.lineJoin = 'round';
  sctx.strokeStyle = S.color;
  sctx.fillStyle = S.color;
  stroke = { last: p, mid: p, start: p };
  if (S.tool === 'brush' || S.tool === 'eraser') {
    sctx.beginPath();
    sctx.arc(p.x, p.y, Math.max(0.1, S.size / 2), 0, Math.PI * 2);
    sctx.fill();
  }
  beforePix = snapshotLayer(S.cf, S.cl);
}
function extendStroke(p) {
  if (!stroke) return;
  const a = stroke.last;
  if (Math.abs(p.x - a.x) + Math.abs(p.y - a.y) < 0.75) return;
  const mid = { x: (a.x + p.x) / 2, y: (a.y + p.y) / 2 };
  sctx.beginPath();
  sctx.moveTo(stroke.mid.x, stroke.mid.y);
  sctx.quadraticCurveTo(a.x, a.y, mid.x, mid.y);
  sctx.stroke();
  stroke.last = p;
  stroke.mid = mid;
}
function shapeTo(p, shift) {
  if (!stroke) return;
  sctx.clearRect(0, 0, P.w, P.h);
  let x1 = stroke.start.x, y1 = stroke.start.y, x2 = p.x, y2 = p.y;
  if (shift) {
    if (S.tool === 'line') {
      const dx = x2 - x1, dy = y2 - y1;
      const ang = Math.atan2(dy, dx);
      const snapped = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4);
      const len = Math.hypot(dx, dy);
      x2 = x1 + Math.cos(snapped) * len;
      y2 = y1 + Math.sin(snapped) * len;
    } else {
      const dx = x2 - x1, dy = y2 - y1;
      const m = Math.max(Math.abs(dx), Math.abs(dy));
      x2 = x1 + (dx < 0 ? -m : m);
      y2 = y1 + (dy < 0 ? -m : m);
    }
  }
  sctx.beginPath();
  if (S.tool === 'line') {
    sctx.moveTo(x1, y1); sctx.lineTo(x2, y2); sctx.stroke();
  } else if (S.tool === 'rect') {
    const rx = Math.min(x1, x2), ry = Math.min(y1, y2);
    const rw = Math.abs(x2 - x1), rh = Math.abs(y2 - y1);
    if (S.fillShape) sctx.fillRect(rx, ry, rw, rh);
    sctx.strokeRect(rx, ry, rw, rh);
  } else if (S.tool === 'ellipse') {
    sctx.ellipse((x1 + x2) / 2, (y1 + y2) / 2, Math.abs(x2 - x1) / 2, Math.abs(y2 - y1) / 2, 0, 0, Math.PI * 2);
    if (S.fillShape) sctx.fill();
    sctx.stroke();
  }
}
function endStroke() {
  if (!stroke) return;
  const cv = P.frames[S.cf].c[S.cl];
  const lc = rctx(cv);
  lc.save();
  lc.globalAlpha = S.opacity;
  if (S.tool === 'eraser') lc.globalCompositeOperation = 'destination-out';
  lc.drawImage(strokeBuf, 0, 0);
  lc.restore();
  const after = snapshotLayer(S.cf, S.cl);
  if (beforePix) pushPixelsCmd(S.cf, S.cl, beforePix, after);
  stroke = null; beforePix = null;
  render(); drawThumb(S.cf); scheduleAutosave();
}

function doFill(p) {
  const x = p.x | 0, y = p.y | 0;
  if (x < 0 || y < 0 || x >= P.w || y >= P.h) return;
  const cv = P.frames[S.cf].c[S.cl];
  const lc = rctx(cv);
  const before = snapshotLayer(S.cf, S.cl);
  const ok = floodFill(lc, x, y, S.color, S.tol);
  if (!ok) return;
  pushPixelsCmd(S.cf, S.cl, before, snapshotLayer(S.cf, S.cl));
  render(); drawThumb(S.cf); scheduleAutosave();
}
function floodFill(lc, x, y, hex, tol) {
  const w = P.w, h = P.h;
  const img = lc.getImageData(0, 0, w, h), d = img.data;
  const si = (y * w + x) * 4;
  const tr = d[si], tg = d[si + 1], tb = d[si + 2], ta = d[si + 3];
  const fr = hexToRgb(hex);
  if (tr === fr[0] && tg === fr[1] && tb === fr[2] && ta === 255) return false;
  const th = 4 * tol * tol;
  const match = o => {
    const dr = d[o] - tr, dg = d[o + 1] - tg, db = d[o + 2] - tb, da = d[o + 3] - ta;
    return dr * dr + dg * dg + db * db + da * da <= th;
  };
  const seen = new Uint8Array(w * h);
  const stack = [x + y * w];
  while (stack.length) {
    let i = stack.pop();
    if (seen[i]) continue;
    const o0 = i * 4;
    if (!match(o0)) continue;
    const yi = (i / w) | 0;
    let x0 = i - yi * w, x1 = x0;
    while (x0 > 0 && !seen[yi * w + x0 - 1] && match((yi * w + x0 - 1) * 4)) x0--;
    while (x1 < w - 1 && !seen[yi * w + x1 + 1] && match((yi * w + x1 + 1) * 4)) x1++;
    for (let xx = x0; xx <= x1; xx++) {
      const ii = yi * w + xx;
      if (seen[ii]) continue;
      seen[ii] = 1;
      const oo = ii * 4;
      d[oo] = fr[0]; d[oo + 1] = fr[1]; d[oo + 2] = fr[2]; d[oo + 3] = 255;
      if (yi > 0) { const u = ii - w; if (!seen[u] && match(u * 4)) stack.push(u); }
      if (yi < h - 1) { const dn = ii + w; if (!seen[dn] && match(dn * 4)) stack.push(dn); }
    }
  }
  lc.putImageData(img, 0, 0);
  return true;
}

function pickColor(p) {
  tActx.clearRect(0, 0, P.w, P.h);
  compositeLayersTo(tActx, S.cf, { bg: true });
  const x = clamp(p.x | 0, 0, P.w - 1), y = clamp(p.y | 0, 0, P.h - 1);
  const d = tActx.getImageData(x, y, 1, 1).data;
  if (d[3] < 10) { toast('Nothing to pick here'); return; }
  setColor(rgbToHex(d[0], d[1], d[2]));
  setTool('brush');
}

/* lasso */
function lassoDown(p) {
  if (lasso && lasso.mode === 'move') {
    lasso.drag = { sx: p.x - lasso.dx, sy: p.y - lasso.dy };
    return;
  }
  lasso = { pts: [p], mode: 'draw', dx: 0, dy: 0 };
}
function lassoMove(p) {
  if (!lasso) return;
  if (lasso.mode === 'move') {
    if (!lasso.drag) return;
    lasso.dx = p.x - lasso.drag.sx;
    lasso.dy = p.y - lasso.drag.sy;
    render();
    return;
  }
  const lp = lasso.pts[lasso.pts.length - 1];
  if (Math.hypot(p.x - lp.x, p.y - lp.y) > 1.5) { lasso.pts.push(p); drawOverlay(); }
}
function lassoUp() {
  if (!lasso) return;
  if (lasso.mode === 'move') { lasso.drag = null; return; }
  if (lasso.pts.length < 3 || lassoArea(lasso.pts) < 12) { lasso = null; drawOverlay(); return; }
  lasso.before = snapshotLayer(S.cf, S.cl);
  mctx.clearRect(0, 0, P.w, P.h);
  pathPoly(mctx, lasso.pts);
  mctx.fillStyle = '#fff';
  mctx.fill();
  p2ctx.clearRect(0, 0, P.w, P.h);
  p2ctx.drawImage(P.frames[S.cf].c[S.cl], 0, 0);
  p2ctx.globalCompositeOperation = 'destination-in';
  p2ctx.drawImage(selMask, 0, 0);
  p2ctx.globalCompositeOperation = 'source-over';
  const lc = rctx(P.frames[S.cf].c[S.cl]);
  lc.save();
  lc.globalCompositeOperation = 'destination-out';
  lc.drawImage(selMask, 0, 0);
  lc.restore();
  lasso.mode = 'move';
  toast('Move the selection — Enter to apply, Esc to cancel', 3200);
  render(); drawOverlay();
}
function lassoArea(pts) {
  let a = 0;
  for (let i = 0, n = pts.length; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    a += p.x * q.y - q.x * p.y;
  }
  return Math.abs(a / 2);
}
function commitLasso() {
  if (!lasso || lasso.mode !== 'move') { lasso = null; drawOverlay(); return; }
  const lc = rctx(P.frames[S.cf].c[S.cl]);
  lc.drawImage(pieceBuf, Math.round(lasso.dx), Math.round(lasso.dy));
  const before = lasso.before;
  lasso = null;
  pushPixelsCmd(S.cf, S.cl, before, snapshotLayer(S.cf, S.cl));
  render(); drawThumb(S.cf); drawOverlay(); scheduleAutosave();
}
function cancelLasso() {
  if (!lasso) return;
  if (lasso.before) rctx(P.frames[S.cf].c[S.cl]).putImageData(lasso.before, 0, 0);
  lasso = null;
  render(); drawOverlay();
}

/* ---------- zoom / pan ---------- */
function applyZoom() {
  if (!P) return;
  disp.style.width = (P.w * S.zoom) + 'px';
  disp.style.height = (P.h * S.zoom) + 'px';
  disp.classList.toggle('pixelated', S.zoom >= 2.5);
  $('#zoomPct').textContent = Math.round(S.zoom * 100) + '%';
}
function fitZoom() {
  if (!P) return;
  const aw = stagewrap.clientWidth - 48, ah = stagewrap.clientHeight - 48;
  S.zoom = clamp(Math.min(aw / P.w, ah / P.h), 0.05, 2);
  S.autoFit = true;
  applyZoom();
  requestAnimationFrame(() => {
    stagewrap.scrollLeft = (stagewrap.scrollWidth - stagewrap.clientWidth) / 2;
    stagewrap.scrollTop = (stagewrap.scrollHeight - stagewrap.clientHeight) / 2;
  });
}
function zoomAt(cx, cy, factor) {
  const old = S.zoom;
  S.zoom = clamp(old * factor, 0.05, 8);
  if (S.zoom === old) return;
  const r1 = disp.getBoundingClientRect();
  const dx = cx - r1.left, dy = cy - r1.top;
  applyZoom();
  const r2 = disp.getBoundingClientRect();
  stagewrap.scrollLeft += (r2.left + dx * (S.zoom / old)) - cx;
  stagewrap.scrollTop += (r2.top + dy * (S.zoom / old)) - cy;
  S.autoFit = false;
}
stagewrap.addEventListener('wheel', e => {
  if (!P) return;
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0012));
}, { passive: false });

stagewrap.addEventListener('pointerdown', e => {
  if (!P || S.playing) return;
  if (e.button === 1 || (e.button === 0 && S.spaceHeld)) {
    e.preventDefault();
    pan = { x: e.clientX, y: e.clientY, sl: stagewrap.scrollLeft, st: stagewrap.scrollTop };
    stagewrap.classList.add('panning');
    stagewrap.setPointerCapture(e.pointerId);
  }
});
stagewrap.addEventListener('pointermove', e => {
  if (!pan) return;
  stagewrap.scrollLeft = pan.sl - (e.clientX - pan.x);
  stagewrap.scrollTop = pan.st - (e.clientY - pan.y);
});
const panEnd = () => { pan = null; stagewrap.classList.remove('panning'); };
stagewrap.addEventListener('pointerup', panEnd);
stagewrap.addEventListener('pointercancel', panEnd);
stagewrap.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', () => { if (S.autoFit) fitZoom(); });

/* ---------- playback ---------- */
let rafId = 0, lastT = 0, acc = 0;
function togglePlay() { S.playing ? stopPlay() : startPlay(); }
function startPlay() {
  if (!P || S.playing) return;
  S.playing = true;
  $('#btnPlay').innerHTML = icon('pause');
  acc = 0; lastT = performance.now();
  if (S.audio) {
    try { S.audio.currentTime = Math.min(S.audio.duration || 0, S.cf / P.fps); S.audio.play().catch(() => { }); } catch (e) { }
  }
  rafId = requestAnimationFrame(tick);
}
function tick(now) {
  if (!S.playing) return;
  const spf = 1000 / P.fps;
  let dt = now - lastT; lastT = now;
  if (dt > 250) dt = 250;
  acc += dt;
  let moved = false;
  while (acc >= spf) {
    acc -= spf;
    if (S.cf < P.frames.length - 1) S.cf++;
    else if (S.loop) {
      S.cf = 0;
      if (S.audio) { try { S.audio.currentTime = 0; S.audio.play().catch(() => { }); } catch (e) { } }
    } else { stopPlay(); return; }
    moved = true;
  }
  if (moved) { render(); updateCounter(); scrollStripTo(S.cf); }
  rafId = requestAnimationFrame(tick);
}
function stopPlay() {
  if (!S.playing) return;
  S.playing = false;
  cancelAnimationFrame(rafId);
  if (S.audio) S.audio.pause();
  $('#btnPlay').innerHTML = icon('play');
  render();
  updateStripSelection();
}

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();

  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  switch (e.key.toLowerCase()) {
    case 'b': setTool('brush'); break;
    case 'e': setTool('eraser'); break;

    case 'arrowright': case '.': e.preventDefault(); setCurFrame(S.cf + 1); break;

/* ============================================================
   FlipaClip Studio — export & project files
   ============================================================ */
'use strict';

const evenDim = v => Math.max(2, 2 * Math.round(v / 2));
function safeName() {
  return (P.name || 'animation').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'animation';
}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}

/* ---------- project serialization ---------- */
function serializeProject() {
  return JSON.stringify({
    app: 'flipaclip-clone',
    version: 1,
    name: P.name, w: P.w, h: P.h, fps: P.fps, bg: P.bg,
    layers: P.layers.map(l => ({ name: l.name, visible: l.visible, opacity: l.opacity })),
    frames: P.frames.map(f => f.c.map(cv => cv.toDataURL('image/png'))),
  });
}
async function loadProjectJSON(txt) {
  const o = JSON.parse(txt);
  if (!o || o.app !== 'flipaclip-clone' || !Array.isArray(o.frames) || !o.frames.length || !o.w)
    throw new Error('not a FlipaClip Studio project file');
  const np = {
    name: String(o.name || 'Animation'),
    w: o.w | 0, h: o.h | 0,
    fps: clamp(o.fps || 12, 1, 60),
    bg: o.bg || '#ffffff',
    layers: (Array.isArray(o.layers) && o.layers.length ? o.layers : [{ name: 'Layer 1', visible: true, opacity: 1 }])
      .map(l => ({ id: uid(), name: String(l.name || 'Layer'), visible: l.visible !== false, opacity: clamp(+l.opacity || 1, 0, 1) })),
    frames: [],
  };
  const imgRows = o.frames.map(row => (Array.isArray(row) ? row : []).map(src => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = String(src);
  })));
  const flat = await Promise.all(imgRows.flat());
  let k = 0;
  for (const row of imgRows) {
    const imgs = [];
    for (let i = 0; i < row.length; i++) imgs.push(flat[k++]);
    np.frames.push({
      id: uid(),
      c: np.layers.map((L, li) => {
        const cv = mkCanvas(np.w, np.h);
        const im = imgs[li];
        if (im) pctx(cv).drawImage(im, 0, 0, np.w, np.h);
        return cv;
      }),
    });
  }
  closeModal('mNew');
  setProject(np);
}
function saveProjectFile() {
  flushAutosave();
  const blob = new Blob([serializeProject()], { type: 'application/json' });
  downloadBlob(blob, safeName() + '.flipaclip.json');
  toast('Project saved — open it later with Open');
}

/* ---------- export modal ---------- */
let exFmt = 'gif';
let exBusy = false;
let exAbort = false;

function openExport() {
  if (!P) return;
  if (exBusy) return;
  const sel = $('#exFps');
  sel.innerHTML = '';
  [8, 12, 15, 24, 30, 60].forEach(v => {
    const o = document.createElement('option');
    o.value = String(v); o.textContent = v + ' fps';
    if (v === P.fps) o.selected = true;
    sel.appendChild(o);
  });
  if (!Array.from(sel.options).some(o => o.selected)) sel.value = String(P.fps);
  $('#exProgWrap').hidden = true;
  $('#exProg').style.width = '0%';
  $('#exStatus').textContent = '';
  $('#exGo').disabled = false;
  $('#exCancel').textContent = 'Cancel';
  updateExInfo();
  openModal('mExport');
}
function updateExInfo() {
  const scale = parseFloat($('#exScale').value);
  const w = evenDim(P.w * scale), h = evenDim(P.h * scale);
  const fps = +$('#exFps').value || P.fps;
  const dur = (P.frames.length / fps).toFixed(1);
  let txt = P.frames.length + ' frames · ' + dur + ' s · ' + w + ' × ' + h + ' px';
  if (exFmt === 'mp4') {
    const m = pickVideoMime();
    txt += ' — ' + (m && m.startsWith('video/mp4') ? 'records MP4 in this browser (real time)'
      : m ? 'this browser records WebM (MP4 not supported here)' : 'video recording not supported');
  }
  if (exFmt === 'gif') txt += ' — GIF animates forever, optimized palette';
  if (exFmt === 'png') txt += ' — one transparent-ready PNG per frame';
  $('#exInfo').textContent = txt;
}
function setProgress(frac, label) {
  $('#exProg').style.width = Math.round(frac * 100) + '%';
  if (label !== undefined) $('#exStatus').textContent = label;
}

function pickVideoMime() {
  if (typeof MediaRecorder === 'undefined') return null;
  const cands = [
    'video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4',
    'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm',
  ];
  for (const m of cands) {
    try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) { }
  }
  return null;
}

function drawExportFrame(cx, w, h, fi) {
  tActx.clearRect(0, 0, P.w, P.h);
  compositeLayersTo(tActx, fi, { bg: true });
  cx.clearRect(0, 0, w, h);
  cx.drawImage(tmpA, 0, 0, w, h);
}

async function exportGIF(scale, fps) {
  const w = evenDim(P.w * scale), h = evenDim(P.h * scale);
  const c = mkCanvas(w, h);
  const cx = rctx(c);
  const frames = [];
  const n = P.frames.length;
  for (let i = 0; i < n; i++) {
    if (exAbort) throw new Error('cancelled');
    drawExportFrame(cx, w, h, i);
    const id = cx.getImageData(0, 0, w, h);
    const pal = FCGIF.medianCutPalette(id.data, w, h, 256);
    const idx = FCGIF.indexMap(id.data, w, h, pal);
    frames.push({ palette: pal, pixels: idx });
    setProgress((i + 1) / n * 0.9, 'Encoding frame ' + (i + 1) + '/' + n + '…');
    await new Promise(r => setTimeout(r, 0));
  }
  setProgress(0.95, 'Building GIF file…');
  await new Promise(r => setTimeout(r, 0));
  const delay = Math.max(2, Math.round(100 / fps));
  const bytes = FCGIF.buildGIF(frames, w, h, delay, 0);
  downloadBlob(new Blob([bytes], { type: 'image/gif' }), safeName() + '.gif');
  setProgress(1, 'Done — GIF saved');
}

async function exportVideo(scale, fps) {
  const mime = pickVideoMime();
  if (!mime) throw new Error('this browser does not support video recording');
  const w = evenDim(P.w * scale), h = evenDim(P.h * scale);
  const c = mkCanvas(w, h);
  const cx = pctx(c);
  const n = P.frames.length;
  const stream = c.captureStream(fps);
  const bitrate = clamp(Math.round(w * h * fps * 0.18), 1500000, 16000000);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: bitrate });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(res => { rec.onstop = res; });
  drawExportFrame(cx, w, h, 0);
  rec.start();
  const total = n * 1000 / fps;
  await new Promise(res => {
    const t0 = performance.now();
    function loop(now) {
      if (exAbort) { res(); return; }
      const t = now - t0;
      const fi = Math.min(n - 1, Math.floor(t / (1000 / fps)));
      drawExportFrame(cx, w, h, fi);
      setProgress(Math.min(0.95, t / total), 'Recording ' + Math.min(n, fi + 1) + '/' + n + ' (real time)…');
      if (t >= total + 120) { res(); return; }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  });
  rec.stop();
  await stopped;
  stream.getTracks().forEach(t => t.stop());
  if (exAbort) throw new Error('cancelled');
  const isMp4 = mime.startsWith('video/mp4');
  const blob = new Blob(chunks, { type: mime.split(';')[0] });
  downloadBlob(blob, safeName() + (isMp4 ? '.mp4' : '.webm'));
  setProgress(1, 'Done — ' + (isMp4 ? 'MP4' : 'WebM') + ' saved');
  if (!isMp4) toast('This browser cannot record MP4 — saved as WebM instead (plays in most players)', 5200);
}

async function exportPNGs(scale) {
  const w = evenDim(P.w * scale), h = evenDim(P.h * scale);
  const c = mkCanvas(w, h);
  const cx = pctx(c);
  const files = [];
  const n = P.frames.length;
  for (let i = 0; i < n; i++) {
    if (exAbort) throw new Error('cancelled');
    drawExportFrame(cx, w, h, i);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const bytes = new Uint8Array(await blob.arrayBuffer());
    files.push({ name: 'frame_' + String(i + 1).padStart(4, '0') + '.png', data: bytes });
    setProgress((i + 1) / n * 0.9, 'Rendering frame ' + (i + 1) + '/' + n + '…');
  }
  setProgress(0.95, 'Packing ZIP…');
  await new Promise(r => setTimeout(r, 0));
  downloadBlob(FCZIP.makeZip(files), safeName() + '_frames.zip');
  setProgress(1, 'Done — ZIP saved');
}

function bindExportEvents() {
  $$('#mExport .excard').forEach(card => {
    card.onclick = () => {
      if (exBusy) return;
      exFmt = card.dataset.fmt;
      $$('#mExport .excard').forEach(c => c.classList.toggle('on', c === card));
      $('#exFpsRow').hidden = exFmt === 'png';
      updateExInfo();
    };
  });
  $('#exScale').addEventListener('change', updateExInfo);
  $('#exFps').addEventListener('change', updateExInfo);
  $('#exCancel').onclick = () => {
    if (exBusy) { exAbort = true; $('#exStatus').textContent = 'Cancelling…'; }
    else closeModal('mExport');
  };
  $('#exGo').onclick = async () => {
    if (exBusy) return;
    exBusy = true;
    exAbort = false;
    $('#exGo').disabled = true;
    $('#exProgWrap').hidden = false;
    const scale = parseFloat($('#exScale').value);
    const fps = +$('#exFps').value || P.fps;
    try {
      if (exFmt === 'gif') await exportGIF(scale, fps);
      else if (exFmt === 'mp4') await exportVideo(scale, fps);
      else await exportPNGs(scale);
    } catch (err) {
      console.error(err);
      setProgress(0, '');
      $('#exStatus').textContent = err.message === 'cancelled' ? 'Cancelled' : 'Failed: ' + err.message;
    } finally {
      exBusy = false;
      $('#exGo').disabled = false;
      $('#exCancel').textContent = 'Close';
    }
  };
}

</script>
