"use strict";
/* ============================================================
   VS GLITCH — a FNF-style HARD MOD (single file)
   "GLITCH ENGINE v1.0" — Kade/Psych-style features:
   - DFJK keybinds (rebindable) + arrow keys + touch lanes
   - Judgments: SICK / GOOD / BAD / SHIT + timing windows (ms)
   - Accuracy %, combo, ranks (S+/S/A/B/C/D/F), FC tags
   - Health bar with bouncing icons, miss drain, note splashes
   - Botplay, Downscroll, Middlescroll, Ghost Tapping,
     Note Speed, Audio Offset, Freeplay best scores, Story Mode
   - No ESC needed: pause = ENTER / BACKSPACE / tap button
   ============================================================ */
const W=1280,H=720,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let vw=innerWidth,vh=innerHeight,dpr=1,sc=1,ox=0,oy=0;
function resize(){vw=innerWidth;vh=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);cv.style.width=vw+'px';cv.style.height=vh+'px';sc=Math.min(vw/W,vh/H);ox=(vw-W*sc)/2;oy=(vh-H*sc)/2;}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pad16=s=>{s=String(s);while(s.length<16)s+='.';return s.slice(0,16)};

/* ---------------- save / options ---------------- */
const SKEY='fateFnfVsGlitch1';
function defOpts(){return{down:false,mid:false,ghost:true,splash:true,bot:false,speed:1,offset:0,binds:['KeyD','KeyF','KeyJ','KeyK']}}
let save={};try{save=JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){save={}}
save.opt=Object.assign(defOpts(),save.opt||{});
if(!Array.isArray(save.opt.binds)||save.opt.binds.length!==4)save.opt.binds=['KeyD','KeyF','KeyJ','KeyK'];
save.scores=save.scores||{};
const persist=()=>{try{localStorage.setItem(SKEY,JSON.stringify(save))}catch(e){}};
const OPT=save.opt;

/* ---------------- constants ---------------- */
const LANE_COL=['#C24B99','#00FFFF','#12FA05','#F9393F'];
const ARROWS=['ArrowLeft','ArrowDown','ArrowUp','ArrowRight'];
const WIND={sick:0.045,good:0.09,bad:0.135,shit:0.16};

             {k:'good',w:0.09,acc:0.8,hp:1.6,s:200,col:'#39FF14'},
             {k:'bad',w:0.135,acc:0.5,hp:0.4,s:50,col:'#FFB43B'},
             {k:'shit',w:0.16,acc:0.25,hp:0,s:10,col:'#FF4B4B'}];

const DIFFS=['NORMAL','HARD','INSANE'];
const DIFF_SPD={NORMAL:0.85,HARD:1,INSANE:1.18};

/* ---------------- audio core ---------------- */
let AC=null,master=null,noiseB=null;
function ensureAudio(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const cmp=AC.createDynamicsCompressor();cmp.threshold.value=-14;cmp.ratio.value=4;
  master=AC.createGain();master.gain.value=0.9;
  master.connect(cmp);cmp.connect(AC.destination);
  const len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;noiseB=b;
}
const outLat=()=>(AC?(AC.outputLatency||AC.baseLatency||0):0);
function env(g,at,v,a,d){g.gain.setValueAtTime(0.0001,at);g.gain.linearRampToValueAtTime(v,at+a);g.gain.exponentialRampToValueAtTime(0.0001,at+a+d);}
function osc(type,f,at,stop,det){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,at);if(det)o.detune.value=det;o.start(at);o.stop(stop);return o;}
function noise(at,stop){const s=AC.createBufferSource();s.buffer=noiseB;s.loop=true;s.start(at);s.stop(stop);return s;}
function iKick(at,v){v=v||1;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(150,at);o.frequency.exponentialRampToValueAtTime(42,at+0.12);env(g,at,0.75*v,0.002,0.26);o.connect(g);g.connect(master);o.start(at);o.stop(at+0.3);}
function iSnare(at,v){v=v||1;const n=noise(at,at+0.22),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=1900;f.Q.value=0.8;env(g,at,0.5*v,0.001,0.18);n.connect(f);f.connect(g);g.connect(master);
  const o=osc('triangle',196,at,at+0.1),g2=AC.createGain();env(g2,at,0.3*v,0.001,0.09);o.connect(g2);g2.connect(master);}
function iHat(at,open,v){v=v||1;const n=noise(at,at+(open?0.32:0.06)),f=AC.createBiquadFilter(),g=AC.createGain();f.type='highpass';f.frequency.value=7500;env(g,at,(open?0.22:0.14)*v,0.001,open?0.3:0.05);n.connect(f);f.connect(g);g.connect(master);}
function iBass(at,f0,d,v){v=v||1;const o=osc('square',f0,at,at+d),o2=osc('sine',f0/2,at,at+d),fl=AC.createBiquadFilter(),g=AC.createGain();fl.type='lowpass';fl.frequency.setValueAtTime(900,at);fl.frequency.exponentialRampToValueAtTime(250,at+d);env(g,at,0.23*v,0.004,Math.max(0.05,d*0.95));o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(master);}
function iLead(at,f0,d,v){v=v||1;const g=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=2600;env(g,at,0.12*v,0.005,Math.max(0.08,d));osc('square',f0,at,at+d+0.05,-6).connect(fl);osc('square',f0,at,at+d+0.05,6).connect(fl);fl.connect(g);g.connect(master);}
function iVocP(at,f0){const g=AC.createGain(),g2=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=2200;env(g,at,0.12,0.004,0.18);env(g2,at,0.05,0.004,0.12);osc('square',f0,at,at+0.24,0).connect(g);osc('square',f0*2.01,at,at+0.2,0).connect(g2);g.connect(fl);g2.connect(fl);fl.connect(master);}
function iVocO(at,f0){const g=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1400;env(g,at,0.16,0.005,0.24);osc('sawtooth',f0,at,at+0.3,-8).connect(fl);osc('sawtooth',f0,at,at+0.3,8).connect(fl);fl.connect(g);g.connect(master);}
function iCrash(at){const n=noise(at,at+1.2),f=AC.createBiquadFilter(),g=AC.createGain();f.type='highpass';f.frequency.value=5200;env(g,at,0.3,0.002,1.15);n.connect(f);f.connect(g);g.connect(master);}
function iRiser(at,d){const n=noise(at,at+d),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(300,at);f.frequency.exponentialRampToValueAtTime(6000,at+d);g.gain.setValueAtTime(0.0001,at);g.gain.linearRampToValueAtTime(0.26,at+d);g.gain.linearRampToValueAtTime(0.0001,at+d+0.06);n.connect(f);f.connect(g);g.connect(master);}
function iTick(at,hi){const o=osc('square',hi?880:440,at,at+0.09),g=AC.createGain();env(g,at,0.2,0.002,0.08);o.connect(g);g.connect(master);}
function iMiss(at){const o=osc('sawtooth',300,at,at+0.25),g=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=900;o.frequency.exponentialRampToValueAtTime(90,at+0.22);env(g,at,0.18,0.003,0.22);o.connect(fl);fl.connect(g);g.connect(master);}
function playEv(e,at){switch(e.type){
  case 'kick':iKick(at,e.v);break;case 'snare':iSnare(at,e.v);break;
  case 'hat':iHat(at,e.open,e.v);break;case 'bass':iBass(at,e.f,e.d,e.v);break;
  case 'lead':iLead(at,e.f,e.d,e.v);break;case 'ovoc':iVocO(at,e.f);break;
  case 'crash':iCrash(at);break;case 'riser':iRiser(at,e.d);break;
  case 'tick':iTick(at,e.hi);break;case 'miss':iMiss(at);break;
  case 'pvoc':iVocP(at,e.f);break;}}
function killTail(){if(!AC)return;const now=AC.currentTime;try{master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(0,now);}catch(e){}
  setTimeout(()=>{if(AC){try{master.gain.linearRampToValueAtTime(0.9,AC.currentTime+0.25)}catch(e){}}},400);}

/* ---------------- menu music loop ---------------- */
const MM={t0:0,next:0,timer:null};
function menuLoopEvents(){
  const bpm=118,bl=60/bpm,st=bl/4,ev=[],roots=[110,110,87.31,98];
  for(let b=0;b<4;b++){const t0=b*16*st;
    for(const i of[0,8])ev.push({t:t0+i*st,type:'kick',v:0.8});
    for(let i=0;i<16;i+=2)ev.push({t:t0+i*st,type:'hat',v:0.4});
    if(b%2===1){ev.push({t:t0+4*st,type:'snare',v:0.6});ev.push({t:t0+12*st,type:'snare',v:0.6});}
    const r=roots[b];for(let i=0;i<16;i+=4)ev.push({t:t0+i*st,type:'bass',f:r,d:st*3,v:0.7});
  }
  const riff='0...3...2...4...0.......3.......',sc2=[220,261.63,293.66,329.63,392,440];
  for(let i=0;i<32;i++){const c=riff[i];if(c>='0'&&c<='8'&&sc2[+c])ev.push({t:i*st,type:'lead',f:sc2[+c],d:st*3,v:0.6});}
  return ev;
}
function startMenuMusic(){if(!AC)return;stopMenuMusic();AC.resume();MM.t0=AC.currentTime+0.05;MM.next=0;
  MM.timer=setInterval(()=>{const bl=60/118*4;try{
    while(MM.t0+MM.next<AC.currentTime+0.35){const base=MM.t0+MM.next;
      for(const e of menuLoopEvents())playEv(e,base+e.t);MM.next+=bl;}
  }catch(e){}},80);}
function stopMenuMusic(){if(MM.timer){clearInterval(MM.timer);MM.timer=null;}}

/* ---------------- text / draw helpers ---------------- */
function txt(g,s,x,y,size,fill,align,mono,ow){
  g.font=(mono?'bold ':'900 ')+size+'px '+(mono?'"Courier New",monospace':'"Arial Black",Arial,sans-serif');
  g.textAlign=align||'center';g.textBaseline='middle';
  if(ow!==false){g.lineJoin='round';g.lineWidth=Math.max(3,size/7);g.strokeStyle='#000';g.strokeText(s,x,y);}
  g.fillStyle=fill;g.fillText(s,x,y);
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
function line(g,x1,y1,x2,y2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
/* ============================================================
   SONG DATA — bars are 4 lane-strings of 16 steps ('x' = note)
   lane order: 0=LEFT(D) 1=DOWN(F) 2=UP(J) 3=RIGHT(K)
   ============================================================ */
const DR={
  k:{k:'x...x...x...x...'},
  kb:{k:'x...x...x...x...',h:'..x...x...x...x.'},
  full:{k:'x...x...x...x...',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.'},
  heavy:{k:'x..x..x...x..x..',s:'....x.......x...',h:'xxxxxxxxxxxxxxxx',fr:true},
  break:{}
};
const BASSM={w:'x...............','8':'x.x.x.x.x.x.x.x.','16':'xxxxxxxxxxxxxxxx',g:'x.xx.x.x.x.xx.x.'};
function addDrums(ev,name,t0,st,first){
  const D=DR[name];if(!D)return;
  const layers=[[D.k,'kick',false],[D.s,'snare',false],[D.h,'hat',false]];
  for(const L of layers)if(L[0])for(let i=0;i<16;i++)if(L[0][i]==='x')ev.push({t:t0+i*st,type:L[1],v:L[1]==='hat'?0.7:1});
  if(D.fr)for(let i=12;i<16;i++)ev.push({t:t0+i*st,type:'snare',v:0.45});
  if(first&&name!=='k'&&name!=='break')ev.push({t:t0,type:'crash'});
}
function addBass(ev,m,t0,st,root){const p=BASSM[m];if(!p)return;
  for(let i=0;i<16;i++)if(p[i]==='x')ev.push({t:t0+i*st,type:'bass',f:root,d:m==='w'?st*14:st*1.8});}
function addLead(ev,riff,t0,st,scale){if(!riff)return;
  for(let i=0;i<32;i++){const c=riff[i];if(c>='0'&&c<='8'&&scale[+c])ev.push({t:t0+i*st,type:'lead',f:scale[+c],d:st*1.6});}}

function xfLanes(l,diff){
  if(diff==='NORMAL'){
    return l.map(str=>{str=pad16(str);let out='';
      for(let i=0;i<16;i++){const c=str[i];
        out+=(c==='x'&&(i%2===0||str[i-1]==='x'))?'x':'.';}
      return out;});
  }
  if(diff==='INSANE'){
    const s=l.map(x=>pad16(x).split(''));
    for(let i=0;i<16;i++){const ln=s.findIndex(a=>a[i]==='x');
      if(ln>=0&&(i===0||i===8)){const l2=(ln+2)%4;if(s[l2][i]!=='x')s[l2][i]='x';}}
    for(let ln=0;ln<4;ln++)for(let i=0;i<15;i+=2){
      if(s[ln][i]==='x'&&s[ln][i+1]==='.'&&!(i>0&&s[ln][i-1]==='x'))s[ln][i+1]='x';}
    return s.map(a=>a.join(''));
  }
  return l.map(pad16);
}
function addChartBar(bd,t0,st,diff,song,ev,notes,onotes){
  if(bd.o){const L=xfLanes(bd.o,diff);
    for(let ln=0;ln<4;ln++)for(let i=0;i<16;i++)if(L[ln][i]==='x'){
      const t=t0+i*st;onotes.push({t:t,lane:ln});
      ev.push({t:t,type:'ovoc',f:VOC_P[ln]/2});}}
  if(bd.p){const L=xfLanes(bd.p,diff);
    for(let ln=0;ln<4;ln++)for(let i=0;i<16;i++)if(L[ln][i]==='x'){
      notes.push({t:t0+i*st,lane:ln,st:0});}}
}
function buildSong(song,diff){
  const bl=60/song.bpm,st=bl/4,ev=[],notes=[],onotes=[];
  let bar=0;
  for(const sec of song.sections){
    const secT=bar*16*st;
    if(sec.riser)ev.push({t:secT-1.6,type:'riser',d:1.5});
    for(let b=0;b<sec.n;b++){
      const t0=bar*16*st,bd=sec.ch?sec.ch[Math.min(b,sec.ch.length-1)]:null;
      addDrums(ev,sec.d,t0,st,b===0);
      addBass(ev,sec.b,t0,st,song.roots[bar%4]);
      if(sec.l)addLead(ev,song.riffs[sec.l],t0,st,song.scale);
      if(bd)addChartBar(bd,t0,st,diff,song,ev,notes,onotes);
      bar++;
    }
    ev.push({t:secT,type:'flash',i:sec.i||1});
  }
  const total=bar*16*st;
  for(let i=3;i>=1;i--)ev.push({t:-i*bl,type:'tick',hi:false});
  ev.push({t:0,type:'tick',hi:true});
  ev.sort((a,b)=>a.t-b.t);notes.sort((a,b)=>a.t-b.t);onotes.sort((a,b)=>a.t-b.t);
  const pl=[[],[],[],[]],ol=[[],[],[],[]];
  for(const n of notes)pl[n.lane].push(n);
  for(const n of onotes)ol[n.lane].push(n);
  const speedMult=song.speed*DIFF_SPD[diff]*(OPT.speed||1);
  return{ev,pl,ol,total,bl,st,song,diff,speedMult,noteCount:notes.length};
}

     pl:built.pl,ol:built.ol,ds:[0,0,0,0],ods:[0,0,0,0],oi:[0,0,0,0],pi:[0,0,0,0],
     score:0,combo:0,maxCombo:0,misses:0,
     j:{sick:0,good:0,bad:0,shit:0,miss:0},accSum:0,accN:0,
     health:50,pop:[],splash:[],recT:[-9,-9,-9,-9],recOT:[-9,-9,-9,-9],
     poseP:{pose:'idle',t:-9},poseO:{pose:'idle',t:-9},
     bob:0,beat:-99,camZ:1,hudZ:1,shake:0,flashT:-9,intensity:0,
     paused:false,bot:!!OPT.bot,over:false,ended:false,story:!!story,fr:0,pauseSel:0};
  G.t0=AC.currentTime+built.bl*4+0.1;
  state='play';
}
function doHit(n,ln,dt,j){
  G.j[j.k]++;G.combo++;if(G.combo>G.maxCombo)G.maxCombo=G.combo;
  G.score+=j.s+Math.min(G.combo*10,500);
  G.accSum+=j.acc;G.accN++;
  if(!G.bot)G.health=clamp(G.health+j.hp,0,100);
  G.recT[ln]=G.songPos;
  G.pop.push({t:G.songPos,kind:j.k,combo:G.combo,ms:Math.round(dt*1000)});
  addSplash(laneCX(playerBase(),ln),recY(),LANE_COL[ln]);
  G.poseP={pose:DIRP[ln],t:G.songPos};
  if(AC&&!G.bot)playEv({type:'pvoc',f:VOC_P[ln]},AC.currentTime+0.001);
}
function missNote(ln){
  G.j.miss++;G.misses++;G.combo=0;G.accN++;
  if(!G.bot)G.health=clamp(G.health+MISS_HP,0,100);
  G.pop.push({t:G.songPos,kind:'miss',combo:0,ms:null});
  G.poseP={pose:'miss',t:G.songPos};
  if(AC&&!G.bot)iMiss(AC.currentTime);
}
function pressLane(ln){
  if(state!=='play'||!G||G.paused||G.over||G.bot)return;
  const s=G.songPos,arr=G.pl[ln];
  while(G.pi[ln]<arr.length&&arr[G.pi[ln]].st!==0)G.pi[ln]++;
  const i=G.pi[ln];
  if(i<arr.length){
    const n=arr[i],dt=s-n.t;
    if(dt>=-WIND.shit&&dt<=WIND.shit){
      n.st=1;G.pi[ln]=i+1;
      const ad=Math.abs(dt);let j=JUDGE[3];
      for(const jj of JUDGE){if(ad<=jj.w){j=jj;break;}}
      doHit(n,ln,dt,j);return;
    }
  }
  if(!OPT.ghost){
    G.combo=0;G.accN++;if(!G.bot)G.health=clamp(G.health-1.5,0,100);
    G.pop.push({t:s,kind:'miss',combo:0,ms:null});
    G.poseP={pose:'miss',t:s};
    if(AC)iMiss(AC.currentTime);
  }
}
function updatePlay(dt){
  if(!G||G.paused)return;
  G.fr++;
  const s=AC.currentTime-G.t0-outLat()-OPT.offset/1000;
  G.songPos=s;
  const b=G.built;
  while(G.evIdx<b.ev.length&&b.ev[G.evIdx].t<s+0.14){
    const e=b.ev[G.evIdx++];
    if(e.type==='flash'){G.flashT=s;G.intensity=e.i;}
    else{const at=G.t0+e.t;if(at>AC.currentTime-0.08)playEv(e,at);}
  }
  const beat=Math.floor(s/b.bl);
  if(beat!==G.beat){G.beat=beat;
    if(s>=-0.001){G.bob=1;
      if(beat%4===0){G.camZ=Math.max(G.camZ,1.045);G.hudZ=Math.max(G.hudZ,1.02);}
      if(G.intensity>=3)G.shake=0.35;}}
  G.bob=Math.max(0,G.bob-dt*4);
  G.camZ+=(1-G.camZ)*Math.min(1,dt*7);
  G.hudZ+=(1-G.hudZ)*Math.min(1,dt*7);
  G.shake=Math.max(0,G.shake-dt);
  for(let ln=0;ln<4;ln++){const arr=G.ol[ln];
    while(G.oi[ln]<arr.length&&arr[G.oi[ln]].t<=s){
      G.oi[ln]++;G.recOT[ln]=s;G.poseO={pose:DIRP[ln],t:s};}}
  for(let ln=0;ln<4;ln++){const arr=G.pl[ln];
    while(G.pi[ln]<arr.length){const n=arr[G.pi[ln]];
      if(n.st!==0){G.pi[ln]++;continue;}
      if(G.bot&&n.t<=s){n.st=1;doHit(n,ln,0,JUDGE[0]);G.pi[ln]++;continue;}
      if(n.t<s-WIND.shit){n.st=2;G.pi[ln]++;missNote(ln);continue;}
      break;}}
  for(let i=G.splash.length-1;i>=0;i--){const p=G.splash[i];p.t+=dt;if(p.t>p.life)G.splash.splice(i,1);}
  if(!G.bot&&G.health<=0&&!G.over){G.over=true;state='dead';try{AC.suspend();}catch(e){}return;}
  if(!G.ended&&s>b.total+1.2){G.ended=true;finishSong();}
}
function finishSong(){
  const acc=G.accN?G.accSum/G.accN*100:0,rank=rankOf(acc);
  const fc=G.misses===0?(G.j.bad===0&&G.j.shit===0?(G.j.good===0?'PFC':'GFC'):'FC'):'';
  const key=G.song.id+'_'+G.diff,old=save.scores[key];
  G.result={acc:acc,rank:rank,fc:fc,newBest:!old||G.score>old.score};
  if(!old||G.score>old.score){save.scores[key]={score:G.score,acc:+acc.toFixed(2),rank:rank,misses:G.misses};persist();}
  state='results';
}

  for(const t of e.changedTouches){
    const p=evtXY(t);let used=false;
    if(state==='play'&&G&&!G.paused&&!G.over){
      const base=OPT.mid?FLD.mid:FLD.ply;
      if(p[0]>base-40&&p[0]<base+4*LW+40){
        const ln=clamp(Math.floor((p[0]-base)/LW),0,3);
        touchMap.set(t.identifier,ln);pressLane(ln);used=true;}
    }
    if(!used)tapAt(p[0],p[1]);
  }
},{passive:false});
const endTouch=function(e){e.preventDefault();for(const t of e.changedTouches)touchMap.delete(t.identifier);};
cv.addEventListener('touchend',endTouch,{passive:false});
cv.addEventListener('touchcancel',endTouch,{passive:false});
document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='play'&&G&&!G.paused)pauseGame();});
addEventListener('keydown',function(e){
  const code=e.code;
  const PD=['Space','ArrowLeft','ArrowDown','ArrowUp','ArrowRight','Enter','NumpadEnter','Escape','Backspace','Tab'];
  if(PD.indexOf(code)>=0||laneOfCode(code)>=0)e.preventDefault();
  if(e.repeat)return;
  if(state==='boot'){startFromBoot();return;}
  if(state==='keys'){
    if(M.keySel>=0){
      if(code!=='Escape'&&code!=='Backspace'&&code!=='Enter'&&code!=='NumpadEnter'){OPT.binds[M.keySel]=code;persist();}
      M.keySel=-1;}
    return;}
  if(state==='play'){
    if(!G)return;
    if(G.paused){
      if(code==='Backspace')quitPlay();
      else if(code==='Escape')resumeGame();
      else if(code==='Enter'||code==='NumpadEnter')pauseAction(G.pauseSel);
      else if(code==='ArrowUp'||code==='KeyW')G.pauseSel=(G.pauseSel+3)%4;
      else if(code==='ArrowDown'||code==='KeyS')G.pauseSel=(G.pauseSel+1)%4;
      return;}
    if(code==='Enter'||code==='NumpadEnter'||code==='Escape'||code==='Backspace'){pauseGame();return;}
    const ln=laneOfCode(code);
    if(ln>=0&&!kHeld[ln]){kHeld[ln]=true;pressLane(ln);}
    return;}
  if(state==='dead'){
    if(code==='KeyR'||code==='Enter'||code==='NumpadEnter')retry();
    else if(code==='Backspace'||code==='Escape')quitPlay();
    return;}
  if(state==='results'){
    if(code==='Enter'||code==='NumpadEnter'||code==='Escape'||code==='Backspace'||code==='Space')resultsNext();
    return;}
  if(state==='menu'){
    const n=MENU_ROWS().length;
    if(code==='ArrowUp'||code==='KeyW')M.sel=(M.sel+n-1)%n;
    else if(code==='ArrowDown'||code==='KeyS')M.sel=(M.sel+1)%n;
    else if(code==='ArrowLeft'||code==='KeyA'){M.diff=(M.diff+2)%3;persist();}
    else if(code==='ArrowRight'||code==='KeyD'){M.diff=(M.diff+1)%3;persist();}
    else if(code==='Enter'||code==='NumpadEnter'||code==='Space')menuSelect(M.sel);
    return;}
  if(state==='options'){
    if(code==='ArrowUp'||code==='KeyW')M.optSel=(M.optSel+OPT_ROWS.length-1)%OPT_ROWS.length;
    else if(code==='ArrowDown'||code==='KeyS')M.optSel=(M.optSel+1)%OPT_ROWS.length;
    else if(code==='ArrowLeft'||code==='KeyA')optAdjust(M.optSel,-1);
    else if(code==='ArrowRight'||code==='KeyD')optAdjust(M.optSel,1);
    else if(code==='Enter'||code==='NumpadEnter'||code==='Space')optClick(M.optSel);
    else if(code==='Backspace'||code==='Escape'){state='menu';M.resetArm=false;}
    return;}
  if(state==='help'){
    if(code==='Backspace'||code==='Escape'||code==='Enter'||code==='NumpadEnter')state='menu';
    return;}
});
addEventListener('keyup',function(e){const ln=laneOfCode(e.code);if(ln>=0)kHeld[ln]=false;});
/* ============================================================
   MAIN LOOP
   ============================================================ */
function update(dt){lastDt=dt;frameN++;if(state==='play')updatePlay(dt);}
function render(){
  uiHits=[];
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#000000';ctx.fillRect(0,0,vw,vh);
  ctx.setTransform(dpr*sc,0,0,dpr*sc,ox*dpr,oy*dpr);
  if(state==='boot')renderBoot(ctx,lastDt);
  else if(state==='menu')renderMenu(ctx,lastDt);
  else if(state==='options')renderOptions(ctx,lastDt);
  else if(state==='keys')renderKeys(ctx,lastDt);
  else if(state==='help')renderHelp(ctx,lastDt);
  else if(state==='play')renderPlay(ctx,lastDt);
  else if(state==='results')renderResults(ctx,lastDt);
  else if(state==='dead')renderDead(ctx,lastDt);
}
let last=0;
function frame(ts){requestAnimationFrame(frame);
  const dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
  update(dt);render();}
requestAnimationFrame(frame);
</script>
