<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hover! (1995)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
  font-family: Arial, Helvetica, sans-serif; user-select: none; -webkit-user-select: none; }
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; }
canvas#screen { display: block; image-rendering: pixelated; background: #000; }
#bootmsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 14px; text-align: center; pointer-events: none; }
/* touch controls (Android) */
#touch { position: fixed; inset: 0; pointer-events: none; display: none; }
#touch.on { display: block; }
.tc { position: absolute; pointer-events: auto; width: 58px; height: 58px; border-radius: 50%;
  background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.7);
  display: flex; align-items: center; justify-content: center; font-size: 20px; }
.tc:active { background: rgba(255,255,255,.28); }
#t-left { left: 14px; bottom: 76px; } #t-right { left: 148px; bottom: 76px; }
#t-up { left: 81px; bottom: 140px; } #t-down { left: 81px; bottom: 12px; }
#t-jump { right: 14px; bottom: 100px; font-size: 15px; }
#t-wall { right: 80px; bottom: 40px; font-size: 13px; }
#t-cloak { right: 14px; bottom: 24px; font-size: 13px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="screen"></canvas><div id="bootmsg">Loading Hover!…</div></div></div>
<div id="touch">
  <div class="tc" id="t-up">▲</div><div class="tc" id="t-down">▼</div>
  <div class="tc" id="t-left">◀</div><div class="tc" id="t-right">▶</div>
  <div class="tc" id="t-jump">JUMP</div><div class="tc" id="t-wall">WALL</div><div class="tc" id="t-cloak">CLOAK</div>
</div>
<script src="driver.js"></script>
<script async src="hover.js"></script>
</body>
</html>
