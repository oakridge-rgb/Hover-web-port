<script>
(function(){
  var H=['js/hls.min.js','/js/hls.min.js','hls.min.js','js/hls.js','hls.js',
    'https://gcore.jsdelivr.net/npm/hls.js@1/dist/hls.min.js',
    'https://testingcf.jsdelivr.net/npm/hls.js@1/dist/hls.min.js',
    'https://fastly.jsdelivr.net/npm/hls.js@1/dist/hls.min.js',
    'https://unpkg.com/hls.js@1/dist/hls.min.js'];
  var A=['js/artplayer.js','/js/artplayer.js','artplayer.js',
    'https://gcore.jsdelivr.net/npm/artplayer@5/dist/artplayer.js',
    'https://testingcf.jsdelivr.net/npm/artplayer@5/dist/artplayer.js',
    'https://fastly.jsdelivr.net/npm/artplayer@5/dist/artplayer.js',
    'https://unpkg.com/artplayer@5/dist/artplayer.js'];
  window.fateEngine={hls:null,art:null};
  function chain(s,i,w){return new Promise(function(ok,no){if(i>=s.length)return no(new Error('x'));
    var el=document.createElement('script');el.src=s[i];
    el.onload=function(){window.fateEngine[w]=s[i];ok(s[i])};
    el.onerror=function(){el.remove();chain(s,i+1,w).then(ok,no)};document.head.appendChild(el);})}
  window.fateTVLibs='loading';
  window.fateTVLibsReady=Promise.all([chain(H,0,'hls'),chain(A,0,'art')]);
  window.fateTVLibsReady.then(function(){window.fateTVLibs='ok';if(window.updateEngineDot)window.updateEngineDot()})
  .catch(function(){window.fateTVLibs='failed';if(window.updateEngineDot)window.updateEngineDot()});
})();

<style>
:root{--primary:#f59e0b;--secondary:#ef4444;--bg-deep:#050505;--glass-border:rgba(255,255,255,.1);--text:#f8fafc;--text-muted:#cbd5e1;--card:rgba(255,255,255,.03);--nav-h:72px;--player-h:86px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}button{font-family:inherit}
body{background:var(--bg-deep);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;padding-top:var(--nav-h);padding-bottom:40px}
body.player-open{overflow:hidden}
.bg-image{position:fixed;inset:0;z-index:0;background:url("/img/background.png") center center/cover no-repeat}
.bg-overlay{position:fixed;inset:0;z-index:1;background:rgba(5,5,5,.55);backdrop-filter:blur(4px)}
#particleCanvas{position:fixed;inset:0;z-index:2;pointer-events:none}
#mouseGlow{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.12) 0%,transparent 70%);pointer-events:none;z-index:3;transform:translate(-50%,-50%);transition:opacity .3s;opacity:0}
.nav-glass{position:fixed;top:0;left:0;right:0;z-index:800;height:var(--nav-h);background:rgba(5,5,5,.6);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--glass-border);padding:0 20px;display:flex;align-items:center}
.nav-inner{max-width:1400px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px}
.nav-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(245,158,11,.4)}
.nav-logo span{font-weight:800;font-size:18px;color:#fff;font-family:'Space Grotesk',sans-serif}
.nav-title{font-family:'Space Grotesk',sans-serif;font-size:1.15rem;font-weight:700;background:linear-gradient(135deg,#fff,#fcd34d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.panic-btn{padding:10px 16px;border-radius:12px;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;font-weight:700;font-size:.78rem;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 20px rgba(220,38,38,.4);transition:all .3s;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.panic-btn:hover{transform:scale(1.05)}.panic-btn svg{width:12px;height:12px;fill:#fff}
.nav-div{width:1px;height:28px;background:rgba(255,255,255,.1);flex-shrink:0}
.music-toggle{padding:10px 16px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-weight:700;font-size:.78rem;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 20px rgba(245,158,11,.4);transition:all .3s;flex-shrink:0}
.music-toggle:hover{transform:scale(1.05)}
.music-toggle.off{background:rgba(255,255,255,.04);border:1px solid var(--glass-border);color:#cbd5e1;box-shadow:none}
.music-toggle svg{width:12px;height:12px;fill:currentColor}
.engine-dot{width:14px;height:14px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;padding:0;background:#f59e0b;animation:blink 1.5s infinite;transition:all .3s}
.engine-dot.ok{background:#10b981;animation:none;box-shadow:0 0 10px rgba(16,185,129,.8)}
.engine-dot.bad{background:#ef4444;animation:none;box-shadow:0 0 10px rgba(239,68,68,.8)}
.engine-dot:hover{transform:scale(1.3)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
#main{position:relative;z-index:4;max-width:1400px;margin:0 auto;padding:2rem 2rem 4rem}
.page-header{text-align:center;margin-bottom:1.5rem}
.page-header h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#fff 0%,#fcd34d 50%,#f59e0b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 24px rgba(245,158,11,.25))}
.page-header p{color:var(--text-muted);margin-top:.4rem;font-size:.95rem}
.big-search-wrap{max-width:680px;margin:0 auto 1rem;position:relative}
.big-search{width:100%;padding:17px 54px 17px 24px;background:rgba(255,255,255,.03);border:1px solid var(--glass-border);border-radius:18px;color:var(--text);font-size:1.02rem;outline:none;font-family:inherit;transition:all .3s;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.big-search:focus{border-color:rgba(245,158,11,.45);box-shadow:0 0 0 3px rgba(245,158,11,.12),0 14px 50px rgba(245,158,11,.08)}
.big-search::placeholder{color:#64748b}
.search-ic{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:19px;height:19px;fill:#64748b;pointer-events:none}
.search-clear{position:absolute;right:44px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.06);border:none;color:var(--text-muted);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:.8rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.5rem}
.chip{padding:8px 18px;border-radius:30px;background:rgba(255,255,255,.03);border:1px solid var(--glass-border);color:var(--text-muted);font-size:.82rem;font-weight:500;cursor:pointer;transition:all .3s}

.sec{margin-bottom:2rem}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:.9rem}

.sec-head h2 svg{width:18px;height:18px;fill:var(--primary)}
.hscroll{display:flex;gap:1rem;overflow-x:auto;padding-bottom:.5rem;scrollbar-width:thin;scrollbar-color:var(--primary) var(--bg-deep)}
.hscroll::-webkit-scrollbar{height:6px}.hscroll::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}
.rcard{flex:0 0 200px;background:var(--card);border:1px solid var(--glass-border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .3s}

.rcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#111}
.rcard .t{padding:8px 10px;font-size:.8rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.section-title{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700}

.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem}

.v-card.animate-in{animation:cardIn .3s ease forwards;opacity:0}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.v-thumb{position:relative;padding-top:56.25%;background:linear-gradient(135deg,#141418,#0a0a0d);overflow:hidden}
.v-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s,filter .3s}
.v-card:hover .v-thumb img{transform:scale(1.06);filter:brightness(1.1)}
.v-dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.78);color:#fff;padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:600}
.v-info{padding:.75rem .85rem .9rem}
.v-title{font-weight:600;font-size:.92rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.v-channel{color:var(--primary);font-size:.8rem;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-meta{color:#94a3b8;font-size:.74rem;margin-top:2px}
.loading-state{grid-column:1/-1;text-align:center;padding:5rem 2rem;color:var(--text-muted)}

#loadMore{display:none;justify-content:center;align-items:center;padding:2rem;gap:10px;color:var(--text-muted);font-size:.82rem}
#loadMore.visible{display:flex}
.mini-spin{width:18px;height:18px;border:2px solid rgba(245,158,11,.15);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
#sentinel{height:1px}
#playerModal{display:none;position:fixed;inset:0;background:#000;z-index:2000;flex-direction:column}
#playerModal.open{display:flex}

#playerHeader{display:flex;justify-content:space-between;align-items:center;background:rgba(5,5,5,.95);border-bottom:1px solid var(--glass-border);padding:.7rem 1.2rem;flex-shrink:0;gap:1rem}
.player-title-wrap{display:flex;align-items:center;gap:12px;min-width:0}
.player-live-tag{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:.58rem;font-weight:800;letter-spacing:.1em;padding:4px 10px;border-radius:5px;flex-shrink:0;box-shadow:0 0 16px rgba(245,158,11,.4)}
#playerTitle{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#playerSub{font-size:.72rem;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-actions{display:flex;gap:8px;flex-shrink:0}
.p-btn{background:rgba(255,255,255,.04);border:1px solid var(--glass-border);color:var(--text-muted);padding:8px 14px;border-radius:11px;cursor:pointer;font-size:.76rem;font-weight:600;transition:all .25s;display:flex;align-items:center;gap:6px}
.p-btn svg{width:13px;height:13px;fill:currentColor}
.p-btn:hover{background:rgba(245,158,11,.12);color:#fff;border-color:rgba(245,158,11,.35)}
.p-btn.on{color:var(--primary);border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.12)}
#player{flex:1;width:100%;height:100%}
#embedWrap{display:none;flex:1;position:relative;background:#000}
#embedWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
#playerStatus{position:absolute;top:70px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:5;display:flex;align-items:center;gap:10px;background:rgba(5,5,5,.88);border:1px solid rgba(245,158,11,.35);border-radius:14px;padding:10px 16px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:92%}
#playerStatus.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#playerStatus .ps-spin{width:16px;height:16px;border:2px solid rgba(245,158,11,.2);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
#playerStatusCheck{padding:7px 14px;border-radius:10px;border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.1);color:var(--primary);font-weight:700;font-size:.75rem;cursor:pointer;flex-shrink:0}
#playerStatusAlt{padding:7px 14px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-weight:700;font-size:.75rem;cursor:pointer;flex-shrink:0}

#upnextPanel{position:absolute;top:0;right:0;bottom:0;width:340px;max-width:85%;background:rgba(8,8,10,.97);border-left:1px solid var(--glass-border);z-index:6;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}

.upnext-head{padding:14px 16px;border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.upnext-head span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.95rem}
.upnext-close{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:4px 8px;border-radius:8px}
.upnext-close:hover{background:rgba(245,158,11,.15);color:#fff}
.upnext-list{flex:1;overflow-y:auto;padding:8px}
.up-item{display:flex;gap:10px;padding:8px;border-radius:12px;cursor:pointer;transition:background .2s}
.up-item:hover{background:rgba(245,158,11,.08)}
.up-item img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex-shrink:0;background:#111}
.up-item .t{font-size:.8rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.up-item .c{font-size:.72rem;color:var(--text-muted);margin-top:3px}
.up-empty{padding:2rem 1rem;text-align:center;color:#64748b;font-size:.82rem}
#wDiag{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);padding:20px;overflow-y:auto}
.wdiag-card{background:#0d0d10;border:1px solid rgba(245,158,11,.3);border-radius:18px;padding:22px 24px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.wdiag-card h3{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;margin-bottom:8px}
.wdiag-row{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:.85rem;border-bottom:1px solid rgba(255,255,255,.06)}
.wdiag-dot{width:9px;height:9px;border-radius:50%;background:#475569;flex-shrink:0}
.wdiag-dot.ok{background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.6)}
.wdiag-dot.bad{background:#ef4444}

.toast.ok{border-color:rgba(16,185,129,.3)}.toast.bad{border-color:rgba(239,68,68,.3)}

.fab-backdrop.open{opacity:1;pointer-events:all}
.fab-container{position:fixed;bottom:24px;left:24px;z-index:100;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.fab-btn{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--secondary));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;box-shadow:0 8px 32px rgba(245,158,11,.4);transition:all .4s cubic-bezier(.34,1.56,.64,1);z-index:102}
.fab-btn:hover{transform:scale(1.08)}
.fab-btn .line{display:block;width:22px;height:2.5px;background:#fff;border-radius:2px;transition:all .35s}
.fab-btn.open .line:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.fab-btn.open .line:nth-child(2){opacity:0;transform:scaleX(0)}
.fab-btn.open .line:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.fab-menu{position:absolute;bottom:70px;left:0;display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(20px) scale(.8);transform-origin:bottom left;pointer-events:none;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.fab-menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:all}
.fab-item{display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(5,5,5,.85);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:16px;color:var(--text);text-decoration:none;font-weight:500;font-size:.95rem;white-space:nowrap;opacity:0;transform:translateX(-30px);transition:all .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.fab-menu.open .fab-item{opacity:1;transform:translateX(0)}
.fab-menu.open .fab-item:nth-child(1){transition-delay:.04s}
.fab-menu.open .fab-item:nth-child(2){transition-delay:.08s}
.fab-menu.open .fab-item:nth-child(3){transition-delay:.12s}
.fab-menu.open .fab-item:nth-child(4){transition-delay:.16s}
.fab-menu.open .fab-item:nth-child(5){transition-delay:.2s}
.fab-menu.open .fab-item:nth-child(6){transition-delay:.24s}
.fab-menu.open .fab-item:nth-child(7){transition-delay:.28s}
.fab-menu.open .fab-item:nth-child(8){transition-delay:.32s}
.fab-menu.open .fab-item:nth-child(9){transition-delay:.36s}
.fab-item:hover{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.3);transform:translateX(6px)}
.fab-item svg{width:20px;height:20px;fill:var(--primary);flex-shrink:0}
#musicDock{position:fixed;left:0;right:0;bottom:0;width:100%;height:var(--player-h);border:none;z-index:10001;display:none;background:#080808}
body.dock-open{padding-bottom:calc(var(--player-h) + 12px)}
body.dock-open .fab-container{bottom:calc(var(--player-h) + 20px)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg-deep)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--primary),var(--secondary));border-radius:4px}
@media(max-width:900px){.nav-title{display:none}#main{padding:1.4rem 1rem 3rem}.v-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem}}
@media(max-width:600px){.panic-btn span,.music-toggle span{display:none}.panic-btn,.music-toggle{padding:10px}#playerSub{display:none}.p-btn span{display:none}.p-btn{padding:8px 10px}#upnextPanel{width:100%;max-width:100%}.v-title{font-size:.84rem}}
</style>
</head>

<script>
window.addEventListener('error',function(e){try{
  if(!e.message||e.message==='Script error.')return;
  var b=document.getElementById('fatalBanner');
  if(!b){b=document.createElement('div');b.id='fatalBanner';
    b.style.cssText='position:fixed;bottom:12px;left:12px;right:12px;z-index:99999;background:#7f1d1d;color:#fff;font:600 12px/1.5 system-ui,sans-serif;padding:10px 14px;border-radius:12px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.6)';
    document.body.appendChild(b);setTimeout(function(){b.remove()},15000);}
  b.textContent='Page error — screenshot this: '+e.message+(e.lineno?' (line '+e.lineno+')':'');

if(currentId&&r&&r.length)buildUpnext(r.filter(function(v){return v.id!==currentId}).slice(0,20))}
catch(e){var el=$('upnextList');if(el)el.innerHTML='<div class="up-empty">No suggestions available</div>'}}
function toggleUpnext(){$('upnextPanel').classList.toggle('open');$('btnUpNext').classList.toggle('on')}
function closePlayer(){destroyArt();hideStatus();hideWDiag();$('embedFrame').src='about:blank';
 $('playerModal').classList.remove('open');document.body.classList.remove('player-open')}

/* ================= DIAGNOSTIC ================= */
function hideWDiag(){var p=$('wDiag');if(p)p.style.display='none'}
function diagRowHtml(id,name){return '<div class="wdiag-row"><span class="wdiag-dot" id="d_'+id+'"></span><span style="flex:1">'+name+'</span><span class="wdiag-res" id="dt_'+id+'"></span></div>'}
function setDiag(id,st,txt){var d=$('d_'+id);if(d)d.className='wdiag-dot '+st;var t=$('dt_'+id);if(t)t.textContent=txt}
function testInstances(base,path){return new Promise(function(res){var t=setTimeout(function(){res(null)},7000);
fetchJson(base+path,6500).then(function(){clearTimeout(t);res(base)},function(){clearTimeout(t);res(null)})})}
async function runWDiag(){var panel=$('wDiag');if(!panel)return;panel.style.display='flex';
var rows=diagRowHtml('engine','Video engine (hls.js + ArtPlayer)')+diagRowHtml('selftest','Player self-test');
if(WORKER_URL)rows+=diagRowHtml('worker','Your proxy ('+WORKER_URL.replace('https://','').slice(0,22)+'…)');
rows+=diagRowHtml('yt','YouTube direct (googleapis → googlevideo)')+diagRowHtml('piped','Piped backup')+diagRowHtml('invid','Invidious backup')+diagRowHtml('proxy','Video data test (real video)')+'<p id="wDiagEnd"></p>';
 $('wDiagBody').innerHTML=rows;
var eng=window.fateEngine||{};
setDiag('engine',eng.hls&&eng.art?'ok':'bad',(eng.hls&&eng.art)?'loaded ✓':'missing ✗');
setDiag('selftest','run','testing…');var st=await engineSelfTest();
setDiag('selftest',st.ok?'ok':'bad',st.ok?'player starts ✓':st.err);
if(WORKER_URL){setDiag('worker','run','testing…');
try{await fetchJson(WORKER_URL.replace(/\/+$/,'')+'/trending',8000);setDiag('worker','ok','online ✓')}
catch(e){setDiag('worker','bad','unreachable')}}
setDiag('yt','run','testing search…');var ytSearchOK=false,ytPlayOK=false;
try{await itSearch('music');ytSearchOK=true}catch(e){}
setDiag('yt',ytSearchOK?'run':'bad',ytSearchOK?'search ✓ — testing video…':'search blocked');
if(ytSearchOK){try{var td=await itPlayer('dQw4w9WgXcQ');
if(td.candidates.length&&await testReachable(td.candidates[0].url,6000))ytPlayOK=true}catch(e){}}
setDiag('yt',(ytSearchOK&&ytPlayOK)?'ok':(ytSearchOK?'bad':'bad'),ytSearchOK?(ytPlayOK?'works ✓ — no server needed':'search ✓ · video CDN blocked'):'blocked');
setDiag('piped','run','testing…');setDiag('invid','run','testing…');
var pt=await Promise.all([testInstances(pipedOK||PIPED[0],'/search?q=music&filter=videos'),testInstances(PIPED[1],'/search?q=music&filter=videos')]);
var pOK=pt.find(function(x){return x});setDiag('piped',pOK?'ok':'bad',pOK?'working ✓':'blocked/down');
var it=await Promise.all([testInstances(invidOK||INVID[0],'/api/v1/search?q=music'),testInstances(INVID[1],'/api/v1/search?q=music')]);
var iOK=it.find(function(x){return x});setDiag('invid',iOK?'ok':'bad',iOK?'working ✓':'blocked/down');
setDiag('proxy','run','testing…');var dataOK=false,via='';
if(WORKER_URL){try{var wd=await workerPlayer('dQw4w9WgXcQ');if(wd.candidates.length&&await testReachable(wd.candidates[0].url,6000)){dataOK=true;via='worker'}}catch(e){}}
if(!dataOK&&ytPlayOK){dataOK=true;via='youtube-direct'}
if(!dataOK&&(pOK||iOK)){try{var dd=await buildVideoData('dQw4w9WgXcQ');if(dd.candidates.length&&await testReachable(dd.candidates[0].url,6000)){dataOK=true;via=pOK?'piped':'invidious'}}catch(e){}}
setDiag('proxy',dataOK?'ok':'bad',dataOK?('video flows via '+via):'no video data anywhere');
var end=$('wDiagEnd');
if(!eng.hls||!eng.art)end.innerHTML='Player libraries missing — check <b>js/hls.min.js</b> + <b>js/artplayer.js</b> next to this page.';
else if(dataOK)end.innerHTML='Videos can play here via <b>'+via+'</b>'+(via==='youtube-direct'?' — zero server needed, this is the best case.':'.'+(via==='worker'?' Bulletproof mode.':''));
else if(ytSearchOK)end.innerHTML='The YouTube API answers but <b>googlevideo.com</b> (the video servers) is blocked here. Only a proxy on an unblocked domain can fix that.';
else end.innerHTML='Everything is blocked on this network. Working routes: a proxy on an unblocked domain, or embed mode as a last resort.'}

/* ================= KEYBOARD ================= */
document.addEventListener('keydown',function(e){
try{var pk=localStorage.getItem(LS.PANIC);if(pk&&pk.length===1&&e.key.toLowerCase()===pk.toLowerCase())return triggerPanic()}catch(err){}
var tag=(e.target.tagName||'').toUpperCase();
if(tag==='INPUT'||tag==='TEXTAREA'||e.target.isContentEditable){if(e.key==='Escape')e.target.blur();return}
if(e.key==='Escape'){if($('wDiag').style.display==='flex')hideWDiag();else if($('playerModal').classList.contains('open'))closePlayer()}
else if(e.key==='/'){e.preventDefault();$('globalSearch').focus()}});

/* ================= INIT ================= */
document.addEventListener('DOMContentLoaded',function(){
loadHist();loadSharedSettings();initParticles();initMouseGlow();updateEngineDot();renderRecent();
if(localStorage.getItem('fate_v5_music_dock')==='true')toggleMusicDock(true);
showTrending();
var m=/[?&]v=([\w-]{6,})/.exec(location.search);
if(m)setTimeout(function(){openVideo(m[1])},400)});
</script>
