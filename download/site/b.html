<script>
/* ===== V6 ACCESS GATE (same auth as the portal — opens straight through if you're logged in) ===== */
(function(){
  var AUTH_KEY='fate_v6_auth';
  function passes(){
    if(typeof FATE_PASS==='undefined')return['fate2026'];
    return Array.isArray(FATE_PASS)?FATE_PASS.map(String):[String(FATE_PASS)];
  }
  function hash(s){
    var h=5381;
    for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;
    return h.toString(36);
  }
  function isAuthed(){
    try{
      var v=localStorage.getItem(AUTH_KEY);
      return !!v&&passes().map(hash).indexOf(v)>-1;
    }catch(e){return false}
  }
  if(!isAuthed()){
    location.replace('index.html');
  }
})();
</script>

<script>
/* ===== FATE BROWSER — gn-math engine core, FATE chrome =====
   The engine (gn-math.html) is the same self-contained wisp browser that powers
   the Apps page: it races 80+ public relays, picks the fastest, fails over
   automatically and mediates the whole page — no service worker, no /e/ prefix,
   nothing extra to host. This shell drives it through deep links:
       gn-math.html#open=<encodeURIComponent(url)>
   and mirrors state back by watching the engine's location.hash. */
console.log('%c[FATE BROWSER] gn-math core loaded — no service worker involved', 'color:#f59e0b;font-weight:bold;');

const $ = id => document.getElementById(id);
const ENGINE_URL = 'gn-math.html';
const RELAY_CACHE_KEY = 'gn.singlefile.wisp.cache.v1';

function _lsGet(k){ try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; } }
function _lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function engineSrc(u){ return ENGINE_URL + '#open=' + encodeURIComponent(u); }
function hostOf(u){
  try { return new URL(/^https?:/.test(u) ? u : 'https://' + u).host.replace(/^www\./, ''); }
  catch(e){ return String(u); }
}
function laneHost(s){ try { return new URL(s).host.replace(/^www\./, ''); } catch(e){ return s; } }
function hueOf(s){ let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 360; }
function parseInput(q){
  q = (q || '').trim();
  if (!q) return null;
  if (/^https?:\/\//i.test(q)) return q;
  if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/i.test(q)) return 'https://' + q;
  return 'https://www.google.com/search?q=' + encodeURIComponent(q);
}
function recordHistory(url){
  try {
    let h = _lsGet('fate_browser_history') || [];
    h = h.filter(x => x.u !== url);
    h.unshift({ u: url, t: Date.now() });
    _lsSet('fate_browser_history', h.slice(0, 24));
  } catch(e){}
}
/* the engine's floating pill (home/back/reload) lives outside <body> with
   inline !important styles — a stylesheet rule can't beat it, so this chrome
   overrides the inline style itself on every mirror pass */
const HIDE_PILL_STYLE_ID = 'fate-hide-pill';
function hideEnginePill(doc){
  try {
    if (!doc || !doc.head || doc.getElementById(HIDE_PILL_STYLE_ID)) return;
    const st = doc.createElement('style');
    st.id = HIDE_PILL_STYLE_ID;
    st.textContent = '[data-gn-portable-toolbar]{display:none!important;visibility:hidden!important;pointer-events:none!important}';
    doc.head.appendChild(st);
  } catch(e){}
  try {
    const pill = doc.querySelector('[data-gn-portable-toolbar]');
    if (pill && pill.style.display !== 'none'){
      pill.style.setProperty('display', 'none', 'important');
      pill.style.setProperty('visibility', 'hidden', 'important');
      pill.style.setProperty('pointer-events', 'none', 'important');
    }
  } catch(e){}
}

function tileHtml(){
  return TILES.map(t =>
    '<div class="fb-tile" data-go="' + t.url + '">' +
      '<span class="ic" style="color:' + t.color + '">' +
        (t.path ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="' + t.path + '"/></svg>' : '<span>' + t.label[0] + '</span>') +
      '</span><span class="lbl">' + t.label + '</span></div>'
  ).join('');
}
const PANE_HTML =
  '<div class="fb-progress"></div>' +
  '<iframe class="fb-frame" allow="fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe>' +
  '<div class="fb-start"><div class="fb-start-scroll">' +
    '<div class="fb-brandrow"><div class="fb-logo">F</div><div><h1>FATE Browser</h1><p>the whole web over wisp — same engine as Apps, no jet, no service worker</p></div></div>' +
    '<div class="fb-srow"><input class="fb-search" placeholder="Search Google or type a URL" spellcheck="false" autocomplete="off" /><button class="fb-go" data-act="go">Go</button></div>' +
    '<div class="fb-lanecard"><div><b class="lc-title"><svg viewBox="0 0 24 24"><path d="M12 2C8.7 2 6 4.7 6 8c0 4.4 6 14 6 14s6-9.6 6-14c0-3.3-2.7-6-6-6zm0 8.5A2.5 2.5 0 1 1 12 5.5a2.5 2.5 0 0 1 0 5z"/></svg> wisp engine</b><span class="lc-line js-lane-line">checking the cached relay\u2026</span></div>' +
    '<div class="lc-actions"><button class="lc-btn" data-act="engine">Open engine</button><a class="lc-btn ghost" href="wisp-scanner.html">Scanner</a></div></div>' +

    '<div class="fb-recent"><h3>Recently visited</h3><div class="fb-recent-row js-recents"></div></div>' +
    '<div class="fb-note">pages load through the built-in gn-math engine \u2014 the exact same tunnel the Apps page uses. it races 80+ public wisp relays on every visit, keeps the fastest one for 24h and fails over mid-session if a relay dies. nothing to configure, nothing extra to host.</div>' +

let TABS = [], ACTIVE = null, TAB_SEQ = 0;

function newTab(url){
  TABS.forEach(t => t.pane.classList.remove('active'));
  const pane = document.createElement('div');
  pane.className = 'fb-pane active at-home';
  pane.innerHTML = PANE_HTML;
  $('fbPanes').appendChild(pane);
  const tab = {
    id: ++TAB_SEQ, pane, url: null, title: 'New tab', atHome: true,
    loading: false, closed: false, frame: pane.querySelector('.fb-frame'),
    pendingNav: null, backStack: [], fwdStack: [], watch: null
  };
  wireStart(pane, tab);
  paintRecents(pane);
  TABS.push(tab);
  ACTIVE = tab;
  updateChrome();
  if (url) navigate(tab, url);
  return tab;
}
function wireStart(pane, tab){
  pane.querySelector('.fb-search').addEventListener('keydown', e => {
    if (e.key === 'Enter') navigate(tab, e.target.value);
  });
  pane.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (go){ navigate(tab, go.getAttribute('data-go')); return; }
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const a = act.getAttribute('data-act');
    if (a === 'go') navigate(tab, pane.querySelector('.fb-search').value);
    if (a === 'engine') window.open(ENGINE_URL, '_blank');
    if (a === 'retry' && tab.url) navigate(tab, tab.url);
  });
}
function paintRecents(pane){
  const row = pane.querySelector('.js-recents');
  let h = [];
  try { h = _lsGet('fate_browser_history') || []; } catch(e){}
  const recent = h.slice(0, 8);
  if (!recent.length){
    const s = document.createElement('span');
    s.style.cssText = 'font-size:.72rem;color:#64748b';
    s.textContent = 'nothing yet \u2014 pages you open land here';
    row.appendChild(s);
    return;
  }
  recent.forEach(x => {
    const b = document.createElement('button');
    b.className = 'fb-recent-chip';
    b.setAttribute('data-go', x.u);
    b.innerHTML = '<span class="dot"></span><span></span>';
    b.lastChild.textContent = hostOf(x.u);
    row.appendChild(b);
  });
}
function activate(tab){
  if (!tab || tab.closed) return;
  ACTIVE = tab;
  TABS.forEach(t => t.pane.classList.toggle('active', t === tab));
  updateChrome();
}
function closeTab(tab){
  if (!tab || tab.closed) return;
  tab.closed = true;
  clearTimeout(tab.watch);
  const i = TABS.indexOf(tab);
  TABS.splice(i, 1);
  tab.pane.remove();
  if (!TABS.length){ newTab(); return; }
  if (ACTIVE === tab) activate(TABS[Math.max(0, i - 1)]);
  updateChrome();
}

/* ---------- navigation (deep-link boots of the engine) ---------- */
function bootEngine(tab, url){
  /* a fresh iframe node every time: re-pointing src at the same file with a
     different hash would be a same-document navigation and the engine only
     reads #open= when it boots */
  const f = document.createElement('iframe');
  f.className = 'fb-frame';
  f.setAttribute('allow', 'fullscreen; clipboard-read; clipboard-write');
  f.setAttribute('allowfullscreen', '');
  f.src = engineSrc(url);
  tab.frame.replaceWith(f);
  tab.frame = f;
}
function navigate(tab, input, opts){
  if (!tab || tab.closed) return;
  const url = parseInput(input);
  if (!url){ toast('type a URL or search first'); return; }
  const wasBrowsing = !tab.atHome && tab.url;
  if (wasBrowsing) tab.backStack.push(tab.url);
  tab.fwdStack = [];
  tab.url = url;
  tab.pendingNav = url;
  tab.atHome = false;
  tab.title = hostOf(url);
  tab.pane.classList.remove('at-home');
  tab.pane.classList.add('connecting', 'loading');
  tab.pane.classList.remove('err');
  setPaneStage(tab, 'loading ' + hostOf(url) + '\u2026', 'booting the wisp engine \u2014 it picks the fastest live relay and opens the page through it');
  recordHistory(url);
  updateChrome();
  bootEngine(tab, url);
  clearTimeout(tab.watch);
  tab.watch = setTimeout(() => {
    if (tab.closed || !tab.pendingNav) return;
    setPaneStage(tab, 'error', hostOf(url) + ' never answered',
      'the engine could not reach the site through any relay \u2014 check the wisp scanner, or open the engine directly to see its own diagnostics');
  }, 45000);
}
function arrived(tab, realUrl){
  tab.pendingNav = null;
  clearTimeout(tab.watch);
  tab.pane.classList.remove('connecting');
  if (realUrl) tab.url = realUrl;
  updateChrome();
}
function goBack(tab){
  if (!tab || tab.closed || !tab.backStack.length) return;
  if (tab.url) tab.fwdStack.push(tab.url);
  const url = tab.backStack.pop();
  drive(tab, url, 'going back to ' + hostOf(url) + '\u2026');
}
function goForward(tab){
  if (!tab || tab.closed || !tab.fwdStack.length) return;
  if (tab.url) tab.backStack.push(tab.url);
  const url = tab.fwdStack.pop();
  drive(tab, url, 'forward to ' + hostOf(url) + '\u2026');
}
function reloadTab(tab){
  if (!tab || tab.closed) return;
  if (tab.atHome || !tab.url){ toast('on the start page \u2014 nothing to reload'); return; }
  drive(tab, tab.url, 'reloading ' + hostOf(tab.url) + '\u2026');
}
function drive(tab, url, note){
  tab.pendingNav = url;
  tab.atHome = false;
  tab.pane.classList.remove('at-home', 'err');
  tab.pane.classList.add('connecting', 'loading');
  setPaneStage(tab, note || ('loading ' + hostOf(url) + '\u2026'), 'booting the wisp engine\u2026');
  updateChrome();
  bootEngine(tab, url);
  clearTimeout(tab.watch);
  tab.watch = setTimeout(() => {
    if (tab.closed || !tab.pendingNav) return;
    setPaneStage(tab, 'error', hostOf(url) + ' never answered',
      'the engine could not reach the site through any relay \u2014 try again, or open the engine directly');
  }, 45000);
}
function goHome(tab){
  if (!tab || tab.closed) return;
  tab.atHome = true;
  tab.pendingNav = null;
  clearTimeout(tab.watch);
  tab.pane.classList.add('at-home');
  tab.pane.classList.remove('connecting', 'loading', 'err');
  try { tab.frame.src = 'about:blank'; } catch(e){}
  updateChrome();
}
function setPaneStage(tab, msg, note){
  tab.pane.querySelector('.js-stage').textContent = msg || '';
  tab.pane.querySelector('.js-stagenote').textContent = note || '';
}

/* ---------- engine state mirror ---------- */
function mirrorTab(tab){
  if (tab.closed || tab.atHome) return;
  let w, d, h;
  try {
    w = tab.frame.contentWindow;
    d = w.document;
    h = w.location.hash || '';
  } catch(e){ return; }
  if (!d || !d.body) return;
  hideEnginePill(d);
  const engineHome = !!d.getElementById('openurl');   /* engine's own start view */
  let real = null;
  if (/^#open=/.test(h)){
    try { real = decodeURIComponent(h.slice(6)); } catch(e){ real = null; }
  }
  if (tab.pendingNav){
    /* boot in progress: the engine lands on its start view first, then takes
       the deep link — first #open= hash with its home view gone means arrived */
    if (real && !engineHome) arrived(tab, real);
  } else if (real && tab.url && real !== tab.url && !engineHome){
    /* in-page navigation (a link clicked inside the proxied page) */
    tab.backStack.push(tab.url);
    tab.fwdStack = [];
    tab.url = real;
    tab.title = (d.title || hostOf(real)).slice(0, 80);
    recordHistory(real);
    updateChrome();
  } else if (real && real === tab.url && !engineHome){
    const t = d.title;
    if (t && t !== tab.title){ tab.title = String(t).slice(0, 80); updateChrome(); }
  }
}

/* ---------- chrome painting ---------- */
function paintTabs(){
  const el = $('fbTabs');
  el.innerHTML = '';
  TABS.forEach(t => {
    const d = document.createElement('div');
    d.className = 'fb-tab' + (t === ACTIVE ? ' active' : '');
    const h = hueOf(t.atHome ? 'fate-home' : hostOf(t.url || 'fate'));
    const ic = t.pendingNav || t.loading
      ? '<span class="fb-tab-ic loading"></span>'
      : '<span class="fb-tab-ic" style="background:hsla(' + h + ',45%,16%,.95);color:hsl(' + h + ',85%,70%)">' + (t.atHome ? 'F' : (hostOf(t.url || 'F')[0] || 'F').toUpperCase()) + '</span>';
    d.innerHTML = ic + '<span class="fb-tab-title"></span><span class="fb-tab-x" title="Close tab">\u00d7</span>';
    d.querySelector('.fb-tab-title').textContent = t.atHome ? 'New tab' : (t.title || hostOf(t.url || ''));
    d.addEventListener('click', () => activate(t));
    d.addEventListener('auxclick', e => { if (e.button === 1) closeTab(t); });
    d.querySelector('.fb-tab-x').addEventListener('click', e => { e.stopPropagation(); closeTab(t); });
    el.appendChild(d);
  });
  const act = el.querySelector('.fb-tab.active');
  if (act && act.scrollIntoView) try { act.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch(e){}
}
function updateChrome(){
  paintTabs();
  const t = ACTIVE;
  const off = !t || t.atHome || !t.url;
  $('fbBackBtn').disabled = off || !t.backStack.length;
  $('fbFwdBtn').disabled = off || !t.fwdStack.length;
  $('fbRelBtn').disabled = off;
  $('fbPopBtn').disabled = off;
  const a = $('fbAddr');
  if (document.activeElement !== a) a.value = off ? '' : (t.url || '');
  document.title = t && !t.atHome && t.title ? (t.title + ' \u00b7 FATE Browser') : 'FATE Browser';
}
/* relay chip — mirrors the engine's own 24h relay cache (same origin) */
function paintChip(){
  const chip = $('fateLaneChip'), host = $('fateLaneHost');
  const c = _lsGet(RELAY_CACHE_KEY);
  const fresh = c && c.url && c.storedAt && (Date.now() - c.storedAt < 24 * 3600 * 1000);
  const booting = TABS.some(t => t.pendingNav);
  chip.classList.remove('s-load', 's-ok', 's-fail');
  if (booting){ chip.classList.add('s-load'); host.textContent = 'wisp \u25b8 engine booting\u2026'; }
  else if (fresh){ chip.classList.add('s-ok'); host.textContent = 'wisp \u25b8 ' + laneHost(c.url) + ' \u00b7 cached ' + Math.max(1, Math.round((Date.now() - c.storedAt) / 60000)) + 'm'; }
  else if (c && c.url){ chip.classList.add('s-fail'); host.textContent = 'wisp \u25b8 relay stale \u2014 engine will re-race'; }
  else { chip.classList.add('s-fail'); host.textContent = 'wisp \u25b8 no relay yet \u2014 open a page'; }
}
let toastT = null;
function toast(msg){
  const el = $('fbToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ---------- toolbar wiring ---------- */
$('fbNewTabBtn').addEventListener('click', () => newTab());
$('fbBackBtn').addEventListener('click', () => goBack(ACTIVE));
$('fbFwdBtn').addEventListener('click', () => goForward(ACTIVE));
$('fbRelBtn').addEventListener('click', () => reloadTab(ACTIVE));
$('fbHomeBtn').addEventListener('click', () => goHome(ACTIVE));
$('fbGoBtn').addEventListener('click', () => { const a = $('fbAddr'); navigate(ACTIVE, a.value); a.blur(); });
$('fbAddr').addEventListener('keydown', e => { if (e.key === 'Enter'){ navigate(ACTIVE, e.target.value); e.target.blur(); } });
$('fbPopBtn').addEventListener('click', () => {
  const t = ACTIVE;
  if (!t || t.atHome || !t.url) return toast('nothing to pop out \u2014 load a page first');
  window.open(engineSrc(t.url), '_blank');
  toast('opened the standalone engine');
});
$('fateLaneChip').addEventListener('click', () => { window.open('wisp-scanner.html', '_blank'); });

/* ---------- init ---------- */
newTab();
paintChip();
setInterval(() => {
  TABS.forEach(mirrorTab);
  paintChip();
}, 550);
</script>
