<script>
/* ===== V6 ACCESS GATE (same auth as the portal — opens straight through if you're logged in) ===== */
(function(){
  var AUTH_KEY='fate_v6_auth';
  function passes(){
    if(typeof FATE_PASS==='undefined')return['fate2026'];
    return Array.isArray(FATE_PASS)?FATE_PASS.map(String):[String(FATE_PASS)];
  }
  function hash(s){
    var h=5381;
    for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;
    return h.toString(36);
  }
  function isAuthed(){
    try{
      var v=localStorage.getItem(AUTH_KEY);
      return !!v&&passes().map(hash).indexOf(v)>-1;
    }catch(e){return false}
  }
  if(!isAuthed()){
    location.replace('index.html');
  }
})();
</script>

<style>

html{scroll-behavior:smooth}
body{background:var(--bg-deep);color:var(--text);font-family:"Inter",sans-serif;min-height:100vh;overflow-x:hidden;padding-top:calc(60px + env(safe-area-inset-top,0px));-webkit-tap-highlight-color:transparent}
.bg-image{position:fixed;inset:0;z-index:0;background:url("/img/background.png") center center/cover no-repeat}

.nav-links{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.nav-link{padding:8px 14px;border-radius:11px;font-weight:500;color:var(--text-muted);text-decoration:none;display:flex;align-items:center;gap:7px;transition:all .3s cubic-bezier(.4,0,.2,1);background:none;border:none;cursor:pointer;font-family:inherit;font-size:.82rem;white-space:nowrap}

.fm-chip{padding:7px 12px;border-radius:11px;font-size:.68rem;font-weight:700;border:1px solid rgba(148,163,184,.25);white-space:nowrap;background:rgba(0,0,0,0.4);color:#94a3b8}

/* ---- hero ---- */
.main{position:relative;z-index:4;max-width:1200px;margin:0 auto;padding:26px 20px 60px}
.page-header{text-align:center;margin-bottom:1.4rem}
.page-header h1{font-family:"Space Grotesk",sans-serif;font-size:clamp(2rem,7vw,3.2rem);font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#fff 0%,#fcd34d 50%,#f59e0b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.tb-chip{padding:9px 16px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);color:var(--text-muted);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .25s ease;font-family:inherit;display:flex;align-items:center;gap:7px}

</style>

<script>
/* ===== FATE ARCADE SHARED HELPERS ===== */
function _lsGet(k){ try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; } }
function _lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ===== FATE ARCADE CDN ENGINE v2 — straight browser→CDN, zero proxy, zero tunnel ===== */
console.log('%c[FATE ARCADE] direct CDN engine v2 loaded (no proxy, no jet)', 'color:#4ade80;font-weight:bold;');

/* jsDelivr edges to rotate through (same trick the big sites use) */
const FATE_CDN_MIRRORS = ['cdn.jsdelivr.net', 'fastly.jsdelivr.net', 'gcore.jsdelivr.net', 'testingcf.jsdelivr.net', 'quantil.jsdelivr.net'];

/* hosts that serve game HTML as text/plain (would show raw code in an iframe)
   -> always fetch the code and render it locally as a blob */
const FATE_FETCH_HOSTS = [
  /(^|\.)cdn\.jsdelivr\.net$/i, /(^|\.)fastly\.jsdelivr\.net$/i, /(^|\.)gcore\.jsdelivr\.net$/i,
  /(^|\.)testingcf\.jsdelivr\.net$/i, /(^|\.)quantil\.jsdelivr\.net$/i, /(^|\.)originfastly\.jsdelivr\.net$/i,
  /(^|\.)raw\.githubusercontent\.com$/i, /(^|\.)rawcdn\.githack\.com$/i, /(^|\.)raw\.githack\.com$/i,
  /(^|\.)cdn\.statically\.io$/i, /(^|\.)uploads\.ungrounded\.net$/i
];
/* hosts probed to refuse embedding AND cross-origin reads — code fetch is the only chance */
const FATE_NO_EMBED = [
  /(^|\.)8ballpool\.com$/i, /(^|\.)humanornot\.so$/i, /(^|\.)now\.gg$/i, /(^|\.)totaljerkface\.com$/i,
  /(^|\.)coolmathgames\.com$/i, /(^|\.)mathplayground\.com$/i, /(^|\.)silvergames\.com$/i, /(^|\.)itch\.io$/i
];

const fateHost = u => { try { return new URL(u).hostname; } catch (e) { return ''; } };
const fateNeedsFetch = u => FATE_FETCH_HOSTS.some(rx => rx.test(fateHost(u))) || FATE_NO_EMBED.some(rx => rx.test(fateHost(u)));

/* expand one game URL into every CDN route we can try */
function fateMirrors(u){
  const list = [];
  try {
    const url = new URL(u);
    let m = url.href.match(/^https:\/\/cdn\.jsdelivr\.net\/gh\/([^/]+)\/([^/@]+)@([^/]+)\/(.+)$/);
    if (m){
      const [, user, repo, ref, path] = m;
      for (const host of FATE_CDN_MIRRORS) list.push('https://' + host + '/gh/' + user + '/' + repo + '@' + ref + '/' + path);
      list.push('https://raw.githubusercontent.com/' + user + '/' + repo + '/' + ref + '/' + path);
    } else if (url.hostname === 'raw.githubusercontent.com'){
      const seg = url.pathname.split('/').filter(Boolean);
      if (seg.length >= 4){
        const [user, repo, ref] = seg, path = seg.slice(3).join('/');
        for (const host of FATE_CDN_MIRRORS) list.push('https://' + host + '/gh/' + user + '/' + repo + '@' + ref + '/' + path);
      }
      list.push(url.href);
    } else list.push(url.href);
  } catch (e) { list.push(u); }
  return [...new Set(list)];
}

/* fetch one route, validate it looks like a game page */
function fateFetchOne(url, timeoutMs){
  return new Promise((resolve, reject) => {
    const ac = new AbortController();
    const to = setTimeout(() => ac.abort(), timeoutMs || 14000);
    fetch(url, { signal: ac.signal, redirect: 'follow' }).then(async r => {
      clearTimeout(to);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const t = await r.text();
      if (!/<html|<!doctype|<script|<canvas|<iframe/i.test(t)) throw new Error('not a game page');
      resolve({ text: t, url: r.url || url });
    }).catch(e => { clearTimeout(to); reject(e); });
  });
}
/* resolve when the first promise fulfills (Promise.any with a manual fallback) */
function fateRace(ps){
  return new Promise((resolve, reject) => {
    let pending = ps.length, done = false;
    if (!pending) return reject(new Error('no routes'));
    ps.forEach(p => p.then(v => { if (!done){ done = true; resolve(v); } })
      .catch(() => { if (--pending === 0 && !done){ done = true; reject(new Error('all routes failed')); } }));
  });
}

/* in-memory code cache: reopening a game is instant */
const FATE_GAME_CACHE = new Map();
async function fateRetrieve(u){
  if (FATE_GAME_CACHE.has(u)) return FATE_GAME_CACHE.get(u);
  const mirrors = fateMirrors(u);
  let got = null;
  try { got = await fateRace(mirrors.slice(0, 3).map(mi => fateFetchOne(mi, 14000))); }
  catch (e1) {
    for (const mi of mirrors.slice(3)){
      try { got = await fateFetchOne(mi, 14000); break; } catch (e2) {}
    }
  }
  if (!got) throw new Error('every CDN route failed (' + mirrors.length + ' tried)');
  FATE_GAME_CACHE.set(u, got);
  return got;
}

function fateWithBase(text, url){
  const doc = new DOMParser().parseFromString(text, 'text/html');
  if (!doc.querySelector('base')){
    const b = doc.createElement('base'); b.href = url;
    (doc.head || doc.documentElement).prepend(b);
  }
  return '<!doctype html>\n' + doc.documentElement.outerHTML;
}
async function fatePlayableHTML(g, onStage){
  let r = await fateRetrieve(g.url);
  if (onStage) onStage('code loaded — ' + Math.round(r.text.length / 1024) + ' KB, preparing…');
  if (g.source === 'Lumin'){
    /* peel single-iframe jsdelivr wrappers (up to 3 deep) */
    const visited = new Set([r.url]);
    for (let depth = 0; depth < 3; depth++){
      const doc = new DOMParser().parseFromString(r.text, 'text/html');
      const frames = doc.querySelectorAll('iframe[src]');
      if (frames.length !== 1 || doc.querySelector('canvas')) break;
      const raw = frames[0].getAttribute('src');
      const base = doc.querySelector('base[href]')?.getAttribute('href');
      const url = new URL(raw, base ? new URL(base, r.url).href : r.url).href;
      if (!/^https?:/.test(url) || !url.includes('jsdelivr.net/') || visited.has(url)) break;
      visited.add(url);
      if (onStage) onStage('unwrapping layer ' + (depth + 2) + '…');
      r = await fateRetrieve(url);
    }
  }
  return fateWithBase(r.text, r.url);
}

<script>
/* ===== FATE ARCADE ENGINE — 22.7k game vault, 100% jsDelivr (Storm0S fetch+blob technique, zero jet) ===== */
console.log('%c[FATE ARCADE] arcade engine loaded', 'color:#f59e0b;font-weight:bold;');

/* ---------- state ---------- */
const GX_FAVS_KEY = 'fate_gx_favs';
const GX_RECENT_KEY = 'fate_gx_recent';
let GAMES = [];                 /* all entries: {name,url,image,source,kind,fetchGame,frameFallback} */
let favorites = new Set(_lsGet(GX_FAVS_KEY) || []);
let recent = _lsGet(GX_RECENT_KEY) || []; /* most-recent-first keys */
let gxSource = 'All libraries';
let gxKind = 'all';
let gxView = 'all';
let gxSort = 'az';
let gxLimit = 80;
let gxAutoLoad = true;
let gxQuery = '';
const searchText = new WeakMap();
const nameCollator = new Intl.Collator();
const gxKey = g => g.source + '|' + g.url;
const FALLBACK_ICON = "data:image/svg+xml," + encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%2315131f'/><text x='32' y='41' font-family='Arial' font-size='26' font-weight='800' text-anchor='middle' fill='%23f59e0b' opacity='0.55'>F</text></svg>");

/* ---------- catalog decode (gzip+base64, same technique as Storm0S) ---------- */
async function fateDecodeCatalog(){
  const b64 = window.FATE_GAMES_B64;
  if (!b64 || !b64.length) throw new Error('catalog file fate-games-cat.js is missing next to games.html');
  if (typeof DecompressionStream === 'undefined') throw new Error('this browser is too old — update iOS/Safari (needs 16.4+)');
  const parts = [];
  for (let i = 0; i < b64.length; i += 65536){
    const s = atob(b64.slice(i, i + 65536));
    const u = new Uint8Array(s.length);
    for (let j = 0; j < s.length; j++) u[j] = s.charCodeAt(j);
    parts.push(u);
  }
  const blob = new Blob(parts);
  const out = await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  const arr = JSON.parse(new TextDecoder().decode(out));
  return arr.map(e => ({
    name: String(e.n || 'Untitled'),
    url: String(e.u || ''),
    image: e.i ? String(e.i) : '',
    source: String(e.s || 'Vault'),
    kind: e.k ? String(e.k) : 'arcade',
    fetchGame: e.f === 1 ? true : e.f === 0 ? false : undefined,
    frameFallback: e.F === 1
  })).filter(g => g.url);
}

/* ---------- play pipeline (fateRetrieve / fateWithBase / fatePlayableHTML) now lives in the CDN engine block above ---------- */

/* ---------- filtering / rendering ---------- */
function gxFilters(){
  const q = gxQuery.trim().toLowerCase();
  const recentOrder = new Map(recent.map((k, i) => [k, i]));
  const a = GAMES.filter(g => {
    let text = searchText.get(g);
    if (text === undefined){
      text = (g.name + ' ' + g.source + ' ' + g.kind).toLowerCase();
      searchText.set(g, text);
    }
    return (gxKind === 'all' || g.kind === gxKind)
      && (gxSource === 'All libraries' || g.source === gxSource)
      && (!q || text.includes(q))
      && (gxView !== 'favorites' || favorites.has(gxKey(g)))
      && (gxView !== 'recent' || recentOrder.has(gxKey(g)));
  });
  if (gxView === 'recent') a.sort((x, y) => recentOrder.get(gxKey(x)) - recentOrder.get(gxKey(y)));
  else if (gxSort === 'source') a.sort((x, y) => nameCollator.compare(x.source, y.source) || nameCollator.compare(x.name, y.name));
  else a.sort((x, y) => (gxSort === 'za' ? -1 : 1) * nameCollator.compare(x.name, y.name));
  return a;
}
let gxRendered = [], gxAppendPending = false;
function fateCard(g){
  const box = document.createElement('article');
  box.className = 'game-card';
  const b = document.createElement('button');
  b.className = 'launch';
  b.setAttribute('aria-label', 'Play ' + g.name + ' from ' + g.source);
  const art = document.createElement('div');
  art.className = 'img-wrap';
  const fb = document.createElement('div');
  fb.className = 'img-fallback';
  fb.textContent = g.name.slice(0, 2).toUpperCase();
  art.appendChild(fb);
  if (g.image){
    const im = document.createElement('img');
    im.className = 'game-img'; im.src = g.image; im.alt = '';
    im.loading = 'lazy'; im.decoding = 'async';
    im.onload = () => fb.remove();
    im.onerror = () => { im.remove(); };
    art.appendChild(im);
  }
  const badge = document.createElement('span');
  badge.className = 'src-badge'; badge.textContent = g.source;
  art.appendChild(badge);
  const ov = document.createElement('div');
  ov.className = 'play-overlay';
  const pb = document.createElement('div');
  pb.className = 'play-btn'; pb.textContent = '\u25b6';
  ov.appendChild(pb);
  art.appendChild(ov);
  const cap = document.createElement('div');
  cap.className = 'game-info';
  const title = document.createElement('div');
  title.className = 'game-name'; title.textContent = g.name; title.title = g.name;
  const src = document.createElement('div');
  src.className = 'game-src'; src.textContent = g.source + (g.kind !== 'arcade' ? ' \u00b7 ' + g.kind : '');
  cap.append(title, src);
  b.append(art, cap);
  b.onclick = () => fatePlay(g);
  const fav = document.createElement('button');
  fav.className = 'fav-btn' + (favorites.has(gxKey(g)) ? ' active' : '');
  fav.textContent = favorites.has(gxKey(g)) ? '\u2665' : '\u2661';
  fav.setAttribute('aria-label', (favorites.has(gxKey(g)) ? 'Unfavorite ' : 'Favorite ') + g.name);
  fav.onclick = ev => {
    ev.stopPropagation();
    const k = gxKey(g);
    if (favorites.has(k)) favorites.delete(k); else favorites.add(k);
    _lsSet(GX_FAVS_KEY, [...favorites]);
    renderGrid(true);
  };
  box.append(b, fav);
  return box;
}
function renderGrid(resetLimit){
  if (resetLimit) gxLimit = 80;
  const a = gxFilters();
  gxRendered = a;
  const count = document.getElementById('fateCount');
  const viewLabel = gxView === 'favorites' ? 'your favorites' : gxView === 'recent' ? 'recently played' : (gxSource === 'All libraries' ? 'all libraries' : gxSource);
  count.innerHTML = '<b>' + a.length.toLocaleString() + '</b> games \u00b7 ' + viewLabel + (gxQuery ? ' \u00b7 \u201c' + gxQuery.replace(/</g, '&lt;') + '\u201d' : '');
  const grid = document.getElementById('fateGrid');
  grid.replaceChildren(...a.slice(0, gxLimit).map(fateCard));
  const remaining = gxLimit < a.length;
  document.getElementById('fateMore').classList.toggle('hidden', !remaining);
  document.getElementById('fateMore').textContent = 'Load ' + Math.min(80, a.length - gxLimit).toLocaleString() + ' more';
  const empty = document.getElementById('fateEmpty');
  if (!a.length){
    empty.classList.remove('hidden');
    empty.innerHTML = gxView === 'favorites'
      ? '<b>No favorites yet</b>Tap the \u2661 on any game to keep it here.'
      : gxView === 'recent'
        ? '<b>Nothing here yet</b>Games you open will show up in this row.'
        : '<b>No matches</b>Try another search, library or kind.';
  } else empty.classList.add('hidden');
}
function appendGames(){
  if (gxAppendPending || gxLimit >= gxRendered.length) return;
  gxAppendPending = true;
  requestAnimationFrame(() => {
    const next = Math.min(gxLimit + 80, gxRendered.length);
    document.getElementById('fateGrid').append(...gxRendered.slice(gxLimit, next).map(fateCard));
    gxLimit = next;
    gxAppendPending = false;
    document.getElementById('fateMore').classList.toggle('hidden', gxLimit >= gxRendered.length);
  });
}
const scrollSentinel = document.createElement('div');
scrollSentinel.style.height = '1px';
function checkScrollLoad(){
  if (!gxAutoLoad || gxLimit >= gxRendered.length) return;
  const r = scrollSentinel.getBoundingClientRect();
  if (r.top < innerHeight + 600 && r.bottom >= 0) appendGames();
}

/* ---------- player ---------- */
let FATE_ACTIVE_BLOB = null, FATE_CURRENT = null, FATE_PLAY_SEQ = 0, FATE_HINT_TIMER = null;
const $id = id => document.getElementById(id);
function fateShowSpin(show, title, sub){
  const sp = $id('fatePSpin');
  sp.classList.toggle('hide', !show);
  if (title) $id('fatePSpinTitle').textContent = title;
  if (sub !== undefined) $id('fatePSpinSub').textContent = sub || '';
}
function fatePStatus(msg, kind){
  const st = $id('fatePStatus');
  st.textContent = msg;
  st.className = 'fp-status' + (kind ? ' ' + kind : '');
}
function fateShowErr(show, title, msg){
  const e = $id('fatePErr');
  e.classList.toggle('show', !!show);
  if (show){
    $id('fatePErrTitle').textContent = title || 'This game would not load';
    $id('fatePErrMsg').textContent = msg || '';
  }
}
function fateArmHint(seq){
  clearTimeout(FATE_HINT_TIMER);
  FATE_HINT_TIMER = setTimeout(() => {
    if (seq === FATE_PLAY_SEQ) fatePStatus('black screen? tap \u24e3 Code \u2014 loads the game over the CDN instead', '');
  }, 7000);
}
function fateRevokeBlob(){
  if (FATE_ACTIVE_BLOB){ try { URL.revokeObjectURL(FATE_ACTIVE_BLOB); } catch(e){} FATE_ACTIVE_BLOB = null; }
}
/* play a game: direct CDN embed, or fetch-the-code+blob for hosts that need it */
async function fatePlay(g, forceCode){
  const seq = ++FATE_PLAY_SEQ;
  FATE_CURRENT = g;
  fateShowErr(false);
  clearTimeout(FATE_HINT_TIMER);
  fateRevokeBlob();
  $id('fatePlayer').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  $id('fatePName').textContent = g.name;
  $id('fatePCode').disabled = false;
  fatePStatus('loading\u2026');
  const frame = $id('fateFrameDirect');
  frame.src = 'about:blank';
  const needCode = forceCode || fateNeedsFetch(g.url);
  if (needCode){
    /* fetch game code -> inject <base> -> local blob (fixes text/plain hosts + X-Frame-Options) */
    try {
      fateShowSpin(true, 'Loading ' + g.name + '\u2026', 'fetching game code from the fastest CDN mirror\u2026');
      const html = await fatePlayableHTML(g, s => { if (seq === FATE_PLAY_SEQ) fateShowSpin(true, 'Loading ' + g.name + '\u2026', s); });
      if (seq !== FATE_PLAY_SEQ) return;
      const blob = new Blob([html], { type: 'text/html' });
      fateRevokeBlob();
      FATE_ACTIVE_BLOB = URL.createObjectURL(blob);
      fateShowSpin(false);
      frame.src = FATE_ACTIVE_BLOB;
      fatePStatus('running on local code \u2014 straight from the CDN', 'ok');
      fateBumpRecent(g);
      return;
    } catch(err){
      if (seq !== FATE_PLAY_SEQ) return;
      /* host refuses embedding AND code download -> hard error; otherwise fall through to direct embed */
      if (FATE_NO_EMBED.some(rx => rx.test(fateHost(g.url))) && !g.frameFallback){
        fateShowSpin(false);
        fatePStatus('failed \u2014 ' + (err.message || err), 'err');
        fateShowErr(true, 'This game\u2019s host blocks everything', (err.message || err) + '. This library hosts the game on a site that refuses both embedding and code download \u2014 no player can fix that. Pick another game.');
        fateBumpRecent(g);
        return;
      }
      fatePStatus('code fetch failed \u2014 trying direct embed\u2026');
    }
  } else {
    fateShowSpin(true, 'Loading ' + g.name + '\u2026', g.source + ' \u00b7 direct CDN embed');
  }
  /* direct embed */
  if (seq !== FATE_PLAY_SEQ) return;
  fateShowSpin(false);
  frame.src = g.url;
  fatePStatus('direct CDN embed \u00b7 black screen? tap \u24e3 Code', '');
  fateArmHint(seq);
  fateBumpRecent(g);
}
function fatePlayCode(){
  if (FATE_CURRENT) fatePlay(FATE_CURRENT, true);
}
function fateBumpRecent(g){
  const k = gxKey(g);
  recent = [k, ...recent.filter(x => x !== k)].slice(0, 60);
  _lsSet(GX_RECENT_KEY, recent);
}
function fateClosePlayer(){
  FATE_PLAY_SEQ++;
  clearTimeout(FATE_HINT_TIMER);
  $id('fatePlayer').classList.add('hidden');
  $id('fateFrameDirect').src = 'about:blank';
  fateRevokeBlob();
  FATE_CURRENT = null;
  document.body.style.overflow = '';
  if (gxView === 'recent') renderGrid(true);
}
function fateReloadGame(){
  if (!FATE_CURRENT) return;
  fatePlay(FATE_CURRENT, FATE_NEED_CODE);
}
async function fateNewtabGame(){
  if (!FATE_CURRENT) return;
  const g = FATE_CURRENT;
  const tab = window.open('about:blank', '_blank');
  if (!tab){ alert('Allow popups to open the game in a new tab.'); return; }
  tab.opener = null;
  tab.document.title = 'Loading game HTML';
  tab.document.body.style.cssText = 'font:15px system-ui;background:#050505;color:#fcd34d;display:grid;place-items:center;height:100vh;margin:0';
  tab.document.body.textContent = 'Loading game HTML\u2026';
  try {
    let blob;
    if (FATE_ACTIVE_BLOB && (FATE_NEED_CODE || fateNeedsFetch(g.url))){
      const res = await fetch(FATE_ACTIVE_BLOB);
      blob = new Blob([await res.text()], { type: 'text/html' });
    } else if (fateNeedsFetch(g.url)){
      blob = new Blob([await fatePlayableHTML(g)], { type: 'text/html' });
    } else {
      return tab.location.replace(g.url);
    }
    if (tab.closed) return;
    const url = URL.createObjectURL(blob);
    tab.location.replace(url);
    const cleanup = setInterval(() => { if (tab.closed){ clearInterval(cleanup); URL.revokeObjectURL(url); } }, 10000);
  } catch(e){
    if (!tab.closed){
      tab.document.title = 'Game HTML unavailable';
      tab.document.body.textContent = 'Could not fetch this game\u2019s HTML. The host may block downloading its code.';
    }
  }
}
function fateFullscreenGame(){
  const w = $id('fatePWrap');
  if (w.requestFullscreen) w.requestFullscreen().catch(() => {});
  else if (w.webkitRequestFullscreen) w.webkitRequestFullscreen();
}

/* ---------- build pills / kinds ---------- */
function fateBuildFacets(){
  const srcCount = new Map();
  const kindCount = new Map();
  for (const g of GAMES){
    srcCount.set(g.source, (srcCount.get(g.source) || 0) + 1);
    kindCount.set(g.kind, (kindCount.get(g.kind) || 0) + 1);
  }
  const srcs = [...srcCount.entries()].sort((a, b) => b[1] - a[1]);
  const pills = $id('fateSources');
  pills.replaceChildren();
  const mkPill = (label, val, cnt) => {
    const p = document.createElement('button');
    p.className = 'pill' + (gxSource === val ? ' active' : '');
    p.innerHTML = label.replace(/</g, '&lt;') + ' <small>' + cnt.toLocaleString() + '</small>';
    p.onclick = () => { gxSource = val; fateBuildFacets(); renderGrid(true); pills.scrollLeft = 0; };
    return p;
  };
  pills.appendChild(mkPill('All libraries', 'All libraries', GAMES.length));
  for (const [s, c] of srcs) pills.appendChild(mkPill(s, s, c));
  const kinds = $id('fateKinds');
  kinds.replaceChildren();
  const kk = [['all', 'All kinds'], ['arcade', 'Arcade'], ...[...kindCount.entries()].filter(k => k[0] !== 'arcade').sort((a, b) => b[1] - a[1]).map(([k, c]) => [k, k + ' (' + c + ')'])];
  for (const [val, label] of kk){
    const b = document.createElement('button');
    b.className = 'kind' + (gxKind === val ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { gxKind = val; fateBuildFacets(); renderGrid(true); };
    kinds.appendChild(b);
  }
}

/* ---------- boot ---------- */
async function fateArcadeStart(){
  try {
    $id('fateHeroSub').innerHTML = 'unpacking <b>' + (window.FATE_GAMES_META ? window.FATE_GAMES_META.count.toLocaleString() : '22,000+') + '</b> games\u2026';
    const t0 = performance.now();
    GAMES = await fateDecodeCatalog();
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    const libs = new Set(GAMES.map(g => g.source)).size;
    $id('fateHeroSub').innerHTML = '<b>' + GAMES.length.toLocaleString() + ' games</b> \u00b7 ' + libs + ' libraries \u00b7 100% jsDelivr \u00b7 loaded in ' + secs + 's \u00b7 tap any card to play';
    document.querySelector('#fateSearch').placeholder = 'Search ' + GAMES.length.toLocaleString() + ' games\u2026';

}

/* ---------- wiring ---------- */
let searchDebounce;
$id('fateSearch').addEventListener('input', function(){

document.querySelectorAll('[data-view]').forEach(b => {

$id('fateSort').onchange = function(){ gxSort = this.value; renderGrid(true); };
$id('fateMore').onclick = appendGames;

$id('fateRandom').onclick = () => {
  const a = gxFilters();
  if (a.length) fatePlay(a[Math.floor(Math.random() * a.length)]);
};
$id('fatePBack').onclick = fateClosePlayer;
$id('fatePReload').onclick = fateReloadGame;
$id('fatePCode').onclick = fatePlayCode;
$id('fatePNewtab').onclick = fateNewtabGame;
$id('fatePFull').onclick = fateFullscreenGame;
$id('fatePErrRetry').onclick = () => FATE_CURRENT && fatePlay(FATE_CURRENT);
$id('fatePErrCode').onclick = fatePlayCode;
$id('fatePErrNewtab').onclick = fateNewtabGame;
$id('fatePErrClose').onclick = fateClosePlayer;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$id('fatePlayer').classList.contains('hidden')) fateClosePlayer(); });
/* infinite scroll (Storm recipe) */
document.querySelector('.main').insertBefore(scrollSentinel, document.querySelector('.load-more-wrap'));
const pagingObserver = new IntersectionObserver(checkScrollLoad, { rootMargin: '600px' });
pagingObserver.observe(scrollSentinel);
addEventListener('scroll', checkScrollLoad, { passive: true });

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fateArcadeStart, { once: true });
else fateArcadeStart();
/* ===== END FATE ARCADE ENGINE ===== */
