<script>
/* ===== V6 ACCESS GATE (same auth as the portal — opens straight through if you're logged in) ===== */
(function(){
  var AUTH_KEY='fate_v6_auth';
  function passes(){
    if(typeof FATE_PASS==='undefined')return['fate2026'];
    return Array.isArray(FATE_PASS)?FATE_PASS.map(String):[String(FATE_PASS)];
  }
  function hash(s){
    var h=5381;
    for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;
    return h.toString(36);
  }
  function isAuthed(){
    try{
      var v=localStorage.getItem(AUTH_KEY);
      return !!v&&passes().map(hash).indexOf(v)>-1;
    }catch(e){return false}
  }
  if(!isAuthed()){
    location.replace('index.html');
  }
})();
</script>

function fateWispUrl(s){ return s.includes('://') ? s : ('wss://' + s + '/'); }

/* exact port of the working portal's testWlspDomain() — binary wisp handshake */

/* ---------- catalog decode (gzip+base64, same technique as Storm0S) ---------- */
async function fateDecodeCatalog(){
  const b64 = window.FATE_GAMES_B64;
  if (!b64 || !b64.length) throw new Error('catalog file fate-games-cat.js is missing next to games.html');
  if (typeof DecompressionStream === 'undefined') throw new Error('this browser is too old — update iOS/Safari (needs 16.4+)');
  const parts = [];
  for (let i = 0; i < b64.length; i += 65536){
    const s = atob(b64.slice(i, i + 65536));
    const u = new Uint8Array(s.length);
    for (let j = 0; j < s.length; j++) u[j] = s.charCodeAt(j);
    parts.push(u);
  }
  const blob = new Blob(parts);
  const out = await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  const arr = JSON.parse(new TextDecoder().decode(out));
  return arr.map(e => ({
    name: String(e.n || 'Untitled'),
    url: String(e.u || ''),
    image: e.i ? String(e.i) : '',

    kind: e.k ? String(e.k) : 'arcade',

}

/* ---------- Storm0S play pipeline: retrieve -> withBase -> blob ---------- */
async function fateRetrieve(url){
  const list = [url];
  const m = url.match(/^https:\/\/cdn\.jsdelivr\.net\/gh\/([^/]+)\/([^/@]+)@([^/]+)\/(.*)$/);
  if (m) list.push('https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3] + '/' + m[4]);

      const ac = new AbortController(); const to = setTimeout(() => ac.abort(), 18000);
      const r = await fetch(u, { signal: ac.signal }); clearTimeout(to);
      if (!r.ok) continue;
      const t = await r.text();
      if (!/<html|<!doctype|<script|<iframe/i.test(t)) continue;
      return { text: t, url: r.url };
    } catch(e){}
  }
  throw Error('the host would not serve this game\u2019s HTML');
}
function fateWithBase(text, url){
  const doc = new DOMParser().parseFromString(text, 'text/html');
  if (!doc.querySelector('base')){
    const b = doc.createElement('base'); b.href = url;
    doc.head.prepend(b);
  }
  return '<!doctype html>\n' + doc.documentElement.outerHTML;
}
async function fatePlayableHTML(g, onStage){
  let r = await fateRetrieve(g.url);
  if (onStage) onStage('fetched ' + Math.round(r.text.length / 1024) + ' KB — preparing\u2026');
  if (g.source === 'Lumin'){
    /* peel single-iframe jsdelivr wrappers (up to 3 deep) */
    const visited = new Set([r.url]);
    for (let depth = 0; depth < 3; depth++){
      const doc = new DOMParser().parseFromString(r.text, 'text/html');
      const frames = doc.querySelectorAll('iframe[src]');
      if (frames.length !== 1 || doc.querySelector('canvas')) break;
      const raw = frames[0].getAttribute('src');
      const base = doc.querySelector('base[href]')?.getAttribute('href');
      const url = new URL(raw, base ? new URL(base, r.url).href : r.url).href;
      if (!/^https?:/.test(url) || !url.includes('jsdelivr.net/') || visited.has(url)) break;
      visited.add(url);
      if (onStage) onStage('unwrapping layer ' + (depth + 2) + '\u2026');
      r = await fateRetrieve(url);
    }
  }
  return fateWithBase(r.text, r.url);
}

/* ---------- filtering / rendering ---------- */
function gxFilters(){
  const q = gxQuery.trim().toLowerCase();
  const recentOrder = new Map(recent.map((k, i) => [k, i]));
  const a = GAMES.filter(g => {
    let text = searchText.get(g);
    if (text === undefined){
      text = (g.name + ' ' + g.source + ' ' + g.kind).toLowerCase();
      searchText.set(g, text);
    }
    return (gxKind === 'all' || g.kind === gxKind)
      && (gxSource === 'All libraries' || g.source === gxSource)
      && (!q || text.includes(q))
      && (gxView !== 'favorites' || favorites.has(gxKey(g)))
      && (gxView !== 'recent' || recentOrder.has(gxKey(g)));
  });
  if (gxView === 'recent') a.sort((x, y) => recentOrder.get(gxKey(x)) - recentOrder.get(gxKey(y)));
  else if (gxSort === 'source') a.sort((x, y) => nameCollator.compare(x.source, y.source) || nameCollator.compare(x.name, y.name));
  else a.sort((x, y) => (gxSort === 'za' ? -1 : 1) * nameCollator.compare(x.name, y.name));

}

});

$id('fateMore').onclick = appendGames;
$id('fateAuto').onclick = function(){
  gxAutoLoad = !gxAutoLoad;
  this.setAttribute('aria-pressed', String(gxAutoLoad));
  this.textContent = 'Auto-load: ' + (gxAutoLoad ? 'on' : 'off');
  if (gxAutoLoad) checkScrollLoad();
};
$id('fateRandom').onclick = () => {
  const a = gxFilters();
  if (a.length) fatePlay(a[Math.floor(Math.random() * a.length)]);
};
$id('fatePBack').onclick = fateClosePlayer;
$id('fatePReload').onclick = fateReloadGame;
$id('fatePTunnel').onclick = fatePlayViaJet;
$id('fatePNewtab').onclick = fateNewtabGame;
$id('fatePFull').onclick = fateFullscreenGame;
$id('fatePErrRetry').onclick = () => FATE_CURRENT && fatePlay(FATE_CURRENT);
$id('fatePErrTunnel').onclick = fatePlayViaJet;
$id('fatePErrNewtab').onclick = fateNewtabGame;
$id('fatePErrClose').onclick = fateClosePlayer;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$id('fatePlayer').classList.contains('hidden')) fateClosePlayer(); });
/* infinite scroll (Storm recipe) */
document.querySelector('.main').insertBefore(scrollSentinel, document.querySelector('.load-more-wrap'));
const pagingObserver = new IntersectionObserver(checkScrollLoad, { rootMargin: '600px' });
pagingObserver.observe(scrollSentinel);
addEventListener('scroll', checkScrollLoad, { passive: true });

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fateArcadeStart, { once: true });
else fateArcadeStart();
/* ===== END FATE ARCADE ENGINE ===== */
</script>
