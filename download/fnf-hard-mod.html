   FUNKIN' HARD — Week 1 Unfair Cut
   A single-file FNF-style rhythm game (Psych/Kade-inspired engine)
   * DFJK keybinds (+ arrow keys)  * touch pads for iPad  * NO ESC required
   * Songs: BOPEEBO / FRESH [HARD] / DAD BATTLE [SPAM]

============================================================================ */

// ---------------------------------------------------------------- utils ----
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const rnd=(a,b)=>a+Math.random()*(b-a);
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function loadLS(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function fmtT(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

// ------------------------------------------------------------- canvas ------
const CV=document.getElementById('c'),CX=CV.getContext('2d');
const W=1280,H=720;
let SCV=1,OX=0,OY=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const w=window.innerWidth,h=window.innerHeight;
  CV.width=Math.round(w*DPR);CV.height=Math.round(h*DPR);
  SCV=Math.min(w/W,h/H);OX=(w-W*SCV)/2;OY=(h-H*SCV)/2;
}
window.addEventListener('resize',resize);resize();
function beginFrame(){
  CX.setTransform(1,0,0,1,0,0);
  CX.fillStyle='#000';CX.fillRect(0,0,CV.width,CV.height);
  CX.setTransform(DPR*SCV,0,0,DPR*SCV,DPR*OX,DPR*OY);
}
function gameXY(cx,cy){return[(cx-OX)/SCV,(cy-OY)/SCV]}
function txt(s,x,y,size,col,align,italic,stroke,strokeW){
  CX.font=(italic?'italic ':'')+'900 '+size+'px "Arial Black","Arial Rounded MT Bold",Arial,sans-serif';
  CX.textAlign=align||'center';CX.textBaseline='middle';
  if(stroke){CX.lineWidth=strokeW||Math.max(3,size/7);CX.strokeStyle=stroke;CX.lineJoin='round';CX.strokeText(s,x,y)}
  CX.fillStyle=col;CX.fillText(s,x,y);
}

// ------------------------------------------------------------- options -----
const OPT_DEF={down:false,middle:false,ghost:true,bot:false,hsound:false,cam:true,flash:true,pads:true};
let opts=Object.assign({},OPT_DEF,loadLS('fhm_opts',{}));
function saveOpts(){store('fhm_opts',opts)}
let best=loadLS('fhm_best',{});
let isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;

// ---------------------------------------------------------- audio core -----
let AC=null,master,instBus,vocP,vocD,menuBus;
function audio(){
  if(AC)return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();
    comp.threshold.value=-14;comp.knee.value=20;comp.ratio.value=8;
    master=AC.createGain();master.gain.value=0.9;
    master.connect(comp);comp.connect(AC.destination);
    instBus=AC.createGain();instBus.gain.value=0.9;instBus.connect(master);
    vocP=AC.createGain();vocP.gain.value=1;vocP.connect(master);
    vocD=AC.createGain();vocD.gain.value=0.85;vocD.connect(master);
    menuBus=AC.createGain();menuBus.gain.value=0.42;menuBus.connect(master);
  }catch(e){AC=null}
  return AC;
}
function wake(){const c=audio();if(c&&c.state==='suspended')c.resume()}
const m2f=m=>440*Math.pow(2,(m-69)/12);
let noiseBuf=null;
function noiseSrc(w,dur){
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.start(w);s.stop(w+dur+0.06);return s;
}
function envG(g,w,a,peak,d){
  g.gain.setValueAtTime(0.0001,w);
  g.gain.linearRampToValueAtTime(peak,w+a);
  g.gain.exponentialRampToValueAtTime(0.0001,w+a+d);
}
// ---- drum / instrument voices (all scheduled, cheap, guard on AC) ----
function kick(w,v){v=v||1;if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(170,w);o.frequency.exponentialRampToValueAtTime(46,w+0.09);
  envG(g,w,0.002,0.9*v,0.16);o.connect(g);g.connect(instBus);o.start(w);o.stop(w+0.25);
  const n=noiseSrc(w,0.02),ng=AC.createGain();envG(ng,w,0.001,0.22*v,0.02);
  n.connect(ng);ng.connect(instBus);}
function snare(w,v){v=v||1;if(!AC)return;
  const n=noiseSrc(w,0.15),f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=0.7;
  const g=AC.createGain();envG(g,w,0.001,0.5*v,0.13);n.connect(f);f.connect(g);g.connect(instBus);
  const o=AC.createOscillator(),g2=AC.createGain();o.type='triangle';o.frequency.value=185;
  envG(g2,w,0.001,0.28*v,0.07);o.connect(g2);g2.connect(instBus);o.start(w);o.stop(w+0.1);}
function hat(w,open,v){v=v||1;if(!AC)return;
  const n=noiseSrc(w,open?0.3:0.045),f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7500;
  const g=AC.createGain();envG(g,w,0.001,(open?0.15:0.13)*v,open?0.26:0.04);
  n.connect(f);f.connect(g);g.connect(instBus);}
function crash(w,v){v=v||1;if(!AC)return;
  const n=noiseSrc(w,1.3),f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=4500;
  const g=AC.createGain();envG(g,w,0.002,0.3*v,1.2);n.connect(f);f.connect(g);g.connect(instBus);}
function bass(w,midi,dur,v){v=v||1;if(!AC)return;
  const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
  o.type='sawtooth';o.frequency.value=m2f(midi);
  f.type='lowpass';f.frequency.setValueAtTime(1100,w);f.frequency.exponentialRampToValueAtTime(240,w+dur);
  envG(g,w,0.004,0.3*v,dur);o.connect(f);f.connect(g);g.connect(instBus);o.start(w);o.stop(w+dur+0.08);
  const o2=AC.createOscillator(),g2=AC.createGain();o2.type='square';o2.frequency.value=m2f(midi-12);
  envG(g2,w,0.004,0.13*v,dur);o2.connect(g2);g2.connect(instBus);o2.start(w);o2.stop(w+dur+0.08);}
function stab(w,midis,dur,v){v=v||1;if(!AC)return;
  for(const m of midis){
    const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
    o.type='sawtooth';o.frequency.value=m2f(m);o.detune.value=rnd(-7,7);
    f.type='lowpass';f.frequency.value=2400;
    envG(g,w,0.004,0.085*v,dur);o.connect(f);f.connect(g);g.connect(instBus);o.start(w);o.stop(w+dur+0.06);}}
function pad(w,midis,dur){if(!AC)return;
  for(const m of midis){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';o.frequency.value=m2f(m);
    g.gain.setValueAtTime(0.0001,w);g.gain.linearRampToValueAtTime(0.05,w+0.3);
    g.gain.setValueAtTime(0.05,w+Math.max(0.3,dur-0.3));g.gain.linearRampToValueAtTime(0.0001,w+dur);
    o.connect(g);g.connect(instBus);o.start(w);o.stop(w+dur+0.06);}}
function pluck(w,midi,v){v=v||1;if(!AC)return;
  const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
  o.type='square';o.frequency.value=m2f(midi);
  f.type='lowpass';f.frequency.value=3000;
  envG(g,w,0.002,0.1*v,0.11);o.connect(f);f.connect(g);g.connect(instBus);o.start(w);o.stop(w+0.2);}
function arpEv(w,root){if(!AC)return;
  const seq=[root,root+7,root+12,root+7];
  for(let i=0;i<4;i++)pluck(w+i*0.083,seq[i],0.8);}
// ---- vocal blips ----
function blipBF(w,midi,dur){if(!AC)return;dur=dur||0.13;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='square';const f=m2f(midi);
  o.frequency.setValueAtTime(f*1.07,w);o.frequency.exponentialRampToValueAtTime(f,w+0.05);
  envG(g,w,0.004,0.15,dur);o.connect(g);g.connect(vocP);o.start(w);o.stop(w+dur+0.06);}
function blipDad(w,midi,dur){if(!AC)return;dur=dur||0.19;
  const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
  o.type='sawtooth';o.frequency.value=m2f(midi);f.type='lowpass';f.frequency.value=2100;
  const lfo=AC.createOscillator(),lg=AC.createGain();
  lfo.frequency.value=5.5;lg.gain.value=10;lfo.connect(lg);lg.connect(o.detune);
  envG(g,w,0.008,0.2,dur);o.connect(f);f.connect(g);g.connect(vocD);
  o.start(w);o.stop(w+dur+0.08);lfo.start(w);lfo.stop(w+dur+0.08);
  const s=AC.createOscillator(),sg=AC.createGain();s.type='sine';s.frequency.value=m2f(midi-12);
  envG(sg,w,0.008,0.12,dur);s.connect(sg);sg.connect(vocD);s.start(w);s.stop(w+dur+0.08);}
function vocDuck(){if(!AC)return;const w=AC.currentTime;
  try{vocP.gain.cancelScheduledValues(w);vocP.gain.setValueAtTime(vocP.gain.value,w);
  vocP.gain.linearRampToValueAtTime(0.0,w+0.015);vocP.gain.linearRampToValueAtTime(1,w+0.2);}catch(e){}}
// ---- immediate SFX ----
function sfxTone(f0,f1,dur,type,vol){if(!AC)return;const w=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(f0,w);if(f1)o.frequency.exponentialRampToValueAtTime(f1,w+dur);
  envG(g,w,0.003,vol||0.15,dur);o.connect(g);g.connect(master);o.start(w);o.stop(w+dur+0.05);}
const sScroll =()=>sfxTone(520,760,0.06,'square',0.1);
const sBack   =()=>sfxTone(420,240,0.09,'square',0.1);
function sConfirm(){sfxTone(600,600,0.07,'square',0.12);
  if(AC){setTimeout(()=>sfxTone(760,760,0.07,'square',0.12),70);setTimeout(()=>sfxTone(950,950,0.1,'square',0.12),140)}}
const sPause  =()=>sfxTone(700,320,0.14,'sine',0.2);
const sTick   =()=>sfxTone(1900,1900,0.03,'square',0.08);
function sMiss(){if(!AC)return;sfxTone(220,85,0.13,'square',0.22);
  const w=AC.currentTime,n=noiseSrc(w,0.1),f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=900;
  const g=AC.createGain();envG(g,w,0.001,0.2,0.1);n.connect(f);f.connect(g);g.connect(master);}
function sDeath(){if(!AC)return;sfxTone(400,55,0.9,'sawtooth',0.3);
  const w=AC.currentTime,n=noiseSrc(w,0.7),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=800;
  const g=AC.createGain();envG(g,w,0.01,0.3,0.65);n.connect(f);f.connect(g);g.connect(master);}

const NOTE_L=[0,3,7,12];  // lane -> scale offset
function buildEvents(song){
  const ev=[],gEv=[],P=PROG[song.id];
  const secLen=60000/song.bpm*4;
  song.secLen=secLen;
  const oct=t=>12*(((Math.floor(t/secLen)>>2)%2));
  for(const n of song.p){
    ev.push({t:n[0],k:'bf',m:P.vbf+NOTE_L[n[1]]+oct(n[0]),d:0.13+n[2]/1000});
    gEv.push({t:n[0],k:'pose',w:'b',l:n[1]});
  }
  for(const n of song.o){
    ev.push({t:n[0],k:'dad',m:P.vdad+NOTE_L[n[1]]+oct(n[0]),d:0.19+n[2]/1000});
    gEv.push({t:n[0],k:'pose',w:'d',l:n[1]});
  }
  instFor(song,ev);
  const beat=60000/song.bpm;
  ev.push({t:-4*beat,k:'cnt',f:880,d:0.12});
  ev.push({t:-3*beat,k:'cnt',f:880,d:0.12});
  ev.push({t:-2*beat,k:'cnt',f:880,d:0.12});
  ev.push({t:-1*beat,k:'cnt',f:1760,d:0.4});
  ev.sort((a,b)=>a.t-b.t);gEv.sort((a,b)=>a.t-b.t);
  return{aEv:ev,gEv:gEv};
}
function instFor(song,ev){
  const P=PROG[song.id],st=song.secLen/16,nSec=Math.ceil(song.len/song.secLen);
  const lvlArr=ILVL[song.id]||[];
  for(let s=0;s<nSec;s++){
    const lvl=lvlArr[Math.min(s,lvlArr.length-1)]||1;
    const a=s*song.secLen,root=P.roots[s%4],ch=P.chords[s%4];
    const K=(stp,k,x)=>ev.push({t:a+stp*st,k:k,x:x});
    if(lvl===5){ // outro: final hit in first outro section
      if(s===nSec-2){K(0,'crash');K(0,'bassend',{m:root});K(0,'chordend',{m:ch});}
      continue;
    }
    if(lvl===1){
      K(0,'kick');K(8,'kick');if(s%2)K(10,'kick');
      K(4,'snare');K(12,'snare');
      for(let i=0;i<16;i+=2)K(i,'hat');
      for(let i=0;i<16;i+=2)K(i,'bass',{m:root+((i===6||i===14)?12:0),d:st/1000*1.8});
      K(0,'pad',{m:ch,d:song.secLen/1000});
    }else if(lvl===2){
      if(song.id==='fresh'){ // halftime breakdown
        K(0,'kick');K(10,'kick');K(8,'snare');
        K(0,'hat');K(4,'hat');K(8,'hat');K(12,'hat');K(14,'open');
        K(0,'bass',{m:root,d:st/1000*2.5});K(6,'bass',{m:root,d:st/1000*2.5});
        K(8,'bass',{m:root+3,d:st/1000*2.5});K(14,'bass',{m:root,d:st/1000*2.5});
        K(0,'pad',{m:ch,d:song.secLen/1000});
      }else{
        K(0,'kick');K(7,'kick');K(8,'kick');
        K(4,'snare');K(12,'snare');
        for(let i=0;i<16;i+=2)K(i,'hat');K(14,'open');
        K(0,'bass',{m:root,d:st/1000*1.6});K(3,'bass',{m:root,d:st/1000*1.4});
        K(6,'bass',{m:root+7,d:st/1000*1.4});K(8,'bass',{m:root,d:st/1000*1.6});
        K(11,'bass',{m:root+7,d:st/1000*1.4});K(14,'bass',{m:root,d:st/1000*1.4});
        K(4,'stab',{m:ch,d:0.18});K(12,'stab',{m:ch,d:0.18});
      }
    }else if(lvl===3){
      K(0,'kick');K(4,'kick');K(8,'kick');K(12,'kick');if(s%2)K(7,'kick');
      K(4,'snare');K(12,'snare');
      for(let i=0;i<16;i+=2)K(i,'hat');K(12,'hat');K(13,'hat');K(14,'hat');K(15,'hat');K(14,'open');
      for(let i=0;i<16;i+=2)K(i,'bass',{m:root+(i===6?12:0),d:st/1000*1.5});
      K(15,'bass',{m:root+12,d:st/1000});
      K(4,'stab',{m:ch,d:0.16});K(12,'stab',{m:ch,d:0.16});
    }else if(lvl===4){
      K(0,'crash');
      K(0,'kick');K(4,'kick');K(7,'kick');K(8,'kick');K(12,'kick');
      K(4,'snare');K(12,'snare');
      for(let i=0;i<16;i++)K(i,'hat');K(14,'open');
      for(let i=0;i<16;i+=2)K(i,'bass',{m:root+(i===6?12:0),d:st/1000*1.3});
      K(0,'arp',{m:root+12});
      K(4,'stab',{m:ch,d:0.14});K(12,'stab',{m:ch,d:0.14});
    }
  }
}
function fireEV(e,when){
  const k=e.k;
  if(k==='kick')kick(when);
  else if(k==='snare')snare(when);
  else if(k==='hat')hat(when,false);
  else if(k==='open')hat(when,true);
  else if(k==='crash')crash(when);
  else if(k==='bass')bass(when,e.x.m,e.x.d);
  else if(k==='stab')stab(when,e.x.m,e.x.d);
  else if(k==='pad')pad(when,e.x.m,e.x.d);
  else if(k==='arp')arpEv(when,e.x);
  else if(k==='bassend')bass(when,e.x.m,1.2,1.2);
  else if(k==='chordend'){stab(when,e.x.m,1.4,1.3);stab(when,e.x.m.map(m=>m+12),1.4,0.7);}
  else if(k==='cnt')sfxTone(e.f,e.f,e.d,'square',0.18);
  else if(k==='bf')blipBF(when,e.m,e.d);
  else if(k==='dad')blipDad(when,e.m,e.d);
}

function startSong(id){

  }
  play={id,song:s,t:-4*beat,paused:false,over:false,
    startAt:0,perf0:0,frozenT:0,
    aEv:ev.aEv,gEv:ev.gEv,ai:0,gi:0,
    lanesP:[[],[],[],[]],opp:[],pp:[0,0,0,0],ap:[0,0,0,0],oPtr:0,
    score:0,combo:0,maxCombo:0,misses:0,breaks:0,accSum:0,accN:0,hits:0,
    cnt:{'SICK!!':0,'GOOD':0,'BAD':0,'SHIT':0},
    health:50,beat:-4,sec:-1,focus:'dad',pSecCount,
    zoomW:1,zoomH:1,camX:0,
    poseB:{lane:-1,until:-1e9},poseD:{lane:-1,until:-1e9},
    pops:[],splash:[],rec:[{press:-1e9,conf:-1e9},{press:-1e9,conf:-1e9},{press:-1e9,conf:-1e9},{press:-1e9,conf:-1e9}],
    oConf:[-1e9,-1e9,-1e9,-1e9],holds:[],bopT:0,missPoseT:0,done:false,flashT:0};
  for(const n of s.p)play.lanesP[n[1]].push({t:n[0],lane:n[1],sus:n[2],end:n[0]+n[2],hit:false,missed:false,done:false,dropped:false,tickN:0});
  for(const n of s.o)play.opp.push({t:n[0],lane:n[1],sus:n[2],end:n[0]+n[2]});
  play.opp.sort((a,b)=>a.t-b.t);
  if(AC){
    play.startAt=AC.currentTime+4*beat/1000+0.12;
    instBus.gain.cancelScheduledValues(AC.currentTime);
    instBus.gain.setValueAtTime(0.0001,AC.currentTime);
    instBus.gain.linearRampToValueAtTime(0.9,AC.currentTime+0.4);
    vocP.gain.setValueAtTime(1,AC.currentTime);
  }else play.perf0=performance.now()+4*beat;
  stopMenuMusic();
  ST='play';pauseSel=0;

function songNow(){
  if(!play)return 0;
  if(play.paused)return play.frozenT;
  if(AC)return (AC.currentTime-play.startAt)*1000;
  return performance.now()-play.perf0;
}
function skipTo(ms){
  if(!play)return;
  const d=ms-play.t;
  if(AC)play.startAt-=d/1000;else play.perf0-=d;
  for(const arr of play.lanesP)for(const n of arr){
    if(n.end+180<ms&&!n.hit){n.hit=true;n.silent=true;if(n.sus>0)n.done=true;}
  }
  play.ai=0;while(play.ai<play.aEv.length&&play.aEv[play.ai].t<ms)play.ai++;
  play.gi=0;while(play.gi<play.gEv.length&&play.gEv[play.gi].t<ms)play.gi++;
  play.beat=Math.floor(ms/(60000/play.song.bpm));
  play.sec=Math.floor(ms/play.song.secLen||ms/(60000/play.song.bpm*4));
  play.sec=Math.floor(ms/(60000/play.song.bpm*4));
  play.health=70;play.t=ms;
}
function pauseGame(){
  if(!play||play.paused||play.over)return;
  play.paused=true;
  if(AC){play.frozenT=songNow();AC.suspend().catch(()=>{});}

function endSong(){
  if(!play||play.over)return;
  play.over=true;
  const p=play,s=p.song;
  const acc=p.accN?p.accSum/p.accN*100:0;
  const breaks=p.breaks;
  let fc=p.accN>0?'CLEAR':'';
  if(p.accN>0){
    if(breaks===0)fc=(p.cnt.GOOD+p.cnt.BAD+p.cnt.SHIT===0)?'SFC':(p.cnt.BAD+p.cnt.SHIT===0)?'GFC':'FC';
    else if(breaks===1)fc='SDCB';
  }
  let grade='F';
  if(acc>=100&&p.misses===0&&p.cnt.BAD+p.cnt.SHIT===0)grade='S+';
  else if(acc>=95)grade='S';else if(acc>=90)grade='A';else if(acc>=80)grade='B';
  else if(acc>=70)grade='C';else if(acc>=60)grade='D';
  const sc={score:p.score,acc:Math.round(acc*100)/100,grade:grade};
  p.newBest=false;
  const old=best[p.id];
  if(!opts.bot){
    if(!old||sc.score>old.score){best[p.id]=sc;p.newBest=true;store('fhm_best',best);}
  }
  p.res={acc:acc,fc:fc,grade:grade};
  if(AC){instBus.gain.setTargetAtTime(0.0001,AC.currentTime,0.15);}
  sConfirm();startMenuMusic();
  ST='results';
}
// ------------------------------------------------------------- judgement ----
const JW={SICK:45,GOOD:90,BAD:135,SHIT:166,MISS:180};
const WT={'SICK!!':1,'GOOD':0.67,'BAD':0.34,'SHIT':0};
function heldCount(l){return (heldKey[l]?1:0)+(heldTouch[l]?1:0)}
function pressLane(l){
  if(!play||play.paused||play.over||ST!=='play')return;
  play.rec[l].press=play.t+110;
  if(opts.bot)return;
  let bestN=null,bestD=1e9;
  for(let i=play.ap[l];i<play.lanesP[l].length;i++){
    const n=play.lanesP[l][i];
    if(n.hit||n.missed)continue;
    const d=play.t-n.t;
    if(d<-220)break;
    if(d>220){if(i===play.ap[l])play.ap[l]++;continue;}
    const a=Math.abs(d);
    if(a<=JW.SHIT&&a<bestD){bestD=a;bestN=n;}
  }
  if(bestN)hitNote(bestN,play.t-bestN.t);
  else if(!opts.ghost)ghostMiss();
}
function judgeOf(a){return a<=JW.SICK?'SICK!!':a<=JW.GOOD?'GOOD':a<=JW.BAD?'BAD':'SHIT'}
function hitNote(n,diff){
  const p=play,r=judgeOf(Math.abs(diff));
  n.hit=true;p.hits++;p.cnt[r]++;p.accSum+=WT[r];p.accN++;
  p.combo++;p.maxCombo=Math.max(p.maxCombo,p.combo);
  p.score+={'SICK!!':350,'GOOD':200,'BAD':100,'SHIT':50}[r];
  p.health=clamp(p.health+{'SICK!!':2.3,'GOOD':1.2,'BAD':-0.3,'SHIT':-1.2}[r],0,100);
  p.rec[n.lane].conf=play.t+130;
  addPop(r,n.lane);
  if(r==='SICK!!')addSplash(n.lane);
  if(opts.hsound)sTick();
  if(n.sus>0){p.holds.push(n);n.tickN=0;}
  if(p.health<=0&&!opts.bot)killPlayer();
}
function doMiss(n,ghost){
  const p=play;
  p.misses++;p.breaks++;p.combo=0;
  p.health=clamp(p.health-(ghost?2:4.5),0,100);
  if(!ghost)p.accN++;
  sMiss();vocDuck();p.missPoseT=play.t+400;
  if(p.health<=0&&!opts.bot)killPlayer();
}
function ghostMiss(){doMiss(null,true)}

const KEYMAP={KeyD:0,KeyF:1,KeyJ:2,KeyK:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3};

window.addEventListener('keydown',e=>{
  if(e.code==='Backspace'||e.code==='Tab')e.preventDefault();

  wake();
  const l=KEYMAP[e.code];
  if(e.code==='Escape'){if(ST==='play')play.paused?resumeGame():pauseGame();return;}
  if(ST==='title'){if(e.code==='Enter'||e.code==='Space'||l!==undefined)toMenu();return;}
  if(ST==='menu'){
    if(e.code==='ArrowUp'||e.code==='KeyW'){menuSel=(menuSel+3)%4;sScroll();}
    if(e.code==='ArrowDown'||e.code==='KeyS'){menuSel=(menuSel+1)%4;sScroll();}
    if(e.code==='Enter'||e.code==='Space')menuConfirm();
    if(e.code==='Backspace')toTitle();
    return;
  }
  if(ST==='options'){
    if(e.code==='ArrowUp'||e.code==='KeyW'){optSel=(optSel+OPT_LIST.length)%(OPT_LIST.length+1);sScroll();}
    if(e.code==='ArrowDown'||e.code==='KeyS'){optSel=(optSel+1)%(OPT_LIST.length+1);sScroll();}
    if(e.code==='Enter'||e.code==='Space'||e.code==='ArrowLeft'||e.code==='ArrowRight')optToggle();
    if(e.code==='Backspace'){sBack();ST='menu';}
    return;
  }
  if(ST==='play'){
    if(play&&play.paused){pauseNav(e);return;}
    if(l!==undefined){heldKey[l]=true;pressLane(l);}
    if(e.code==='Enter'||e.code==='KeyP')pauseGame();
    if(e.code==='Backspace')pauseGame();
    return;
  }
  if(ST==='dead'){
    if(e.code==='Enter'){retry();}
    if(e.code==='Backspace')exitToMenu();
    return;
  }
  if(ST==='results'){
    if(e.code==='Enter'||e.code==='Space'||l!==undefined)exitToMenu();
    return;
  }
});

const touchLane=new Map();
function laneFromX(gx){return clamp(Math.floor(gx/(W/4)),0,3)}
CV.addEventListener('touchstart',e=>{
  e.preventDefault();wake();
  for(const t of e.changedTouches){
    const[gx,gy]=gameXY(t.clientX,t.clientY);
    if(tapUI(gx,gy))continue;
    if(ST==='play'&&play&&!play.paused){
      const l=laneFromX(gx);

    }else if(ST==='dead'){

},{passive:false});
CV.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(!touchLane.has(t.identifier))continue;
    const[gx]=gameXY(t.clientX,t.clientY);
    const l=laneFromX(gx),old=touchLane.get(t.identifier);
    if(l!==old){
      heldTouch[old]=Math.max(0,heldTouch[old]-1);
      touchLane.set(t.identifier,l);heldTouch[l]++;
    }
  }
},{passive:false});
function endTouch(e){

  for(const t of e.changedTouches){

  }

function tapUI(gx,gy){

// --------------------------------------------------------------- gameplay ---
function lanePX(l){return (opts.middle?640:1010)-112+l*112}
function laneOX(l){return (opts.middle?640:270)-112+l*112}
function strumY(){return opts.down?610:120}
function noteY(t){
  const v=0.45*play.song.speed*(H/720),sy=strumY();
  return opts.down? sy-(t-play.t)*v : sy+(t-play.t)*v;
}
function updatePlay(dt){
  const p=play;
  if(!p||p.paused||p.over)return;
  p.t=songNow();
  pump();
  const t=p.t;
  // botplay
  if(opts.bot){
    for(let l=0;l<4;l++){
      for(let i=p.ap[l];i<p.lanesP[l].length;i++){
        const n=p.lanesP[l][i];
        if(n.t>t)break;
        if(!n.hit){n.hit=true;p.hits++;p.cnt['SICK!!']++;p.accSum+=1;p.accN++;p.score+=350;
          p.combo++;p.maxCombo=Math.max(p.maxCombo,p.combo);
          p.rec[l].conf=t+130;
          if(n.sus>0){p.holds.push(n);n.tickN=0;}
          if(i===p.ap[l])p.ap[l]++;
        }
      }
    }
  }else{
    // misses
    for(let l=0;l<4;l++){
      for(let i=p.ap[l];i<p.lanesP[l].length;i++){
        const n=p.lanesP[l][i];
        if(n.t>t-JW.MISS)break;
        if(!n.hit&&!n.missed){n.missed=true;doMiss(n,false);}
        if(i===p.ap[l])p.ap[l]++;
      }
    }
  }
  // holds
  for(const h of p.holds){
    if(h.done)continue;
    const end=h.t+h.sus;
    if(t>=end){h.done=true;h.held=p.health;continue;}
    const held=opts.bot||heldCount(h.lane)>0;
    if(!held){h.dropped=true;h.done=true;continue;}
    while(t>=h.t+(h.tickN+1)*125){h.tickN++;p.score+=10;p.health=clamp(p.health+0.3,0,100);}
  }
  // opponent receptor flash
  while(p.oPtr<p.opp.length&&p.opp[p.oPtr].t<=t){
    const n=p.opp[p.oPtr];p.oConf[n.lane]=t+140;p.oPtr++;
  }
  // beat / section
  const bpm=p.song.bpm,beatMs=60000/bpm;
  const beat=Math.floor(t/beatMs);
  if(beat!==p.beat){
    p.beat=beat;p.bopT=t;
    if(opts.cam){
      const secHas=p.pSecCount[Math.floor(t/(beatMs*4))]>0||t<0;
      if(beat%4===0&&secHas)p.zoomW=1.045;
      p.zoomH=1.03;
    }
  }
  const sec=Math.floor(t/(beatMs*4));
  if(sec!==p.sec){p.sec=sec;p.focus=(p.pSecCount[sec]||0)>0?'bf':'dad';}
  p.zoomW=lerp(p.zoomW,1,dt*7);p.zoomH=lerp(p.zoomH,1,dt*9);
  p.camX=lerp(p.camX,p.focus==='bf'?-110:110,dt*3.5);
  // end
  if(t>p.song.len)endSong();
}
function pump(){
  const p=play;
  if(!AC)return;
  const ahead=p.t+700;
  while(p.ai<p.aEv.length&&p.aEv[p.ai].t<ahead){
    const e=p.aEv[p.ai++];
    if(e.t>p.t-1200)fireEV(e,p.startAt+e.t/1000);
  }
  while(p.gi<p.gEv.length&&p.gEv[p.gi].t<=p.t){
    const e=p.gEv[p.gi++];
    if(e.k==='pose'){
      const o=e.w==='b'?p.poseB:p.poseD;
      o.lane=e.l;o.until=p.t+380;
    }
  }
}

function drawNotes(){
  const p=play,c=CX,sy=strumY();
  // receptors
  for(let l=0;l<4;l++){
    const px=lanePX(l),ox=laneOX(l);
    const conf=p.rec[l].conf>p.t,press=heldCount(l)>0;
    let img=SPR.rec[l];
    if(conf)img=SPR.conf[l];else if(press)img=SPR.recP[l];
    c.drawImage(img,px-50,sy-50,100,100);
    const oconf=p.oConf[l]>p.t;
    c.globalAlpha=opts.middle?0.3:0.9;
    c.drawImage(oconf?SPR.conf[l]:SPR.rec[l],ox-50,sy-50,100,100);
    c.globalAlpha=1;
  }
  // opponent notes
  for(let i=p.oPtr;i<p.opp.length;i++){
    const n=p.opp[i];
    if(n.t>p.t+1400)break;
    const y=noteY(n.t);
    if(y<-160||y>H+160)continue;
    c.globalAlpha=opts.middle?0.25:0.85;
    c.drawImage(SPR.note[n.lane],laneOX(n.lane)-35,y-35,70,70);
    if(n.sus>0){
      const y2=noteY(n.t+n.sus);
      drawTrail(laneOX(n.lane),y,y2,n.lane,n.t,false,null);
    }
    c.globalAlpha=1;
  }
  // player notes
  for(let l=0;l<4;l++){
    for(let i=p.ap[l];i<p.lanesP[l].length;i++){
      const n=p.lanesP[l][i];
      if(n.t>p.t+1400)break;
      if(n.hit&&!n.sus)continue;
      const y=noteY(n.t);
      if(y<-160||y>H+160)continue;
      c.globalAlpha=n.missed?0.3:1;
      if(n.sus>0&&(!n.hit||!n.done)){
        const y2=noteY(n.t+n.sus);
        drawTrail(lanePX(l),y,y2,l,n.t,n.hit,n);
      }
      if(!n.hit)c.drawImage(SPR.note[l],lanePX(l)-35,y-35,70,70);
      c.globalAlpha=1;
    }
  }
}
function drawTrail(x,yHead,yTail,lane,tStart,holding,noteRef){
  const c=CX,sy=strumY();
  const up=!opts.down;
  let y1=yHead,y2=yTail;
  if(up){ // upscroll: future notes have larger y; trail spans below the head
    if(holding)y1=Math.max(y1,sy);
    if(y2<=y1)return;
  }else{
    if(holding)y1=Math.min(y1,sy);
    if(y2>=y1)return;
  }
  const dropped=noteRef?noteRef.dropped:false;
  const base=c.globalAlpha;
  c.globalAlpha=base*(dropped?0.2:0.75);
  c.fillStyle=NOTE_COL[lane];
  c.fillRect(x-11,Math.min(y1,y2),22,Math.abs(y2-y1));
  c.globalAlpha=base;
  c.drawImage(SPR.cap[lane],x-31,y2-31,62,62);
  c.globalAlpha=1;
}
function drawPops(dt){

  for(let i=0;i<8;i++){
    const x=((i*210+tGlob*26*(1+i%3))%(W+200))-100,y=(i*97)%H;
    c.save();c.translate(x,y);c.rotate(ROT[i%4]);c.drawImage(SPR.note[i%4],-40,-40,80,80);c.restore();
  }
  c.globalAlpha=1;
  txt('FREEPLAY',150,90,56,'#ffd21f','left',true,'#000',10);
  const items=[['BOPEEBO',''],['FRESH','HARD'],['DAD BATTLE','SPAM'],['OPTIONS','']];
  items.forEach((it,i)=>{
    const y=190+i*95,sel=i===menuSel;
    const name=it[0],tag=it[1];
    c.save();
    if(sel)c.translate(150+Math.sin(tGlob*6)*6,y);
    else c.translate(150,y);
    txt(name,0,0,sel?52:44,sel?'#fff':'#8a8aa0','left',sel,'#000',sel?8:6);
    if(tag){txt(tag,c.measureText(name).width*0+txtW(name)+(tag?18:0),0,26,tag==='SPAM'?'#ff5577':'#7fd4ff','left',true,'#000',4);}
    if(sel&&i<3){
      const s=CHARTS[SONG_IDS[i]];
      txt('LV '+'★'.repeat(Math.min(5,s.lv))+' '+s.lv,0,40,20,'#9f9fb8','left',false,'#000',4);
      const b=best[s.id];
      txt(b?('BEST: '+b.score+'  •  '+b.acc+'%  '+b.grade):'NO RECORD',0,66,17,'#6f6f88','left',false,'#000',3);
    }
    if(sel)addUI(100,y-45,700,90,()=>{menuSel=i;menuConfirm();});
    c.restore();
  });
  txt('ENTER select  •  BACKSPACE back  •  or tap',W/2,H-34,18,'#777');
}
function txtW(s){CX.font='900 52px "Arial Black",Arial,sans-serif';return CX.measureText(s).width}
function drawOptions(dt){
  const c=CX;
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101c33');g.addColorStop(1,'#070d1c');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  txt('OPTIONS',W/2,80,54,'#7fd4ff','center',true,'#000',10);
  OPT_LIST.forEach((o,i)=>{
    const y=148+i*62,sel=i===optSel;
    if(sel){c.fillStyle='rgba(255,255,255,0.08)';c.beginPath();c.roundRect(240,y-26,800,54,12);c.fill();}
    txt(o[1],290,y,sel?30:26,sel?'#fff':'#9a9ab0','left',sel,'#000',5);
    const on=opts[o[0]];
    c.fillStyle=on?'#3fd45f':'#44445a';
    c.beginPath();c.roundRect(880,y-20,130,40,20);c.fill();
    txt(on?'ON':'OFF',945,y,22,'#fff','center',false,'#000',4);
    addUI(240,y-26,800,54,()=>{optSel=i;optToggle();});
  });
  const ry=148+OPT_LIST.length*62;
  const sel=optSel===OPT_LIST.length;
  if(sel){c.fillStyle='rgba(255,255,255,0.08)';c.beginPath();c.roundRect(240,ry-26,800,54,12);c.fill();}
  txt('RESET BEST SCORES',290,ry,sel?30:26,sel?'#ff7d8f':'#9a9ab0','left',sel,'#000',5);
  addUI(240,ry-26,800,54,()=>{optSel=OPT_LIST.length;optToggle();});
  const d=optSel===OPT_LIST.length?'Wipe your saved records':OPT_LIST[optSel][2];
  txt(d,W/2,H-72,22,'#cfcfe2','center',false,'#000',4);
  txt('ENTER toggle  •  BACKSPACE back  •  or tap',W/2,H-34,18,'#777');
}
function drawDead(dt){
  const c=CX;
  deadT+=dt;
  c.fillStyle='#0a0512';c.fillRect(0,0,W,H);
  const g=c.createRadialGradient(W/2,H/2,60,W/2,H/2,600);
  g.addColorStop(0,'rgba(120,0,30,0.35)');g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  const fy=340+Math.sin(deadT*2.2)*18;
  c.save();c.translate(W/2,fy);c.rotate(Math.sin(deadT*1.4)*0.06);
  c.fillStyle='#39b3d7';c.beginPath();c.arc(0,0,70,0,7);c.fill();
  c.fillStyle='#fff';
  c.beginPath();c.ellipse(-22,-10,10,14,0,0,7);c.ellipse(22,-10,10,14,0,0,7);c.fill();
  c.fillStyle='#111';c.beginPath();c.arc(-20,-8,4.5,0,7);c.arc(24,-8,4.5,0,7);c.fill();
  c.strokeStyle='#111';c.lineWidth=5;
  c.beginPath();c.arc(0,26,16,Math.PI*1.15,Math.PI*1.85,false);c.stroke();
  c.restore();
  txt('YOU GOT PUNKED',W/2,500,58,'#ff3d5a','center',true,'#000',12);
  if(Math.floor(deadT*1.8)%2===0)txt(isTouch?'TAP BELOW TO RETRY':'PRESS ENTER TO RETRY',W/2,575,30,'#fff','center',false,'#000',6);
  c.fillStyle='rgba(255,255,255,0.12)';c.beginPath();c.roundRect(W/2-200,615,400,64,16);c.fill();
  txt('RETRY',W/2,647,30,'#fff','center',false,'#000',6);
  addUI(W/2-200,615,400,64,()=>retry());
  addUI(20,20,120,50,()=>exitToMenu());
  txt('MENU',80,45,22,'#aaa','center',false,'#000',4);
}
function drawResults(dt){
  const c=CX,p=play;
  c.fillStyle='#0b0716';c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,0.04)';
  c.beginPath();c.roundRect(140,70,1000,580,24);c.fill();
  const s=p.song;
  txt('CLEAR!',W/2,140,64,'#7fd4ff','center',true,'#000',12);
  txt(s.name+(s.tag?' -'+s.tag+'-':''),W/2,205,34,'#fff','center',false,'#000',6);
  const r=p.res;
  const gcol={'S+':'#ffd21f','S':'#ffd21f','A':'#7fd457','B':'#7fd4ff','C':'#c9b8ff','D':'#ff9d5c','F':'#ff5577'}[r.grade];
  c.save();c.translate(1020,330);c.rotate(0.06);
  txt(r.grade,0,0,150,gcol,'center',true,'#000',16);
  c.restore();
  if(r.fc)txt(r.fc,1020,430,30,'#fff','center',true,'#000',6);
  const rows=[
    'Score:  '+p.score,
    'Notes hit:  '+p.hits+' / '+p.song.p.length,
    'Max combo:  '+p.maxCombo,
    'Misses:  '+p.misses,
    'Accuracy:  '+r.acc.toFixed(2)+'%',
    'SICK '+p.cnt['SICK!!']+'  •  GOOD '+p.cnt.GOOD+'  •  BAD '+p.cnt.BAD+'  •  SHIT '+p.cnt.SHIT
  ];
  rows.forEach((row,i)=>{txt(row,240,290+i*48,26,i===5?'#9f9fb8':'#fff','left',false,'#000',4);});
  if(p.newBest&&Math.floor(tGlob*2.5)%2===0)txt('NEW BEST!',240,590,34,'#ffd21f','left',true,'#000',7);
  if(opts.bot)txt('BOTPLAY — score not saved',240,590,26,'#ffdd44','left',false,'#000',5);
  txt(isTouch?'tap to continue':'press ENTER to continue',W/2,695,20,'#888');
  addUI(0,0,W,H,()=>exitToMenu());
}
// ------------------------------------------------------------------ loop ----
let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(ts-lastTs)/1000||0.016);lastTs=ts;
  tGlob+=dt;frame++;
  hitUI.length=0;
  if(ST==='title'){introIdx=Math.floor(tGlob/1.9);}
  if(ST==='menu')menuT+=dt;
  if(ST==='play')updatePlay(dt);
  if(ST==='dead')deadT+=0;
  beginFrame();
  if(ST==='title')drawTitle(dt);
  else if(ST==='menu')drawMenu(dt);
  else if(ST==='options')drawOptions(dt);
  else if(ST==='play')drawPlay(dt);
  else if(ST==='dead')drawDead(dt);
  else if(ST==='results')drawResults(dt);
  menuTick();deathTick();
}
// ------------------------------------------------------------------- boot ---
buildSprites();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&ST==='play'&&play&&!play.paused)pauseGame();
});
requestAnimationFrame(loop);
// test hooks (headless preview): ?test=menu  |  ?test=play&song=fresh&bot=1&seek=30000
(function(){
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('pads')==='1')isTouch=true;
    if(q.get('test')==='menu'){ST='menu';return;}
    if(q.get('test')==='play'){
      opts.bot=q.get('bot')==='1';
      startSong(q.get('song')||'fresh');
      const sk=parseInt(q.get('seek')||'0',10);
      if(sk>0)setTimeout(()=>{skipTo(sk)},250);
    }
  }catch(e){}
})();
</script>
